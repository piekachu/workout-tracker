<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Expenses</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/charts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="site-nav">
      <a href="../">Home</a>
      <a href="../tasks/">Tasks</a>
      <a href="../progress/">Progress</a>
      <a href="../workout/">Workout</a>
      <a href="../vocab/">Vocab</a>
      <a href="./" class="active">Expenses</a>
      <a href="../drugs/">Drugs</a>
    </nav>
    <h1 class="page-title">Expenses</h1>
  </header>

  <main>
   <div class="ex-grid">
   <div class="ex-col">
    <!-- month switcher + totals -->
    <section id="summary">
      <div class="month-bar">
        <button type="button" class="month-btn" id="prev-month" aria-label="Previous month">‹</button>
        <button type="button" class="month-label" id="month-label" aria-label="Jump to this month"></button>
        <button type="button" class="month-btn" id="next-month" aria-label="Next month">›</button>
      </div>
      <div class="total" id="total-spent">–</div>
      <div class="total-sub" id="total-sub">spent this month</div>
      <div class="net-row" id="net-row" hidden>
        <span>Income <strong id="total-income"></strong></span>
        <span>Net <strong id="total-net"></strong></span>
      </div>
      <div id="breakdown" class="breakdown" hidden></div>
      <div id="ex-donut" class="donut-wrap"></div>
      <div class="card" id="daily-card">
        <h2>Daily spending</h2>
        <div class="chart" id="ex-daily"></div>
      </div>
    </section>

    <!-- add / edit -->


    <section class="tools">
      <div class="tool-row">
        <label for="currency">Currency</label>
        <select id="currency">
          <option value="KRW">₩ Won (KRW)</option>
          <option value="USD">$ Dollar (USD)</option>
          <option value="EUR">€ Euro (EUR)</option>
          <option value="JPY">¥ Yen (JPY)</option>
        </select>
      </div>
      <div class="tool-row">
        <button type="button" class="btn" id="export-month">Export this month (CSV)</button>
        <button type="button" class="btn" id="export-all">Export everything (CSV)</button>
      </div>
      <p class="fineprint">Records are stored in your private Supabase project and visible only when you're signed in. Still, keep account numbers out of notes.</p>
    </section>
   </div>
   <div class="ex-col">
    <section id="entry" class="card">
      <div class="entry-head">
        <h2 id="entry-title">Add</h2>
        <div class="seg" id="kind-seg" role="group" aria-label="Type">
          <button type="button" data-kind="expense" class="on">Expense</button>
          <button type="button" data-kind="income">Income</button>
        </div>
      </div>

      <label class="lbl" for="amount">Amount</label>
      <div class="amount-wrap">
        <span class="cur" id="cur-sym">₩</span>
        <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0" />
        <button type="button" class="clear-amt" id="clear-amt" aria-label="Clear amount">✕</button>
      </div>
      <div class="quick" id="quick"></div>

      <label class="lbl">Category</label>
      <div class="chips" id="cat-chips"></div>

      <div class="row2">
        <div>
          <label class="lbl" for="note">Note</label>
          <input id="note" type="text" placeholder="optional" autocomplete="off" />
        </div>
        <div>
          <label class="lbl" for="date">Date</label>
          <input id="date" type="date" />
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="save">Save</button>
        <button type="button" class="btn" id="cancel-edit" hidden>Cancel</button>
        <button type="button" class="btn danger" id="delete" hidden>Delete</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </section>

    <!-- list -->
    <section id="list-section">
      <h2>This month</h2>
      <div id="list"></div>
    </section>
   </div>
   </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="../shared/charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
