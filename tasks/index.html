<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tasks</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/charts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="site-nav" id="site-nav" data-root="../" aria-label="Main"></nav>
<script src="../shared/nav.js"></script>
<script src="../shared/ui.js"></script>
  <header>
    <h1 class="page-title">Tasks</h1>
  </header>

  <main>
    <div class="cal-toolbar">
      <h2 class="cal-title" id="period-label"></h2>
      <div class="cal-tools">
        <div class="view-btns" id="view-btns" role="group" aria-label="View">
          <button type="button" data-view="day">Day</button>
          <button type="button" data-view="week">Week</button>
          <button type="button" data-view="month">Month</button>
          <button type="button" data-view="nested">Subtasks</button>
        </div>
        <button type="button" class="tb-btn" id="today-btn">Today</button>
        <button type="button" class="tb-icon" id="prev" aria-label="Previous"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="tb-icon" id="next" aria-label="Next"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="top-strip">
    <form class="add-row" id="add-form" autocomplete="off">
    <input id="add-title" type="text" maxlength="200" enterkeyhint="done" aria-label="New task">
    <button type="submit">Add</button>
    <button type="button" id="add-paste" hidden>Paste</button>
  </form>
    <div class="rings-row" id="rings" aria-label="Completion">
      <div class="ring-cell"><div id="r-today" class="ring-host"></div><span>Today</span></div>
      <div class="ring-cell"><div id="r-week" class="ring-host"></div><span>This week</span></div>
      <div class="ring-cell"><div id="r-month" class="ring-host"></div><span>This month</span></div>
    </div>
    </div>
    <div id="content"></div>
  </main>


  <div class="sheet-backdrop" id="sheet" hidden>
    <form class="sheet" id="edit-form" autocomplete="off">
      <h2>Edit task</h2>
      <label>Title<input id="f-title" type="text" maxlength="200" required></label>
      <label>Description<textarea id="f-notes" rows="3" placeholder="What is this about? (shown on the Today page too)"></textarea></label>
      <div class="row2">
        <label>Start date<input id="f-date" type="date"></label>
        <label><span>End date <span class="opt">· optional</span></span><input id="f-end-date" type="date"></label>
      </div>
      <div class="dur-chips" id="dur-chips"></div>
      <div class="end-info" id="f-endinfo" hidden></div>
      <label class="chk" id="f-unsched-row" hidden><input type="checkbox" id="f-unsched"> Not scheduled yet (keep it as a waiting sub-task)</label>
      <div class="row2" id="f-time-row">
        <label>Start time<input id="f-start" type="time"></label>
        <label>End time<input id="f-end" type="time"></label>
      </div>
      <div class="color-field">
        <span class="lbl">Color</span>
        <div class="swatches" id="f-colors" role="radiogroup" aria-label="Color"></div>
      </div>
      <label>Repeat
        <select id="f-recur"><option value="">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select>
      </label>
      <div class="kids-wrap" id="f-kids-wrap" hidden>
        <span class="lbl">Sub-tasks</span>
        <div id="f-kids"></div>
        <div class="kid-add"><input id="f-kid" type="text" maxlength="200" placeholder="Add a sub-task" enterkeyhint="done"><button type="button" id="f-kid-add">Add</button></div>
      </div>
      <label class="chk"><input type="checkbox" id="f-done"> Completed</label>
      <div class="sheet-actions">
        <span id="f-more-host"></span>
        <span class="spacer"></span>
        <button type="button" id="f-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="../shared/tasks-core.js"></script>
  <script src="../shared/charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
