<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tasks</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="../shared/charts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="site-nav" id="site-nav" data-root="../" aria-label="Main"></nav>
<script src="../shared/nav.js"></script>
  <header>
    <h1 class="page-title">Tasks</h1>
  </header>

  <main>
    <div class="cal-toolbar">
      <h2 class="cal-title" id="period-label"></h2>
      <div class="cal-tools">
        <select id="view-select" aria-label="View">
          <option value="day">Day</option>
          <option value="week">Week</option>
          <option value="month">Month</option>
        </select>
        <button type="button" class="tb-btn" id="today-btn">Today</button>
        <button type="button" class="tb-icon" id="prev" aria-label="Previous"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="tb-icon" id="next" aria-label="Next"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="top-strip">
    <form class="add-row" id="add-form" autocomplete="off">
    <input id="add-title" type="text" maxlength="200" enterkeyhint="done" aria-label="New task">
    <button type="submit">Add</button>
  </form>
    <div class="rings-row" id="rings" aria-label="Completion">
      <div class="ring-cell"><div id="r-today" class="ring-host"></div><span>Today</span></div>
      <div class="ring-cell"><div id="r-week" class="ring-host"></div><span>This week</span></div>
      <div class="ring-cell"><div id="r-month" class="ring-host"></div><span>This month</span></div>
    </div>
    </div>
    <div id="content"></div>
  </main>


  <div class="sheet-backdrop" id="sheet" hidden>
    <form class="sheet" id="edit-form" autocomplete="off">
      <h2>Edit task</h2>
      <label>Title<input id="f-title" type="text" maxlength="200" required></label>
      <label>Notes<textarea id="f-notes" rows="3"></textarea></label>
      <div class="row2">
        <label>Scope
          <select id="f-horizon"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option></select>
        </label>
        <label>Date<input id="f-date" type="date" required></label>
      </div>
      <div class="row2" id="f-time-row">
        <label>Start<input id="f-start" type="time"></label>
        <label>End<input id="f-end" type="time"></label>
      </div>
      <div class="row2">
        <label>Priority
          <select id="f-priority"><option value="0">Normal</option><option value="1">Medium</option><option value="2">High</option></select>
        </label>
        <label>Repeat
          <select id="f-recur"><option value="">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select>
        </label>
      </div>
      <div class="sheet-actions">
        <button type="button" class="danger" id="f-delete">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="f-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="../shared/tasks-core.js"></script>
  <script src="../shared/charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
