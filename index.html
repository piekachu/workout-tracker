<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Today</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    header, main { max-width: 640px; margin: 0 auto; }
    header { padding: 32px 20px 0; }
    main { padding: 28px 20px 60px; }

    h1.page-title { font-size: 1.9rem; }
    .lede {
      color: var(--text-dim);
      margin: 0 0 32px;
      max-width: 46ch;
      line-height: 1.5;
    }

    /* One card per page on the site. New pages: add one object to the
       PAGES array in the script below -- nothing else changes. */
    .app-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .app-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }
    .app-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-1);
    }
    .app-card:active { transform: scale(0.99); }
    .app-card .monogram {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: calc(var(--radius) - 2px);
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.15rem;
    }
    .app-card .body { flex: 1 1 auto; min-width: 0; }
    .app-card .name {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 2px;
    }
    .app-card .tagline {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .app-card .arrow {
      flex: 0 0 auto;
      color: var(--text-faint);
      font-size: 1.2rem;
      transition: transform 0.15s ease, color 0.15s ease;
    }
    .app-card:hover .arrow { color: var(--accent); transform: translateX(2px); }

    /* Last-14-weeks activity, compact: 14 columns x 7 rows, one dot per day. */
    .app-card .mini-heat {
      flex: 0 0 auto;
      display: grid;
      grid-template-rows: repeat(7, 4px);
      grid-auto-flow: column;
      grid-auto-columns: 4px;
      gap: 2px;
    }
    .app-card .mini-heat .d { width: 4px; height: 4px; border-radius: 1px; background: var(--border-2); }
    .app-card .mini-heat .d.on { background: var(--accent); }
    .app-card .mini-heat.loading { opacity: 0.3; }
    @media (max-width: 480px) { .app-card .mini-heat { display: none; } }


    /* ---- Today: the habit checklist ---- */
    .today-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
    .today-date { color: var(--text-dim); font-size: 0.95rem; }
    .today-count { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); letter-spacing: 0.04em; }
    .today-bar { height: 4px; border-radius: 2px; background: var(--border-2); overflow: hidden; margin: 0 0 18px; }
    .today-bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s ease; }

    .habits { display: flex; flex-direction: column; gap: 10px; }
    .habit {
      display: flex; align-items: center; gap: 14px; min-height: 68px;
      padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: inherit; text-decoration: none; font: inherit; text-align: left;
      width: 100%; cursor: pointer; transition: border-color 0.15s ease, transform 0.1s ease;
    }
    .habit:active { transform: scale(0.99); }
    .habit.next { border-color: var(--accent); box-shadow: var(--shadow-1); }
    .habit .tick {
      flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
      color: transparent; font-size: 17px; line-height: 1; transition: background 0.15s ease, border-color 0.15s ease;
    }
    .habit.done .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
    .habit .body { flex: 1 1 auto; min-width: 0; }
    .habit .name { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; color: var(--text); }
    .habit.done .name { color: var(--text-dim); }
    .habit .sub { font-size: 0.82rem; color: var(--text-dim); line-height: 1.35; margin-top: 1px; }
    .habit .go { flex: 0 0 auto; color: var(--accent); font-size: 0.85rem; font-weight: 600; white-space: nowrap; }
    .habit.done .go { display: none; }
    .habit .x { flex: 0 0 auto; width: 44px; height: 44px; margin: -6px -8px -6px 0; border: 0; background: none;
      color: var(--danger); font-size: 20px; cursor: pointer; display: none; }
    .editing .habit .x { display: block; }
    .skeleton .sub { color: var(--text-faint); }

    .habit-add { display: flex; gap: 8px; margin-top: 12px; }
    .habit-add input { flex: 1 1 auto; min-width: 0; height: 48px; padding: 0 14px; font-size: 16px; font-family: inherit;
      color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .habit-add button, .link-btn { height: 48px; padding: 0 16px; font-size: 15px; font-weight: 600; font-family: inherit;
      border-radius: var(--radius); cursor: pointer; }
    .habit-add button { border: 0; background: var(--accent); color: #fff; }
    .link-btn { height: 44px; border: 0; background: none; color: var(--text-dim); font-weight: 500; font-size: 13px; padding: 0 4px; }
    .habit-tools { display: flex; justify-content: flex-end; margin-top: 4px; }
    .section-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-faint); margin: 36px 0 12px; }
    .toast-err { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 50; }

    footer {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px 40px;
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 420px) {
      header, main, footer { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="site-nav">
      <a href="./" class="active">Home</a>
      <a href="workout/">Workout</a>
      <a href="vocab/">Vocab</a>
      <a href="expenses/">Expenses</a>
      <a href="drugs/">Drugs</a>
    </nav>
    <div class="page-eyebrow">piekachu.github.io/workout-tracker</div>
    <h1 class="page-title">Today</h1>
  </header>

  <main>
    <div class="today-meta">
      <span class="today-date" id="today-date"></span>
      <span class="today-count" id="today-count"></span>
    </div>
    <div class="today-bar"><i id="today-bar"></i></div>

    <div id="habits-wrap">
      <div class="habits" id="habits"></div>
      <form class="habit-add" id="habit-add" autocomplete="off">
        <input id="habit-name" type="text" placeholder="Add a habit (water, reading, sleep…)" maxlength="60" enterkeyhint="done">
        <button type="submit">Add</button>
      </form>
      <div class="habit-tools"><button class="link-btn" id="habit-edit" type="button">Remove habits</button></div>
    </div>

    <div class="section-title">Tools</div>
    <div class="app-grid" id="app-grid"></div>
  </main>

  <footer>Private — your data is visible only when signed in.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="shared/auth.js"></script>
  <script>
    const sb = Auth.client;
    const VOCAB_SLOT_ID = "56ba90d2a3a5add3cb";
    const WORKOUT_GROUPS = ["Back + Biceps", "Chest + Triceps", "Shoulder + Arms", "Legs", "Whole body"];

    // Local-date strings only (never toISOString: it is UTC and reports
    // yesterday for the first hours of the day in Asia/Seoul).
    function localISO(d) {
      const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }
    const addDaysISO = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return localISO(new Date(y, m - 1, d + n)); };
    const TODAY = localISO(new Date());

    // Consecutive days up to today (a day not yet done doesn't break a streak
    // that was alive yesterday).
    function streakOf(dates) {
      let day = dates.has(TODAY) ? TODAY : addDaysISO(TODAY, -1), n = 0;
      while (dates.has(day)) { n++; day = addDaysISO(day, -1); }
      return n;
    }
    const withStreak = (text, n) => (n >= 2 ? `${text} · ${n}-day streak` : text);

    // Each data source is fetched once and shared by the checklist and the
    // 14-week strips below it.
    function once(fn) { let p; return () => (p = p || fn()); }
    const SRC = {
      sessions: once(async () => {
        const { data, error } = await sb.from("workout_sessions").select("log_date, category").order("log_date", { ascending: false });
        if (error) throw error; return data || [];
      }),
      drugLog: once(async () => {
        const { data, error } = await sb.from("drug_log").select("studied_on");
        if (error) throw error; return data || [];
      }),
      expenses: once(async () => {
        const { data, error } = await sb.from("expenses").select("spent_on");
        if (error) throw error; return data || [];
      }),
      vocab: once(async () => {
        const { data, error } = await sb.from("kv_store").select("data").eq("slot_id", VOCAB_SLOT_ID).maybeSingle();
        if (error) throw error; return (data && data.data) || {};
      }),
      drugs: once(() => new Promise((resolve, reject) => {
        const el = document.createElement("script");
        el.src = "drugs/data.js"; el.onload = () => resolve(window.DRUGS || []); el.onerror = reject;
        document.head.appendChild(el);
      })),
      habits: once(async () => {
        const { data, error } = await sb.from("habits").select("id, name, sort_order").eq("archived", false).order("sort_order").order("id");
        if (error) throw error; return data || [];
      }),
      habitLog: once(async () => {
        const { data, error } = await sb.from("habit_log").select("habit_id, done_on");
        if (error) throw error; return data || [];
      }),
    };

    // ---------------- the checklist ----------------
    const $ = (id) => document.getElementById(id);
    function el(tag, attrs = {}, ...kids) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v);
      }
      kids.flat().forEach((c) => e.append(c));
      return e;
    }
    $("today-date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    const state = { core: {}, custom: [], editing: false };   // core[key] = { done, sub, streak }
    const CORE = [
      { key: "vocab",   name: "Vocab",           href: "vocab/",   go: "Review" },
      { key: "drugs",   name: "Drug of the day", href: "drugs/",   go: "Study" },
      { key: "workout", name: "Workout",         href: "workout/", go: "Log" },
    ];

    function toast(msg) {
      const t = el("div", { class: "toast-err", role: "status" }, msg); document.body.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    function render() {
      const list = $("habits"); list.innerHTML = "";
      const firstPending = CORE.find((c) => state.core[c.key] && !state.core[c.key].done);
      let done = 0, total = 0;
      for (const c of CORE) {
        const st = state.core[c.key];
        total++; if (st && st.done) done++;
        const row = el("a", { class: "habit" + (st && st.done ? " done" : "") + (!st ? " skeleton" : "") + (firstPending === c ? " next" : ""), href: c.href },
          el("span", { class: "tick" }, "✓"),
          el("span", { class: "body" }, el("div", { class: "name" }, c.name), el("div", { class: "sub" }, st ? withStreak(st.sub, st.streak) : "Loading…")),
          el("span", { class: "go" }, c.go + " →"));
        list.appendChild(row);
      }
      for (const h of state.custom) {
        total++; if (h.done) done++;
        const row = el("div", { class: "habit" + (h.done ? " done" : ""), role: "button", tabindex: "0", "aria-pressed": String(h.done),
            onclick: (e) => { if (!e.target.closest(".x")) toggle(h); },
            onkeydown: (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(h); } } },
          el("span", { class: "tick" }, "✓"),
          el("span", { class: "body" }, el("div", { class: "name" }, h.name),
            el("div", { class: "sub" }, withStreak(h.done ? "Done today" : "Tap when done", h.streak))),
          el("button", { class: "x", type: "button", "aria-label": "Remove " + h.name, onclick: () => removeHabit(h) }, "✕"));
        list.appendChild(row);
      }
      $("habits-wrap").classList.toggle("editing", state.editing);
      $("habit-edit").textContent = state.editing ? "Done" : "Remove habits";
      $("habit-edit").style.display = state.custom.length ? "" : "none";
      $("today-count").textContent = `${done} of ${total} done`;
      $("today-bar").style.width = total ? Math.round((done / total) * 100) + "%" : "0%";
    }

    async function toggle(h) {
      const was = h.done;
      h.done = !was; h.dates[was ? "delete" : "add"](TODAY); h.streak = streakOf(h.dates); render();
      const q = was
        ? sb.from("habit_log").delete().eq("habit_id", h.id).eq("done_on", TODAY)
        : sb.from("habit_log").upsert({ habit_id: h.id, done_on: TODAY }, { onConflict: "habit_id,done_on" });
      const { error } = await q;
      if (error) { h.done = was; h.dates[was ? "add" : "delete"](TODAY); h.streak = streakOf(h.dates); render(); toast("Couldn't save — check your connection"); }
    }

    async function removeHabit(h) {
      if (!confirm(`Remove "${h.name}"? Its history is kept; it just stops showing.`)) return;
      const { error } = await sb.from("habits").update({ archived: true }).eq("id", h.id);
      if (error) { toast("Couldn't remove it"); return; }
      state.custom = state.custom.filter((x) => x !== h); render();
    }

    $("habit-add").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = $("habit-name"), name = input.value.trim();
      if (!name) return;
      input.disabled = true;
      const order = state.custom.reduce((m, h) => Math.max(m, h.sort_order), 0) + 1;
      const { data, error } = await sb.from("habits").insert({ name, sort_order: order }).select("id, name, sort_order").single();
      input.disabled = false;
      if (error) { toast("Couldn't add it"); return; }
      state.custom.push({ ...data, done: false, dates: new Set(), streak: 0 });
      input.value = ""; render();
    });
    $("habit-edit").addEventListener("click", () => { state.editing = !state.editing; render(); });

    // ---- load each habit's status; render as each arrives ----
    function loadVocab() {
      return SRC.vocab().then((blob) => {
        const langs = Object.values(blob.langs || {});
        let reviewed = 0, due = 0; const days = new Set();
        for (const l of langs) {
          reviewed += (l.activity && l.activity[TODAY]) || 0;
          Object.keys(l.activity || {}).forEach((d) => days.add(d));
          for (const c of [].concat(l.words || [], l.phrases || [])) if (c.box >= 1 && c.due && c.due <= TODAY) due++;
        }
        const done = reviewed > 0;
        state.core.vocab = { done, streak: streakOf(days),
          sub: done ? `${reviewed} reviewed today${due ? ` · ${due} still due` : ""}` : (due ? `${due} due for review` : "Nothing due — learn some new words") };
      }).catch(() => { state.core.vocab = { done: false, sub: "Couldn't load" }; });
    }
    function loadDrugs() {
      return Promise.all([SRC.drugLog(), SRC.drugs()]).then(([log, drugs]) => {
        const days = new Set(log.map((r) => r.studied_on));
        const [y, m, d] = TODAY.split("-").map(Number), [y0, m0, d0] = "2026-11-04".split("-").map(Number);
        const n = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y0, m0 - 1, d0)) / 86400000);
        const drug = drugs.length ? drugs[((n % drugs.length) + drugs.length) % drugs.length] : null;
        const done = days.has(TODAY);
        state.core.drugs = { done, streak: streakOf(days),
          sub: drug ? (done ? `${drug.name} — quiz finished` : `Today: ${drug.name}`) : "Open to study" };
      }).catch(() => { state.core.drugs = { done: false, sub: "Couldn't load" }; });
    }
    function loadWorkout() {
      return SRC.sessions().then((rows) => {
        const days = new Set(rows.map((r) => r.log_date));
        const weekAgo = addDaysISO(TODAY, -6);
        const thisWeek = rows.filter((r) => r.log_date >= weekAgo).length;
        const done = days.has(TODAY);
        const todays = rows.find((r) => r.log_date === TODAY);
        const last = rows[0], idx = last ? WORKOUT_GROUPS.indexOf(last.category) : -1;
        const next = WORKOUT_GROUPS[(idx + 1) % WORKOUT_GROUPS.length];
        state.core.workout = { done, streak: 0,
          sub: done ? `Logged${todays && todays.category ? " · " + todays.category : ""}` : `Next up: ${next} · ${thisWeek} this week` };
      }).catch(() => { state.core.workout = { done: false, sub: "Couldn't load" }; });
    }
    function loadCustom() {
      return Promise.all([SRC.habits(), SRC.habitLog()]).then(([habits, log]) => {
        state.custom = habits.map((h) => {
          const dates = new Set(log.filter((r) => r.habit_id === h.id).map((r) => r.done_on));
          return { ...h, dates, done: dates.has(TODAY), streak: streakOf(dates) };
        });
      }).catch(() => { state.custom = []; });
    }
    render();
    [loadVocab, loadDrugs, loadWorkout, loadCustom].forEach((f) => f().then(render));

    // A tab left open past midnight should roll over to the new day.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && localISO(new Date()) !== TODAY) location.reload();
    });

    // ---------------- tools + 14-week strips ----------------
    const ACTIVITY_SOURCES = {
      workout: async () => new Set((await SRC.sessions()).map((r) => r.log_date)),
      expenses: async () => new Set((await SRC.expenses()).map((r) => r.spent_on)),
      drugs: async () => new Set((await SRC.drugLog()).map((r) => r.studied_on)),
      async vocab() {
        const langs = (await SRC.vocab()).langs || {};
        const dates = new Set();
        Object.values(langs).forEach((lang) => Object.keys((lang && lang.activity) || {}).forEach((d) => dates.add(d)));
        return dates;
      },
    };

    function renderMiniHeat(node, dateSet) {
      const WEEKS = 14;
      const today = new Date();
      const endOfGrid = new Date(today);
      endOfGrid.setDate(today.getDate() + (6 - today.getDay())); // end of this week (Sat)
      const start = new Date(endOfGrid);
      start.setDate(endOfGrid.getDate() - (WEEKS * 7 - 1));

      node.innerHTML = "";
      node.classList.remove("loading");
      for (let i = 0; i < WEEKS * 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const iso = localISO(d);
        const dot = document.createElement("div");
        dot.className = "d" + (dateSet.has(iso) ? " on" : "");
        if (d > today) dot.style.visibility = "hidden";
        dot.title = iso;
        node.appendChild(dot);
      }
    }

    // Adding a new tool to the site: add one entry here. `activity` is
    // optional -- a key into ACTIVITY_SOURCES, or omit it.
    const PAGES = [
      { name: "Workout Tracker", path: "workout/", monogram: "W", activity: "workout",
        tagline: "Log sets, track a consistency streak, compare lifts across sessions." },
      { name: "Vocab Desk", path: "vocab/", monogram: "V", activity: "vocab",
        tagline: "Spaced-repetition review for English and Japanese vocabulary." },
      { name: "Expenses", path: "expenses/", monogram: "E", activity: "expenses",
        tagline: "Bookkeeping: log spending and income, see the month by category." },
      { name: "Drug of the Day", path: "drugs/", monogram: "D", activity: "drugs",
        tagline: "One small-molecule drug a day: structure, mechanism, PK, quiz." },
    ];

    const grid = $("app-grid");
    PAGES.forEach((p) => {
      const a = document.createElement("a");
      a.className = "app-card";
      a.href = p.path;
      a.innerHTML = `
        <div class="monogram">${p.monogram}</div>
        <div class="body">
          <div class="name">${p.name}</div>
          <div class="tagline">${p.tagline}</div>
        </div>
        ${p.activity ? '<div class="mini-heat loading"></div>' : ""}
        <div class="arrow">→</div>
      `;
      grid.appendChild(a);
      if (p.activity && ACTIVITY_SOURCES[p.activity]) {
        ACTIVITY_SOURCES[p.activity]()
          .then((dateSet) => renderMiniHeat(a.querySelector(".mini-heat"), dateSet))
          .catch(() => { a.querySelector(".mini-heat").remove(); });
      }
    });
  </script>
</body>
</html>
