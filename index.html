<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    header, main { max-width: 640px; margin: 0 auto; }
    header { padding: 32px 20px 0; }
    main { padding: 28px 20px 60px; }

    h1.page-title { font-size: 1.9rem; }
    .lede {
      color: var(--text-dim);
      margin: 0 0 32px;
      max-width: 46ch;
      line-height: 1.5;
    }

    /* One card per page on the site. New pages: add one object to the
       PAGES array in the script below -- nothing else changes. */
    .app-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .app-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }
    .app-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-1);
    }
    .app-card:active { transform: scale(0.99); }
    .app-card .monogram {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border-radius: calc(var(--radius) - 2px);
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.15rem;
    }
    .app-card .body { flex: 1 1 auto; min-width: 0; }
    .app-card .name {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 2px;
    }
    .app-card .tagline {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .app-card .arrow {
      flex: 0 0 auto;
      color: var(--text-faint);
      font-size: 1.2rem;
      transition: transform 0.15s ease, color 0.15s ease;
    }
    .app-card:hover .arrow { color: var(--accent); transform: translateX(2px); }

    footer {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 20px 40px;
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 420px) {
      header, main, footer { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="site-nav">
      <a href="./" class="active">Home</a>
      <a href="workout/">Workout</a>
      <a href="vocab/">Vocab</a>
    </nav>
    <div class="page-eyebrow">piekachu.github.io/workout-tracker</div>
    <h1 class="page-title">Home</h1>
  </header>

  <main>
    <p class="lede">Personal tools, one place. Pick one below.</p>
    <div class="app-grid" id="app-grid"></div>
  </main>

  <footer>Static site, no backend of its own — each tool below talks to Supabase directly.</footer>

  <script>
    // Adding a new tool to the site: add one entry here. Nothing else on
    // this page needs to change.
    const PAGES = [
      {
        name: "Workout Tracker",
        path: "workout/",
        monogram: "W",
        tagline: "Log sets, track a consistency streak, compare lifts across sessions.",
      },
      {
        name: "Vocab Desk",
        path: "vocab/",
        monogram: "V",
        tagline: "Spaced-repetition review for English and Japanese vocabulary.",
      },
    ];

    const grid = document.getElementById("app-grid");
    PAGES.forEach((p) => {
      const a = document.createElement("a");
      a.className = "app-card";
      a.href = p.path;
      a.innerHTML = `
        <div class="monogram">${p.monogram}</div>
        <div class="body">
          <div class="name">${p.name}</div>
          <div class="tagline">${p.tagline}</div>
        </div>
        <div class="arrow">→</div>
      `;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
