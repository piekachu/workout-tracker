<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header>
    <h1>Workout Tracker</h1>
  </header>

  <main>
    <!-- CONSISTENCY -->
    <section id="consistency">
      <div class="stat-row">
        <div class="stat">
          <div class="stat-num" id="stat-recent">–</div>
          <div class="stat-label">sessions, last 4 weeks</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="stat-streak">–</div>
          <div class="stat-label">week streak</div>
        </div>
      </div>
      <div class="heatmap-wrap">
        <div id="heatmap" class="heatmap"></div>
      </div>
    </section>

    <hr />

    <!-- LOG -->
    <section id="log">
      <h2>Log today's workout</h2>

      <div class="category-picker" id="category-picker"></div>

      <div class="category-locked" id="category-locked" hidden>
        <span class="category-locked-label">Today's category: <strong id="category-locked-name"></strong></span>
        <button type="button" class="link-btn small" id="change-category">Change</button>
      </div>

      <div id="log-form">
        <div class="field-row">
          <div class="field">
            <label>Date</label>
            <input type="date" id="s-date" />
          </div>
          <div class="field">
            <label>Body weight (kg)</label>
            <div class="stepper" id="bodyweight-stepper">
              <button type="button" class="step-btn minus" aria-label="Decrease body weight">−</button>
              <input type="number" class="num-display" id="s-bodyweight" readonly placeholder="0" />
              <button type="button" class="step-btn plus" aria-label="Increase body weight">+</button>
            </div>
          </div>
          <div class="field">
            <label>Start time</label>
            <input type="time" id="s-start" />
          </div>
          <div class="field">
            <label>End time</label>
            <input type="time" id="s-end" />
          </div>
        </div>

        <div id="exercise-list"></div>
        <button class="link-btn" id="add-exercise">+ add exercise</button>

        <div class="save-bar">
          <button class="btn" id="save-session">Save workout</button>
          <span class="status" id="session-status"></span>
        </div>
      </div>
    </section>

    <hr />

    <!-- RECENT -->
    <section id="recent">
      <h2>Recent</h2>
      <div id="recent-list"></div>
    </section>
  </main>

  <template id="exercise-row-template">
    <div class="ex-row">
      <div class="ex-head">
        <select class="ex-select">
          <option value="">Select exercise…</option>
        </select>
        <input class="ex-name-other" placeholder="Exercise name" hidden />
        <span class="ex-goal"></span>
        <button type="button" class="remove-btn" title="Remove">✕</button>
      </div>
      <div class="ex-sets"></div>
      <button type="button" class="link-btn small add-set">+ set</button>
      <input type="text" class="ex-comment" placeholder="Comment (optional)" inputmode="text" />
    </div>
  </template>

  <template id="set-input-template">
    <div class="set-row">
      <span class="set-num"></span>
      <div class="stepper" data-kind="reps">
        <button type="button" class="step-btn minus" aria-label="Decrease reps">−</button>
        <input type="number" class="set-reps num-display" readonly placeholder="0" />
        <button type="button" class="step-btn plus" aria-label="Increase reps">+</button>
        <span class="stepper-unit">reps</span>
      </div>
      <div class="stepper" data-kind="weight">
        <button type="button" class="step-btn minus" aria-label="Decrease weight">−</button>
        <input type="number" class="set-weight num-display" readonly placeholder="0" />
        <button type="button" class="step-btn plus" aria-label="Increase weight">+</button>
        <span class="stepper-unit">kg</span>
      </div>
    </div>
  </template>

  <script src="assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
