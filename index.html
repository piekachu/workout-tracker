<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Today</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/charts.css" />
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    button, input { font-family: inherit; touch-action: manipulation; }
    header, main, footer { max-width: var(--page-max); margin: 0 auto; }
    header { padding: 20px var(--page-pad) 0; }
    main { padding: 6px var(--page-pad) calc(48px + env(safe-area-inset-bottom)); }

    /* phone: one column. desktop: tasks + habits on the left, insights on the right, full width. */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px 32px; align-items: start; }
    @media (min-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
      .col-side { position: sticky; top: 16px; }
    }
    .col-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .rings { display: flex; justify-content: space-around; gap: 12px; flex-wrap: wrap; }
    .ring-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .82rem; color: var(--text-dim); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 3px;
      background: var(--bg-2); font-size: .85rem; color: var(--text-2); }
    .chip b { font-family: var(--font-mono); font-weight: 500; font-size: 1.05rem; color: var(--text); }
    .span-all { grid-column: 1 / -1; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---- heading: date, what's left, progress ---- */
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 6px; }
    .hero h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 2rem; letter-spacing: -.02em; line-height: 1.1; }
    .hero .date { color: var(--text-dim); font-size: .92rem; margin-top: 3px; }
    .hero .sub { color: var(--text-2); font-size: .95rem; margin-top: 8px; }
    #hero-ring { flex: 0 0 auto; }
    @media (min-width: 980px) { .hero h1 { font-size: 2.5rem; } }
    .hero-wrap { margin-bottom: 14px; }

    /* ---- quick add ---- */
    .quick { display: flex; gap: 8px; margin-bottom: 18px; }
    .quick input { flex: 1 1 auto; min-width: 0; height: 50px; padding: 0 14px; font-size: 16px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .quick button { flex: 0 0 auto; height: 50px; padding: 0 18px; border: 0; border-radius: var(--radius); background: var(--accent);
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }

    /* ---- the list ---- */
    .sect { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border-2); }
    .sect:first-child { margin-top: 0; }
    .item { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 12px; margin-bottom: 8px; width: 100%;
      background: var(--surface); border: 1px solid var(--border); border-left-width: 4px; border-radius: var(--radius);
      color: inherit; text-decoration: none; text-align: left; font: inherit; }
    .item.p1 { border-left-color: var(--gold); } .item.p2 { border-left-color: var(--danger); }
    .item .tick { flex: 0 0 auto; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 2px solid var(--border); background: none;
      color: transparent; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s; }
    .item.done .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
    .item .go-dot { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; border: 2px dashed var(--border); color: var(--accent);
      display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .item .body { flex: 1 1 auto; min-width: 0; }
    .item .name { font-size: 1rem; line-height: 1.3; overflow-wrap: anywhere; }
    .item.core .name { font-weight: 600; font-size: 1rem; }
    .item.done .name { color: var(--text-dim); text-decoration: line-through; }
    .item.done.core .name { text-decoration: none; }
    .item .sub { font-size: .8rem; color: var(--text-dim); margin-top: 1px; }
    .item .tag { flex: 0 0 auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    .item .tag.alert { color: var(--danger); }
    .item .cta { flex: 0 0 auto; color: var(--accent); font-size: .85rem; font-weight: 600; white-space: nowrap; }
    a.item:active, .item[role=button]:active { transform: scale(.99); }
    .quiet { color: var(--text-dim); font-size: .9rem; padding: 6px 0; }
    .allgood { padding: 22px 16px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .allgood b { display: block; font-weight: 600; font-size: 1.1rem; margin-bottom: 2px; }
    .allgood span { color: var(--text-dim); font-size: .9rem; }

    details.done-box { margin-top: 16px; }
    details.done-box > summary, details.manage > summary { cursor: pointer; list-style: none; color: var(--text-dim); font-size: .88rem;
      min-height: 44px; display: flex; align-items: center; gap: 6px; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "▸"; font-size: .8rem; transition: transform .15s; }
    details[open] > summary::before { transform: rotate(90deg); }

    .manage { margin-top: 8px; }
    .manage form { display: flex; gap: 8px; margin: 6px 0 10px; }
    .manage input { flex: 1 1 auto; min-width: 0; height: 46px; padding: 0 12px; font-size: 16px; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .manage form button { height: 46px; padding: 0 16px; border: 0; border-radius: var(--radius); background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
    .mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; font-size: .92rem; border-top: 1px solid var(--border-2); }
    .mrow button { background: none; border: 0; color: var(--danger); font-size: .85rem; min-height: 44px; padding: 0 4px; cursor: pointer; }

    /* ---- tools ---- */
    .tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    @media (min-width: 760px) { .tools { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
    .tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 76px; padding: 10px 6px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); text-decoration: none; font-size: .85rem; }
    .tool:active { transform: scale(.98); }
    .tool .m { width: 32px; height: 32px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 600; }
    .tool.primary { border-color: var(--accent); }

    .toast-err { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 50; }
    footer { padding: 0 var(--page-pad) 36px; color: var(--text-faint); font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; }
  </style>
</head>
<body>
<nav class="site-nav" id="site-nav" data-root="./" aria-label="Main"></nav>
<script src="./shared/nav.js"></script>
  <div class="ticker" id="ticker" aria-label="Key figures"><div class="ticker-track" id="ticker-track"></div></div>
  <header>
    <div class="hero hero-wrap">
      <div>
        <h1>Today</h1>
        <div class="date" id="today-date"></div>
        <div class="sub" id="hero-sub" aria-live="polite"></div>
      </div>
      <div id="hero-ring" class="ring-host"></div>
    </div>
  </header>

  <main>
   <div class="layout">
    <section class="col-main">
    <form class="quick" id="quick" autocomplete="off">
      <input id="quick-title" type="text" maxlength="200" placeholder="Add a task for today" enterkeyhint="done" aria-label="New task for today">
      <button type="submit">Add</button>
    </form>

    <div id="list"></div>

    <details class="manage" id="manage">
      <summary>Manage habits</summary>
      <form id="habit-add">
        <input id="habit-name" type="text" maxlength="60" placeholder="New habit (water, reading, sleep…)" enterkeyhint="done">
        <button type="submit">Add</button>
      </form>
      <div id="habit-rows"></div>
    </details>
    </section>

    <aside class="col-side" aria-label="Insights">
      <div class="panel">
        <div class="panel-h"><span>Today at a glance</span><span class="meta">share finished</span></div>
        <div class="panel-b rings">
          <div class="ring-cell"><div id="ring-habits" class="ring-host"></div>Habits</div>
          <div class="ring-cell"><div id="ring-all" class="ring-host"></div>Everything</div>
          <div class="ring-cell"><div id="ring-week" class="ring-host"></div>7-day avg</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-h"><span>Habits · 7 days</span><span class="meta" id="cap-habits"></span></div>
        <div class="panel-b"><div class="chart" id="ch-habits"></div></div>
      </div>
      <div class="panel">
        <div class="panel-h"><span>Tasks done · 7 days</span><span class="meta" id="cap-tasks"></span></div>
        <div class="panel-b"><div class="chart" id="ch-tasks"></div></div>
      </div>
      <div class="panel">
        <div class="panel-h"><span>Streaks</span></div>
        <div class="panel-b"><div class="chips" id="chips"></div></div>
      </div>
    </aside>

    <section class="span-all">
    <div class="sect" style="margin-top:10px">Go to</div>
    <div class="tools">
      <a class="tool primary" href="progress/"><span class="m">↗</span>Progress</a>
      <a class="tool" href="tasks/"><span class="m">T</span>Tasks</a>
      <a class="tool" href="workout/"><span class="m">W</span>Workout</a>
      <a class="tool" href="vocab/"><span class="m">V</span>Vocab</a>
      <a class="tool" href="expenses/"><span class="m">E</span>Expenses</a>
      <a class="tool" href="drugs/"><span class="m">D</span>Drugs</a>
    </div>
    </section>
   </div>
  </main>

  <footer>Private — your data is visible only when signed in.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="shared/auth.js"></script>
  <script src="shared/tasks-core.js"></script>
  <script src="shared/charts.js"></script>
  <script>
    const sb = Auth.client;
    const VOCAB_SLOT_ID = "56ba90d2a3a5add3cb";
    const WORKOUT_GROUPS = ["Back + Biceps", "Chest + Triceps", "Shoulder + Arms", "Legs", "Whole body"];
    const { localISO, addDays: addDaysISO, weekStart, firstOf } = TasksCore;   // local-date maths, never UTC
    const TODAY = localISO(new Date());

    // Consecutive days up to today; a day not yet done doesn't break a streak that was alive yesterday.
    function streakOf(dates) {
      let day = dates.has(TODAY) ? TODAY : addDaysISO(TODAY, -1), n = 0;
      while (dates.has(day)) { n++; day = addDaysISO(day, -1); }
      return n;
    }
    const withStreak = (text, n) => (n >= 2 ? `${text} · ${n}-day streak` : text);

    function once(fn) { let p; return () => (p = p || fn()); }
    const SRC = {
      sessions: once(async () => {
        const { data, error } = await sb.from("workout_sessions").select("log_date, category").order("log_date", { ascending: false });
        if (error) throw error; return data || [];
      }),
      drugLog: once(async () => {
        const { data, error } = await sb.from("drug_log").select("studied_on");
        if (error) throw error; return data || [];
      }),
      vocab: once(async () => {
        const { data, error } = await sb.from("kv_store").select("data").eq("slot_id", VOCAB_SLOT_ID).maybeSingle();
        if (error) throw error; return (data && data.data) || {};
      }),
      drugs: once(() => new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "drugs/data.js"; s.onload = () => resolve(window.DRUGS || []); s.onerror = reject;
        document.head.appendChild(s);
      })),
      // today's day tasks, anything open from the last 60 days, and this week's / month's open ones
      tasks: once(async () => {
        const mon = weekStart(TODAY), first = firstOf(TODAY);
        const [days, longer] = await Promise.all([
          sb.from("tasks").select("*").eq("horizon", "day").lte("period_start", TODAY).gte("period_start", addDaysISO(TODAY, -60)),
          sb.from("tasks").select("*").in("horizon", ["week", "month"]).in("period_start", [mon, first]),
        ]);
        if (days.error) throw days.error;
        if (longer.error) throw longer.error;
        return [...(days.data || []), ...(longer.data || [])];
      }),
      // 14 days of expenses: this week vs the one before, for the ticker
      spend14: once(async () => {
        const { data, error } = await sb.from("expenses").select("spent_on, amount, kind").gte("spent_on", addDaysISO(TODAY, -13));
        if (error) throw error; return data || [];
      }),
      tasksRecent: once(async () => {
        const since = new Date(); since.setHours(0, 0, 0, 0); since.setDate(since.getDate() - 6);
        const { data, error } = await sb.from("tasks").select("done_at").gte("done_at", since.toISOString());
        if (error) throw error; return data || [];
      }),
      habits: once(async () => {
        const { data, error } = await sb.from("habits").select("id, name, sort_order").eq("archived", false).order("sort_order").order("id");
        if (error) throw error; return data || [];
      }),
      habitLog: once(async () => {
        const { data, error } = await sb.from("habit_log").select("habit_id, done_on");
        if (error) throw error; return data || [];
      }),
    };

    const $ = (id) => document.getElementById(id);
    function el(tag, attrs = {}, ...kids) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
      }
      kids.flat().forEach((c) => c != null && c !== "" && e.append(c));
      return e;
    }
    function toast(msg) { const t = el("div", { class: "toast-err", role: "status" }, msg); document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
    $("today-date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    // ---------------- state ----------------
    const CORE = [
      { key: "vocab",   name: "Vocab",           href: "vocab/",   cta: "Review" },
      { key: "drugs",   name: "Drug of the day", href: "drugs/",   cta: "Study" },
      { key: "workout", name: "Workout",         href: "workout/", cta: "Log" },
    ];
    const state = { core: {}, tasks: null, custom: [], vocabAct: {}, drugSet: new Set(), habitLogByDay: {}, doneByDay: {}, sessions7: 0, sessionsPrev: 0, spend: { now: 0, prev: 0 } };   // core[key] = { done, sub, streak }
    const timeOf = (t) => (t.start_time ? t.start_time.slice(0, 5) : "");
    const byOrder = (a, b) => (!!a.done_at - !!b.done_at) || ((a.start_time || "99") < (b.start_time || "99") ? -1 : (a.start_time || "99") > (b.start_time || "99") ? 1 : 0) || (b.priority - a.priority) || (a.id - b.id);
    let doneOpen = false;   // keep the "Done today" drawer open across re-renders

    // ---------------- rendering ----------------
    function taskItem(t, tag) {
      return el("div", { class: `item p${t.priority}${t.done_at ? " done" : ""}` },
        el("button", { class: "tick", type: "button", "aria-label": t.done_at ? "Mark not done" : "Mark done", onclick: () => toggleTask(t) }, "✓"),
        el("div", { class: "body" }, el("div", { class: "name" }, t.title)),
        tag || timeOf(t) ? el("span", { class: "tag" + (tag === "overdue" ? " alert" : "") }, tag || timeOf(t)) : "");
    }
    function coreItem(c) {
      const st = state.core[c.key];
      return el("a", { class: "item core" + (st && st.done ? " done" : ""), href: c.href },
        st && st.done ? el("span", { class: "tick" }, "✓") : el("span", { class: "go-dot" }, "→"),
        el("div", { class: "body" }, el("div", { class: "name" }, c.name), el("div", { class: "sub" }, st ? withStreak(st.sub, st.streak) : "Loading…")),
        st && st.done ? "" : el("span", { class: "cta" }, c.cta));
    }
    function habitItem(h) {
      return el("div", { class: "item" + (h.done ? " done" : ""), role: "button", tabindex: "0", "aria-pressed": String(h.done),
          onclick: () => toggleHabit(h), onkeydown: (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggleHabit(h); } } },
        el("span", { class: "tick" }, "✓"),
        el("div", { class: "body" }, el("div", { class: "name" }, h.name), h.streak >= 2 ? el("div", { class: "sub" }, `${h.streak}-day streak`) : ""));
    }

    function render() {
      const T = state.tasks || [];
      const overdue = T.filter((t) => t.horizon === "day" && t.period_start < TODAY && !t.done_at).sort(byOrder);
      const today = T.filter((t) => t.horizon === "day" && t.period_start === TODAY).sort(byOrder);
      const later = T.filter((t) => t.horizon !== "day" && !t.done_at).sort(byOrder);
      const coreReady = CORE.every((c) => state.core[c.key]);

      const pendingTasks = [...overdue, ...today.filter((t) => !t.done_at)];
      const doneTasks = today.filter((t) => t.done_at);
      const pendingCore = CORE.filter((c) => state.core[c.key] && !state.core[c.key].done);
      const doneCore = CORE.filter((c) => state.core[c.key] && state.core[c.key].done);
      const pendingHabits = state.custom.filter((h) => !h.done), doneHabits = state.custom.filter((h) => h.done);

      const total = overdue.length + today.length + CORE.length + state.custom.length;
      const doneN = doneTasks.length + doneCore.length + doneHabits.length;
      const left = total - doneN;
      const ready = state.tasks !== null && coreReady;
      const taskTotal = overdue.length + today.length, taskLeft = taskTotal - doneTasks.length;
      const habitTotal = CORE.length + state.custom.length, habitDone = doneCore.length + doneHabits.length;
      const size = window.innerWidth < 640 ? 92 : 112;
      Charts.ring($("hero-ring"), { value: taskTotal ? doneTasks.length : 1, total: taskTotal || 1, size,
        big: ready ? String(taskLeft) : "…", small: taskLeft === 1 ? "task left" : "tasks left", aria: `${taskLeft} tasks left` });
      $("hero-sub").textContent = !ready ? "" : habitTotal - habitDone ? `${habitTotal - habitDone} habit${habitTotal - habitDone === 1 ? "" : "s"} left` : "All habits done";
      if (ready) renderInsights({ doneN, total, habitDone, habitTotal, taskLeft });

      const list = $("list"); list.innerHTML = "";
      if (ready && !pendingTasks.length && !pendingCore.length && !pendingHabits.length) {
        list.append(el("div", { class: "allgood" }, el("b", {}, "All done for today"), el("span", {}, "Nice work. Check Progress to see how the week is going.")));
      }
      if (pendingTasks.length) {
        list.append(el("div", { class: "sect" }, "Tasks"));
        overdue.forEach((t) => list.append(taskItem(t, "overdue")));
        today.filter((t) => !t.done_at).forEach((t) => list.append(taskItem(t)));
      } else if (ready) {
        list.append(el("div", { class: "sect" }, "Tasks"));
        list.append(el("div", { class: "quiet" }, doneTasks.length ? "All of today's tasks are done." : "No tasks for today — add one above."));
      }
      if (!coreReady || pendingCore.length || pendingHabits.length) {
        list.append(el("div", { class: "sect" }, "Habits"));
        if (!coreReady) CORE.forEach((c) => list.append(coreItem(c)));
        else pendingCore.forEach((c) => list.append(coreItem(c)));
        pendingHabits.forEach((h) => list.append(habitItem(h)));
      }
      if (later.length) {
        list.append(el("div", { class: "sect" }, "This week & month"));
        later.forEach((t) => list.append(taskItem(t, t.horizon)));
      }
      if (doneN) {
        const box = el("details", { class: "done-box" }, el("summary", {}, `Done today (${doneN})`));
        doneTasks.forEach((t) => box.append(taskItem(t)));
        doneCore.forEach((c) => box.append(coreItem(c)));
        doneHabits.forEach((h) => box.append(habitItem(h)));
        box.open = doneOpen;
        box.addEventListener("toggle", () => { doneOpen = box.open; });
        list.append(box);
      }

      const rows = $("habit-rows"); rows.innerHTML = "";
      state.custom.forEach((h) => rows.append(el("div", { class: "mrow" }, el("span", {}, h.name),
        el("button", { type: "button", onclick: () => removeHabit(h) }, "Remove"))));
    }

    // ---------------- insights panel ----------------
    const lastDays = (n) => Array.from({ length: n }, (_, i) => addDaysISO(TODAY, i - (n - 1)));
    function habitPct(d) {
      const ids = new Set(state.custom.map((h) => h.id)), logged = state.habitLogByDay[d] || new Set();
      let custom = 0; logged.forEach((id) => { if (ids.has(id)) custom++; });
      return Math.round((((state.vocabAct[d] || 0) > 0 ? 1 : 0) + (state.drugSet.has(d) ? 1 : 0) + custom) / (2 + state.custom.length) * 100);
    }
    // up/down arrow + colour; `goodUp` says whether a rise is good news (spending: no)
    function deltaOf(now, prev, goodUp = true, unit = "", fmtNum = (v) => Math.round(v * 10) / 10) {
      const d = now - prev;
      if (!d) return { cls: "", text: "— 0" + unit };
      return { cls: (d > 0) === goodUp ? "up" : "down", text: `${d > 0 ? "▲" : "▼"} ${fmtNum(Math.abs(d)).toLocaleString()}${unit}` };
    }
    function renderTicker({ habitDone, habitTotal, taskLeft }) {
      const y = addDaysISO(TODAY, -1);
      const money = (v) => (v >= 10000 ? Math.round(v / 1000).toLocaleString() + "K" : Math.round(v).toLocaleString());
      const quotes = [
        { l: "Tasks left", v: String(taskLeft), href: "tasks/" },
        { l: "Tasks done", v: String(state.doneByDay[TODAY] || 0), d: deltaOf(state.doneByDay[TODAY] || 0, state.doneByDay[y] || 0), href: "tasks/" },
        { l: "Habits", v: `${habitDone}/${habitTotal}`, d: deltaOf(habitPct(TODAY), habitPct(y), true, "%"), href: "progress/" },
        { l: "Vocab", v: String(state.vocabAct[TODAY] || 0), d: deltaOf(state.vocabAct[TODAY] || 0, state.vocabAct[y] || 0), href: "vocab/" },
        { l: "Vocab streak", v: `${state.core.vocab ? state.core.vocab.streak : 0}d`, href: "vocab/" },
        { l: "Drug streak", v: `${state.core.drugs ? state.core.drugs.streak : 0}d`, href: "drugs/" },
        { l: "Workouts 7d", v: String(state.sessions7), d: deltaOf(state.sessions7, state.sessionsPrev), href: "workout/" },
        { l: "Spend 7d", v: money(state.spend.now), d: deltaOf(state.spend.now, state.spend.prev, false, "", money), href: "expenses/" },
      ];
      const html = quotes.map((q) => `<a class="ticker-item" href="${q.href}"><span class="t-label">${q.l}</span><span class="t-value">${q.v}</span>${q.d ? `<span class="delta ${q.d.cls}">${q.d.text}</span>` : ""}</a>`).join("");
      $("ticker-track").innerHTML = html + html;   // twice, so the loop is seamless
    }
    function renderInsights({ doneN, total, habitDone, habitTotal, taskLeft }) {
      renderTicker({ habitDone, habitTotal, taskLeft });
      const days = lastDays(7);
      const pcts = days.map(habitPct), tdone = days.map((d) => state.doneByDay[d] || 0);
      const avg = Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length);
      Charts.ring($("ring-habits"), { value: habitDone, total: habitTotal, size: 96, big: `${habitDone}/${habitTotal}`, small: "habits" });
      Charts.ring($("ring-all"), { value: doneN, total: total || 1, size: 96, big: total ? Math.round((doneN / total) * 100) + "%" : "—", small: "done", color: "var(--chart-2)" });
      Charts.ring($("ring-week"), { value: avg, total: 100, size: 96, big: avg + "%", small: "avg habits" });

      const long = (d) => new Date(d + "T00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      const xTick = (i) => new Date(days[i] + "T00:00").toLocaleDateString(undefined, { weekday: "short" });
      Charts.bar($("ch-habits"), { values: pcts, xTick, max: 100, highlight: 6, height: 150, fmtTick: (v) => v + "%", fmtLabel: (v) => v + "%",
        emptyText: "Nothing logged in the last 7 days yet", tipTitle: (i) => long(days[i]), tipValue: (i) => `${pcts[i]}% of habits` });
      $("cap-habits").textContent = `avg ${avg}%`;
      const tTotal = tdone.reduce((a, b) => a + b, 0);
      Charts.bar($("ch-tasks"), { values: tdone, xTick, highlight: 6, height: 130, emptyText: "No tasks completed in the last 7 days yet",
        tipTitle: (i) => long(days[i]), tipValue: (i) => `${tdone[i]} completed` });
      $("cap-tasks").textContent = `${tTotal} total`;

      const chips = $("chips"); chips.innerHTML = "";
      const chip = (n, label) => chips.append(el("span", { class: "chip" }, el("b", {}, String(n)), label));
      chip(state.core.vocab ? state.core.vocab.streak : 0, "day vocab streak");
      chip(state.core.drugs ? state.core.drugs.streak : 0, "day drug streak");
      chip(state.sessions7, state.sessions7 === 1 ? "workout this week" : "workouts this week");
      state.custom.filter((h) => h.streak >= 1).forEach((h) => chip(h.streak, `day ${h.name.toLowerCase()}`));
    }

    // ---------------- actions ----------------
    async function toggleTask(t) {
      const was = t.done_at, next = was ? null : new Date().toISOString();
      const bump = (n) => { state.doneByDay[TODAY] = Math.max(0, (state.doneByDay[TODAY] || 0) + n); };
      t.done_at = next; bump(next ? 1 : -1); render();
      const { error } = await sb.from("tasks").update({ done_at: next }).eq("id", t.id);
      if (error) { t.done_at = was; bump(next ? -1 : 1); render(); toast("Couldn't save — check your connection"); return; }
      if (next && t.recur) {
        const row = await TasksCore.spawnNext(sb, t, state.tasks);
        if (row && row.period_start <= TODAY) { state.tasks.push(row); render(); }
      }
    }
    async function toggleHabit(h) {
      const was = h.done;
      const day = (state.habitLogByDay[TODAY] = state.habitLogByDay[TODAY] || new Set());
      h.done = !was; h.dates[was ? "delete" : "add"](TODAY); day[was ? "delete" : "add"](h.id); h.streak = streakOf(h.dates); render();
      const q = was
        ? sb.from("habit_log").delete().eq("habit_id", h.id).eq("done_on", TODAY)
        : sb.from("habit_log").upsert({ habit_id: h.id, done_on: TODAY }, { onConflict: "habit_id,done_on" });
      const { error } = await q;
      if (error) { h.done = was; h.dates[was ? "add" : "delete"](TODAY); day[was ? "add" : "delete"](h.id); h.streak = streakOf(h.dates); render(); toast("Couldn't save — check your connection"); }
    }
    async function removeHabit(h) {
      if (!confirm(`Remove "${h.name}"? Its history is kept; it just stops showing.`)) return;
      const { error } = await sb.from("habits").update({ archived: true }).eq("id", h.id);
      if (error) { toast("Couldn't remove it"); return; }
      state.custom = state.custom.filter((x) => x !== h); render();
    }
    $("quick").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = $("quick-title"), title = input.value.trim();
      if (!title) return;
      input.disabled = true;
      const { data, error } = await sb.from("tasks").insert({ title, horizon: "day", period_start: TODAY }).select().single();
      input.disabled = false;
      if (error) { toast("Couldn't add it"); return; }
      (state.tasks = state.tasks || []).push(data); input.value = ""; render(); input.focus();
    });
    $("habit-add").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = $("habit-name"), name = input.value.trim();
      if (!name) return;
      input.disabled = true;
      const order = state.custom.reduce((m, h) => Math.max(m, h.sort_order || 0), 0) + 1;
      const { data, error } = await sb.from("habits").insert({ name, sort_order: order }).select("id, name, sort_order").single();
      input.disabled = false;
      if (error) { toast("Couldn't add it"); return; }
      state.custom.push({ ...data, done: false, dates: new Set(), streak: 0 });
      input.value = ""; render();
    });

    // ---------------- loaders: render as each arrives ----------------
    function loadVocab() {
      return SRC.vocab().then((blob) => {
        let reviewed = 0, due = 0; const days = new Set();
        for (const l of Object.values(blob.langs || {})) {
          reviewed += (l.activity && l.activity[TODAY]) || 0;
          Object.keys(l.activity || {}).forEach((d) => days.add(d));
          for (const c of [].concat(l.words || [], l.phrases || [])) if (c.box >= 1 && c.due && c.due <= TODAY) due++;
        }
        const done = reviewed > 0;
        state.vocabAct = {};
        for (const l of Object.values(blob.langs || {})) for (const [d, n] of Object.entries(l.activity || {})) state.vocabAct[d] = (state.vocabAct[d] || 0) + (Number(n) || 0);
        state.core.vocab = { done, streak: streakOf(days),
          sub: done ? `${reviewed} reviewed today${due ? ` · ${due} still due` : ""}` : (due ? `${due} due for review` : "Nothing due — learn some new words") };
      }).catch(() => { state.core.vocab = { done: false, sub: "Couldn't load" }; });
    }
    function loadDrugs() {
      return Promise.all([SRC.drugLog(), SRC.drugs()]).then(([log, drugs]) => {
        const days = new Set(log.map((r) => r.studied_on));
        const [y, m, d] = TODAY.split("-").map(Number), [y0, m0, d0] = "2026-11-04".split("-").map(Number);
        const n = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(y0, m0 - 1, d0)) / 86400000);
        const drug = drugs.length ? drugs[((n % drugs.length) + drugs.length) % drugs.length] : null;
        const done = days.has(TODAY);
        state.drugSet = days;
        state.core.drugs = { done, streak: streakOf(days),
          sub: drug ? (done ? `${drug.name} — quiz finished` : `Today: ${drug.name}`) : "Open to study" };
      }).catch(() => { state.core.drugs = { done: false, sub: "Couldn't load" }; });
    }
    function loadWorkout() {
      return SRC.sessions().then((rows) => {
        const days = new Set(rows.map((r) => r.log_date));
        const weekAgo = addDaysISO(TODAY, -6);
        const thisWeek = rows.filter((r) => r.log_date >= weekAgo).length;
        const done = days.has(TODAY), todays = rows.find((r) => r.log_date === TODAY);
        state.sessions7 = thisWeek;
        state.sessionsPrev = rows.filter((r) => r.log_date >= addDaysISO(TODAY, -13) && r.log_date < weekAgo).length;
        const last = rows[0], idx = last ? WORKOUT_GROUPS.indexOf(last.category) : -1;
        const next = WORKOUT_GROUPS[(idx + 1) % WORKOUT_GROUPS.length];
        state.core.workout = { done, streak: 0,
          sub: done ? `Logged${todays && todays.category ? " · " + todays.category : ""}` : `Next up: ${next} · ${thisWeek} this week` };
      }).catch(() => { state.core.workout = { done: false, sub: "Couldn't load" }; });
    }
    function loadCustom() {
      return Promise.all([SRC.habits(), SRC.habitLog()]).then(([habits, log]) => {
        state.habitLogByDay = {};
        for (const r of log) (state.habitLogByDay[r.done_on] = state.habitLogByDay[r.done_on] || new Set()).add(r.habit_id);
        state.custom = habits.map((h) => {
          const dates = new Set(log.filter((r) => r.habit_id === h.id).map((r) => r.done_on));
          return { ...h, dates, done: dates.has(TODAY), streak: streakOf(dates) };
        });
      }).catch(() => { state.custom = []; });
    }
    function loadSpend() {
      return SRC.spend14().then((rows) => {
        const cut = addDaysISO(TODAY, -6), sp = { now: 0, prev: 0 };
        rows.filter((r) => r.kind === "expense").forEach((r) => { (r.spent_on >= cut ? (sp.now += Number(r.amount)) : (sp.prev += Number(r.amount))); });
        state.spend = sp;
      }).catch(() => {});
    }
    function loadRecent() {
      return SRC.tasksRecent().then((rows) => {
        state.doneByDay = {};
        rows.forEach((r) => { const d = localISO(new Date(r.done_at)); state.doneByDay[d] = (state.doneByDay[d] || 0) + 1; });
      }).catch(() => { state.doneByDay = {}; });
    }
    function loadTasks() { return SRC.tasks().then((rows) => { state.tasks = rows; }).catch(() => { state.tasks = []; }); }

    render();
    [loadTasks, loadRecent, loadVocab, loadDrugs, loadWorkout, loadCustom, loadSpend].forEach((f) => f().then(render));
    window.addEventListener("resize", (() => { let w = innerWidth; return () => { if ((innerWidth < 640) !== (w < 640)) { w = innerWidth; render(); } }; })());

    // A tab left open past midnight should roll over to the new day.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && localISO(new Date()) !== TODAY) location.reload();
    });
  </script>
</body>
</html>
