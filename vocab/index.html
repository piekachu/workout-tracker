anny","meaning":"\"Nook and cranny\" is an idiom that means every small, hidden, or out-of-the-way space.\n\nIt's used to emphasize a thorough search, exploration, or cleaning of an entire area, including all the difficult-to-reach places.","examples":["The professor examined every nook and cranny of the experiment report as an effort to find an error.","The doctor had to go through every nook and cranny to find the parient's cause of the illlness.","Looking through every nook and cranny won't improve the situation."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00405","kind":"word","word":"norm","meaning":"A norm (or the norm) refers to a standard, model, or pattern regarded as typical, usual, or expected. It represents what is considered normal, acceptable, or conventional behavior, practice, or amount within a particular group, society, or context.","examples":["\"Working five days a week is the norm in most industries.\"","\"Social norms dictate that you shouldn't talk loudly on your phone in a quiet library.\"","\"Her test score was above the class norm.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00406","kind":"word","word":"notary","meaning":"A notary (officially, a notary public) is a person authorized by the state or a legal authority to perform certain legal formalities, especially to witness the signing of documents and to certify their authenticity.\n\nTheir primary role is to act as an impartial witness to the signing of legal documents, ensuring that:","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00407","kind":"word","word":"notion","meaning":"A notion is a concept, idea, or belief, often one that is vague, unproven, or whimsical. It can also refer to a sudden desire or impulse.","examples":["\"He had a strange notion that aliens were living among us.\" (A belief, possibly quirky or unsubstantiated)","\"The architect presented her initial notion for the building's design.\" (An early, perhaps undeveloped, idea)","\"He challenged the traditional notions of gender roles.\" (Conventional ideas or beliefs)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00408","kind":"word","word":"NSFW","meaning":"Not Safe for Work","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00409","kind":"word","word":"nub","meaning":"A \"nub\" refers to a small, rounded, or protruding part or piece of something. It can also describe a small, insignificant or immature part of an object. The term is often used informally.","examples":["The nub of the pencil was too short to write with.\"","She removed the nub from the end of the candle before lighting it.","The design included a nub that made it easier to grip."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00410","kind":"word","word":"numerical","meaning":"involving or expressed in numbers:","examples":["Keep your files in numerical order.","The phone's voice-recognition system converts the sound into numerical data.","In figure 9, these qualitative expectations are confirmed by a numerical example."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00411","kind":"word","word":"nurture","meaning":"To nurture means to care for and encourage the growth or development of someone or something. It implies providing the necessary conditions, support, and encouragement for something to flourish.","examples":["\"She nurtured the sick puppy back to health.\"","\"The company aims to nurture innovation among its employees.\"","In the famous \"nature vs. nurture\" debate, \"nurture\" refers to the influence of environment, upbringing, and experience on an individual's development, as opposed to genetic or inherited factors (\"nature\").\n\n\"Psychologists continue to debate the relative importance of nature and nurture in shaping personality.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00412","kind":"word","word":"objectification","meaning":"Objectification is the act of treating a person as a thing, an object, or a tool for one's own use, rather than as a human being with their own feelings, rights, and dignity.\n\nIn social philosophy and psychology, it is often discussed as a way of stripping away a person's agency (their ability to act and make choices) and reducing them to their physical appearance or a specific function.","examples":["\"The documentary argues that the fashion industry often leads to the objectification of young models.\"","\"By ignoring his employees' family emergencies, the CEO was guilty of the objectification of his workforce.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00413","kind":"word","word":"objection","meaning":"a feeling or expression of opposition, dislike, or disapproval:","examples":["The two companies will learn this week whether there are still objections to the merger deal.","A large number of people raised objections to the proposed plan.","We have no objection to a slight postponement."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00414","kind":"word","word":"objective","meaning":"based on real facts and not influenced by personal beliefs or feelings:","examples":["an objective and impartial report","One of the biggest problems in a celebrity case is being able to select jurors who can be objective about it.","Analysts produced objective evidence that the world was heading for a global recession."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00415","kind":"word","word":"oblique","meaning":"Oblique is an adjective that primarily means slanted or indirect. It describes something that is not horizontal or vertical, or something that is not straightforward and direct.","examples":["\"The path of the comet was oblique to the planet's orbit.\"","\"He made an oblique reference to the scandal, without mentioning it directly.\"","\"The film's plot was full of oblique suggestions and hidden meanings.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00416","kind":"word","word":"obnoxious","meaning":"sdf","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00417","kind":"word","word":"obscure","meaning":"not clear and difficult to understand or see:","examples":["Official policy has changed, for reasons that remain obscure.","His answers were obscure and confusing."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00418","kind":"word","word":"obtuse","meaning":"stupid and slow to understand, or unwilling to try to understand:","examples":["The answer's obvious - or are you being deliberately obtuse?","I’m not trying to be obtuse, but I don’t get it.","Your obtuseness is driving me crazy."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00419","kind":"word","word":"occur to me","meaning":"\"Occur to me\" means that an idea, thought, or realization suddenly comes into one's mind. It suggests that the thought appears spontaneously, often when one isn't actively thinking about it, or when trying to find a solution or recall information.","examples":["\"It suddenly occurred to me that I had left my keys in the car.\"","\"A brilliant solution to the problem occurred to me while I was taking a shower.\"","\"If it doesn't occur to you by tomorrow, I'll tell you the answer.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00420","kind":"word","word":"odds","meaning":"the probability (= how likely it is) that a particular thing will or will not happen:","examples":["Odds of exit were 80 per cent lower for respondents with two or more children compared with others.","There are heavy odds against people succeeding in such a bad economic climate.","Each insecure category was compared with the secure classification to yield odds ratios."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00421","kind":"word","word":"often","meaning":"many times:","examples":["It's not often that you meet someone who you're instantly attracted to.","I don't see my parents as often as I'd like to.","How often do you wash your hair?"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00422","kind":"word","word":"omnipresence","meaning":"The state of being present everywhere at the same time. It is often used in a religious or philosophical context to describe a deity but can also be applied more broadly to ideas, technology, or influence","examples":["In the digital age, the omnipresence of social media makes it hard to disconnect.","\"The omnipresence of surveillance cameras raises concerns about privacy.\"","\"Many religions attribute omnipresence to their deity, believing they exist everywhere at once.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00423","kind":"word","word":"omniscient","meaning":"\"Omniscient\" means having complete or unlimited knowledge, awareness, or understanding; perceiving all things.","examples":["This is perhaps the most common context. In many religions, God or a supreme being is described as omniscient, knowing everything about the universe and its inhabitants.","An \"omniscient narrator\" is a storytelling technique where the narrator knows all the thoughts, feelings, and actions of all the characters in the story, as well as events that may be hidden from the characters themselves."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00424","kind":"word","word":"on its own terms","meaning":"When you look at something \"on its own terms,\" it means you are evaluating, judging, or understanding it based on its own unique qualities, goals, or circumstances, rather than comparing it to something else or using outside standards.","examples":["\"To appreciate this pop album, you have to take it on its own terms—it's meant for dancing, not for poetic lyrics.\"","\"She decided to meet her estranged father on his own terms, without bringing up the expectations she had as a child.\"","\"Even if we didn't make a huge profit, the project was a success on its own terms because our goal was simply to increase brand awareness.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00425","kind":"word","word":"OOO","meaning":"out of office","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00426","kind":"word","word":"opacity","meaning":"\"Opacity\" has a few related meanings, generally revolving around the idea of not being see-through or being difficult to understand.","examples":["\"The thick curtains had high opacity, blocking out all the morning light.\"","\"The opacity of the legal document made it challenging for a layperson to comprehend.\"","\"There was a deliberate opacity in his statement, leaving many questions unanswered.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00427","kind":"word","word":"opalescent","meaning":"Opalescent (adjective) describes something that reflects light and changes color like an opal, or has a milky iridescence.\n\nIt's about a soft, shimmering play of colors that shifts as the viewing angle or light source changes, often with a milky or cloudy quality, similar to the optical phenomenon seen in the gemstone opal.","examples":["\"The deep-sea fish had opalescent scales that shimmered with blues and greens in the dim light.\"","\"The morning sky, just before sunrise, was an opalescent blend of pink, purple, and gray.\"","\"The artist used opalescent paints to create a dreamlike effect in the painting.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00428","kind":"word","word":"opposition","meaning":"strong disagreement:","examples":["The unions are in opposition to the government over the issue of increasing the minimum wage.","The Opposition has/have condemned the government's proposed tax increases."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00429","kind":"word","word":"opt","meaning":"To opt means to make a choice or select something, often from a range of possibilities. It implies a deliberate decision or preference.","examples":["You can opt to pay monthly or annually for the subscription.","He decided to opt out of the volunteer program this year due to his busy schedule.","When booking the flight, I always opt for the aisle seat."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00430","kind":"word","word":"ordnance","meaning":"\"ordnance\" refers to military weapons, especially heavy ones, and more generally, to military supplies and ammunition.","examples":["\"The old fort still contained some antique ordnance from the 19th century.\"","\"Unexploded ordnance (UXO) from past wars still poses a danger in some regions.\"","\"The army dispatched a convoy carrying vital ordnance to the front lines.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00431","kind":"word","word":"ought","meaning":"used to say that it is necessary or desirable to perform the action expressed in the verb:","examples":["We ought to clean up before we go home.","She really ought to apologize.","He ought to be home by seven o’clock.","The curtains ought to be ready on Monday.","At his age, he ought to have known better."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00432","kind":"word","word":"outage","meaning":"a period when a service, such as electricity, is not available:","examples":["The radio news reported power outages affecting 50 homes.","The city soon experienced scattered power outages as a result of unprecedented electrical use.","What you hear are power outages, shortage of water, armed robbery and other evils."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00433","kind":"word","word":"outpace","meaning":"to move or develop faster than someone or something else:","examples":["The company has completely outpaced its rivals in the market.","Growth in the services and information industries continues to outpace overall economic recovery.","State forecasts show that demand for water will outpace supply by 2030."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00434","kind":"word","word":"overahul","meaning":"\"Overhaul\" refers to a comprehensive and thorough renovation, repair, or revision of something. It implies a significant effort to bring something back to a better, often like-new, condition. Here's a breakdown of its meaning and usage:","examples":["Trump signs order aimed at overhauling US elections."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00435","kind":"word","word":"overdue","meaning":"If something is overdue, it should have been completed, paid, returned, or have occurred earlier.","examples":["\"My library books are overdue; I need to return them today.\"","\"The rent payment is overdue by a week.\"","\"This promotion is overdue considering all her hard work.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00436","kind":"word","word":"overrun","meaning":"To Exceed a Limit: To go beyond a specific budget, schedule, or deadline. This is a very common business and project management usage.\n\n\"The construction project overran its initial budget by 20%.\"","examples":["To Spread or Cover Throughout: To invade, infest, or spread across an area, often in a negative or overwhelming way.\n\nExample: \"The garden was overrun with weeds after weeks of neglect.\"","An Exceeding of a Budget or Schedule: The amount or degree by which something has gone over its planned limit.\n\nExample: \"The cost overrun on the project was a major problem for the company.\"","A Surplus of Products: In manufacturing, it can refer to the quantity of items produced in excess of the original order.\n\nExample: \"The factory had a large overrun of holiday decorations that it sold at a discount.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00437","kind":"word","word":"overstate","meaning":"to describe or explain something in a way that makes it seem more important or serious than it really is:","examples":["The impact of the new legislation has been greatly overstated.","The shareholders seem to think that the executive board is overstating the case for a merger.","Nonetheless, two factors indicate that these advantages can be overstated."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00438","kind":"word","word":"overstatement","meaning":"the act of describing or explaining something in a way that makes it seem more important or more serious than it really is:","examples":["An internal inquiry into accounting irregularities revealed a $70m overstatement by a subsidiary company.","The mistake resulted in an overstatement of inventory."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00439","kind":"word","word":"pane","meaning":"Pane is a noun that refers to a single sheet of glass within a window or door. It can also describe a distinct panel, section, or \"page\" within a software interface or a larger object.\nThe word originates from the Old French pan, meaning a \"section\" or \"piece of cloth.\"","examples":["A stray baseball shattered the lower pane of the kitchen window.","The old mansion featured stained-glass panes that cast colorful shadows on the floor."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00440","kind":"word","word":"parable","meaning":"a short, simple story that teaches or explains an idea, especially a moral or religious idea","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00441","kind":"word","word":"paraplegic","meaning":"unable to move or feel the legs or lower part of the body:","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00442","kind":"word","word":"parcel","meaning":"A parcel has a few distinct meanings, most commonly related to a package or a piece of land.","examples":["A Package or Bundle (Noun): \"I received a parcel in the mail today.\"\n\"The delivery driver dropped off a large parcel at the front door.\"","In this context, it refers to a distinct section or area of land. This is a very common usage in legal, real estate, and agricultural contexts. \"They divided the large estate into several smaller parcels for sale.\"","\"The land was parceled out among the heirs.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00443","kind":"word","word":"parliament","meaning":"in some countries, the group of (usually) elected politicians or other people who make the laws for their country:","examples":["On Tuesday the country's parliament voted to establish its own army.","She was elected to Parliament in 1997."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00444","kind":"word","word":"parole","meaning":"Parole is the conditional release of a prisoner before they have completed their maximum sentence. This release is granted on the agreement that the individual will abide by certain conditions (e.g., good behavior, regular reporting to a parole officer, restrictions on travel, avoiding certain people or places, attending counseling).","examples":["\"After serving ten years of his sentence, he was granted parole for good behavior.\"","\"She is currently on parole and must meet with her parole officer weekly.\"","In U.S. immigration law, parole has a distinct meaning. It allows certain non-citizens to temporarily enter or remain in the United States for urgent humanitarian reasons or significant public benefit, even if they don't meet all the standard admission requirements. This is very different from criminal justice parole."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00445","kind":"word","word":"pathogen","meaning":"A pathogen is a microorganism or other agent that causes disease.\n\nIt's a biological agent that can produce illness in its host. The term \"pathogen\" comes from Greek roots: pathos, meaning \"suffering\" or \"disease,\" and genes, meaning \"producer of.\"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00446","kind":"word","word":"patronize","meaning":"to speak to or behave towards someone as if they are stupid or not important:","examples":["Stop patronizing me - I understand the play as well as you do.","Additional research has found that 70% of people feel patronised by advertising."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00447","kind":"word","word":"PDA","meaning":"Public Display of Affection","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00448","kind":"word","word":"pedantic","meaning":"Being pedantic means someone is excessively concerned with minor details, rules, or academic learning, often to the point of being tiresome or showing off their knowledge. It's about a rigid adherence to formality, accuracy, or established conventions, sometimes prioritizing these over practical considerations or broader understanding.","examples":["\"The professor's pedantic lecture on the precise definition of 'therefore' left many students bored.\"","\"She was so pedantic about table manners that she corrected everyone's fork placement at the dinner party.\"","\"His pedantic insistence on citing every single source in a casual email made it incredibly long and hard to read.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00449","kind":"word","word":"pep talk","meaning":"A pep talk is a short, enthusiastic speech or talk designed to encourage, motivate, or instill confidence in a person or a group of people.\n\nIt's usually given when someone (or a team) is about to face a challenge, is feeling discouraged, or needs a boost in morale. The goal is to lift spirits, reinforce belief in their abilities, and inspire them to perform well.","examples":["\"Before the championship game, the coach gave the team a powerful pep talk.\"","\"After a series of setbacks, the manager tried to improve team morale with a daily pep talk.\"","\"Sometimes, all you need is a good pep talk from a friend to get through a tough day.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00450","kind":"word","word":"perfecta","meaning":"In English, a perfecta (pronounced per-FEK-tuh) is a term used primarily in horse racing (and sometimes other pari-mutuel betting sports like dog racing or jai alai).\n\nIt refers to a type of wager (bet) where the bettor must correctly predict the first two finishers of a race in their exact order of finish.\n\nIt is essentially synonymous with an exacta, and the terms are often used interchangeably, though \"exacta\" might be slightly more common in the U.S. racing industry.","examples":["If you place a perfecta bet on \"Thunderbolt\" to finish first and \"Lightning Bolt\" to finish second, you only win if Thunderbolt is indeed first and Lightning Bolt is second.\n\nThe term \"perfecta\" is not typically used outside of the context of gambling on races."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00451","kind":"word","word":"perilous","meaning":"Perilous (adjective) means full of danger or risk. It describes a situation, journey, or action that is extremely hazardous or unsafe.","examples":["\"The climbers embarked on a perilous ascent of the icy mountain peak.\"","\"Navigating the ancient ruins without a guide proved to be a perilous undertaking.\"","\"The economy is in a perilous state, bordering on recession.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00452","kind":"word","word":"periodically","meaning":"in a way that is repeated after a particular period of time:","examples":["However, the corresponding wake plasma oscillations periodically accelerate the downstream plasma electrons to relativistic energies.","The issue of political interference in the police arose early on in his presidency, and has surfaced periodically ever since.","was caused by a hydrodynamic source periodically varying its strength."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00453","kind":"word","word":"perjury","meaning":"Perjury is the act of willfully making a false statement or giving false testimony while under oath or affirmation. It is a crime and a serious offense, particularly in a legal setting like a courtroom.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00454","kind":"word","word":"permeate","meaning":"\"permeate\" means to spread throughout something; to pass through or pervade. Think of it like a liquid soaking into a sponge, a smell filling a room, or an idea spreading through a community.","examples":["The smell of coffee permeated the entire house.","Water permeated the soil after the heavy rain.","The ink permeated the thin paper, showing through on the other side."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00455","kind":"word","word":"Perpetrator","meaning":"A perpetrator is a person who commits a crime or a harmful, illegal, or immoral act.","examples":["While the true perpetrator was on the loose, the police aressted a innoocent man.","The true perpetrator of the reaction is the hydrogen gas present in the air, not the chemicals in the mixture.","In an effort to find the perpetrator, the town's police interrogated every person in town."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00456","kind":"word","word":"perpetual","meaning":"\"Perpetual\" means continuous, never-ending, or lasting indefinitely without interruption.","examples":["\"She lived in perpetual fear of failure.\" (She was always afraid of failing.)","The region enjoys almost perpetual sunshine.\" (The sun shines there almost all the time.)","His perpetual lateness annoyed his coworkers.\" (He was always late.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00457","kind":"word","word":"perpetuate","meaning":"To perpetuate means to make something continue indefinitely; to cause something to last for a long time. It implies keeping something in existence or ensuring its continuation, often something undesirable or a particular situation or belief.","examples":["\"The stereotypes about her ethnicity were perpetuated by the media.\" (Made to continue and spread)","\"We must break the cycle of poverty and not perpetuate it for future generations.\" (Prevent it from continuing)","\"Lack of education can perpetuate the cycle of disadvantage.\" (Cause the cycle to continue)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00458","kind":"word","word":"persevere","meaning":"to continue making an effort to do or achieve something, even when this is difficult or takes a long time:","examples":["We will persevere in this struggle for peace, no matter how long it takes.","The prime minister is aware of the risks of persevering with an unpopular policy."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00459","kind":"word","word":"phenomena","meaning":"plural of phenomenon","examples":["However, there are basic psychological phenomena that the model does not handle well.","These proscriptions, while useful in economics, may obfuscate important psychological phenomena.","Understanding how cues combine will aid in specifying the role of transparency in these phenomena and the nature of the mechanisms involved."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00460","kind":"word","word":"phenomenon","meaning":"something that exists and can be seen, felt, tasted, etc., especially something unusual or interesting:","examples":["There's evidence to suggest that child abuse is not just a recent phenomenon.","We discussed the ever-growing popularity of talk radio, and wondered how to explain this phenomenon.","Such situations require fundamental knowledge of these interactions as a possible cause of anomalous transport phenomena in magnetized plasmas."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00461","kind":"word","word":"phoresis","meaning":"Phoresis, or phoresy, is a temporary relationship where one organism attaches to another for the purpose of travel. The organism that attaches is called the phoront or phoretic, and the organism that it attaches to is called the host.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00462","kind":"word","word":"picaresque","meaning":"relating to an episodic style of fiction dealing with the adventure of a rough and dishonest but appealing hero.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00463","kind":"word","word":"pier","meaning":"a structure built out over the water on posts, along which boats can land:","examples":["a thick, strong column used to support a structure such as a bridge","The sweat bath, the angled wall, and the rear piers were removed or buried."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00464","kind":"word","word":"plateau","meaning":"To reach a level of stability or to stop increasing or progressing.","examples":["The growth of the company started to plateau."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00465","kind":"word","word":"pneumonia","meaning":"Pneumonia is an infection that inflames the air sacs (alveoli) in one or both lungs. The air sacs may fill with fluid or pus, causing a cough with phlegm or pus, fever, chills, and difficulty breathing.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00466","kind":"word","word":"pocketbooks","meaning":"a woman's bag","examples":["Someone's pocketbook is their ability to pay for something:","The sales tax hits consumers in the pocketbook."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00467","kind":"word","word":"pompous","meaning":"A pompous person is someone who is affectedly and irritatingly grand, solemn, or self-important.It describes behavior, speech, or attitude that is overly formal, self-important, and often condescending, intended to impress others but often just coming across as arrogant or ridiculous. They tend to inflate their own importance.","examples":["\"The pompous politician spoke at length about his own achievements, barely acknowledging his team's contributions.\"","\"She found his pompous demeanor utterly irritating, despite his undeniable intelligence.\"","\"The restaurant critic wrote a pompous review, detailing every minute flaw with excessive eloquence.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00468","kind":"word","word":"portion","meaning":"A portion refers to a part of a whole, especially a part that is allotted to or taken by an individual or group. It can also mean a serving of food.","examples":["A significant portion of the budget was allocated to research and development.","Be mindful of your portion sizes if you're trying to lose weight."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00469","kind":"word","word":"practice","meaning":"action rather than thought or ideas:","examples":["How do you intend to put these proposals into practice, Mohamed?","It's common practice in the States to tip the hairdresser.","What is standard practice (= what is usually done) in a situation like this?"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00470","kind":"word","word":"precedence","meaning":"\"Precedence\" refers to the condition of being considered more important than someone or something else; priority in order, rank, or importance.","examples":["\"Safety takes precedence over speed in this operation.\" (Safety is considered more important.)","\"This court ruling sets a new precedence for environmental law.\" (Here, \"precedent\" would be more common, but \"precedence\" refers to the principle of setting such a guide.)","\"The committee debated the precedence of the various agenda items.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00471","kind":"word","word":"precedent","meaning":"an action, situation, or decision that has already happened and can be used as a reason why a similar action or decision should be performed or made:","examples":["I worry about giving into her demands because it then sets a precedent.","How is it, exactly, that precedents constrain future decisions?","The precedents they set would show the way and smooth the path for other national liberation movements."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00472","kind":"word","word":"preclude","meaning":"Preclude is a formal verb that means to make something impossible, or to prevent something from happening entirely, usually by taking action beforehand.\n\nThe word originates from the Latin praecludere, which combines prae- (before) and claudere (to close). When you preclude something, you are literally \"closing the door before\" anyone can walk through it.","examples":["A. Everyday Decisions and Events\nIn daily life, it describes a situation where a specific fact or action completely rules out a future possibility.\n\nExample: \"His severe fear of heights will preclude him from ever becoming a commercial airline pilot.\"\n\nExample: \"The fact that she was out of the country on the day of the robbery precludes any possibility that she was involved.\"","B. Law and Official Rules\nIn legal and formal contexts, it means that a specific rule, prior agreement, or condition officially stops you from taking an action (like filing a lawsuit or signing a contract).\n\nExample: \"Signing this non-disclosure agreement will preclude you from discussing the project with the press.\"\n\nExample: \"The statute of limitations may preclude the prosecution from bringing this case to trial.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00473","kind":"word","word":"predetermine","meaning":"establish or decide in advance.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00474","kind":"word","word":"predicament","meaning":"A predicament is a difficult, perplexing, or unpleasant situation from which it is hard to extricate oneself; a tricky or awkward situation. It implies a challenging state of affairs that requires careful thought or action to resolve.","examples":["\"He found himself in a financial predicament after losing his job.\"","\"The two friends were in a difficult predicament when their car broke down in the middle of nowhere.\"","\"She was in a real predicament, caught between her loyalty to her friend and her duty to the truth.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00475","kind":"word","word":"prediction","meaning":"a statement about what you think will happen in the future:","examples":["Analysts are busy making predictions about what we can expect in the next budget.","This fall has confirmed our prediction that confidence would soften in the wake of interest rate rises.","His prediction for the economy in 2003, which many thought over-optimistic, turned out to be spot-on."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00476","kind":"word","word":"preemptive","meaning":"Preemptive is an adjective that describes an action taken to prevent, interrupt, or forestall an anticipated event before it can happen. It usually implies acting first to gain an advantage or to neutralize a threat.\n\nThe word comes from the Latin prefix prae- (before) and emere (to buy). Originally, it referred to the right to purchase land before anyone else had the chance.","examples":["This is one of the most common arenas for the word. A \"preemptive strike\" occurs when one nation attacks another first because they believe an enemy attack is absolutely imminent and unavoidable.\n\nExample: \"The general ordered a preemptive artillery strike to destroy the enemy's missile silos before they could be launched.\"\n\nExample: \"In chess, moving your knight to block a file can be a preemptive defense against a future attack.\"","In daily life, it means addressing a problem before it actually becomes a problem.\n\nExample: \"The PR team released a preemptive statement to explain the software bug before customers could start complaining.\"\n\nExample: \"She took some preemptive ibuprofen because she knew the loud concert would give her a headache.\"","In computer science, \"preemptive multitasking\" is a specific way operating systems manage CPU time. The system will forcefully pause (preempt) a running program to give another program a turn to run, preventing any single app from freezing the whole computer."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00477","kind":"word","word":"prefix","meaning":"A prefix is an affix (a meaningful group of letters) that is added to the beginning of a word or stem to modify its meaning or create a new word.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00478","kind":"word","word":"prehistoric","meaning":"describing the period before there were written records:","examples":["Painting originated in prehistoric times with murals drawn on cave walls.","prehistoric man/humans/animals","Painting originated in prehistoric times."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00479","kind":"word","word":"preliminary","meaning":"coming before a more important action or event, especially introducing or preparing for it:","examples":["Preliminary results show that the vaccine is effective, but this has to be confirmed by further medical trials.","We've decided to change the design based on our preliminary findings.","The two officials will be meeting today in order to establish a preliminary agreement."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00480","kind":"word","word":"premeditation","meaning":"Premeditation is the act of planning or thinking about a crime before it is committed. It's the deliberate and willful consideration of a criminal act, typically a serious one like murder, for a period of time before carrying it out.\n\nLegal Context\nIn law, premeditation is a crucial element that distinguishes higher-level offenses from lower ones. For example, it's a key factor in elevating a charge of murder from second-degree to first-degree murder.","examples":["General Usage\nOutside of law, premeditation is used more broadly to describe any action that is carefully thought out or planned in advance.\n\n\"The elaborate party was a result of months of premeditation.\"","\"His kind gesture was not spontaneous; it was done with careful premeditation.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00481","kind":"word","word":"premise","meaning":"A premise is a statement or idea that forms the foundation of an argument or theory. Think of it as a piece of evidence or a starting assumption from which a conclusion is logically drawn.\n\nIn a logical argument, you typically have one or more premises that lead to a conclusion.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00482","kind":"word","word":"premonition","meaning":"A premonition is a strong feeling that something is about to happen, especially something unpleasant. It's a sense of foreboding or a presentiment about a future event.","examples":["\"She had a strong premonition that something bad was going to happen, and indeed, her car broke down later that day.\"","\"He dismissed his unsettling premonition as mere nerves before his flight.\"","\"The old woman claimed to have frequent premonitions about future events.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00483","kind":"word","word":"preponderance","meaning":"the largest part or greatest amount:","examples":["The people who possessed the preponderancy of wealth began to think of ways of obtaining the preponderacy of power.","As predicted, large urban schools serving many economically disadvantaged children were characterized by a preponderance of classrooms with high rates of student aggression","The preponderance of red and blue/purple/black fruits in our sample is undoubtedly a reflection of these colours being universally chosen by birds."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00484","kind":"word","word":"preposterous","meaning":"Preposterous describes something that is contrary to reason or common sense; utterly absurd or ridiculous. It's used for something that is so senseless that it is laughable.","examples":["The theory itself seemed to be a compelling, logical explanation; however, upon closer inspection, it was filled with unsubstantiated claims.","Due to the prevalent use of smartphones and the internet, people are beginning to lose their critical thinking; as a result, they are more inclined to believe propsterous fake news.","Even though his paper was full of preposterous claims, we had no way to prove them wrong."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00485","kind":"word","word":"prescription","meaning":"A prescription is a written or electronic order from a licensed healthcare professional (like a doctor, dentist, or nurse practitioner) that authorizes a patient to receive a specific medication, medical treatment, or therapeutic service.\nLess commonly, a prescription can refer to a rule, instruction, or recommendation that must be followed.","examples":["The doctor wrote her a prescription for antibiotics.","You'll need a prescription to get that pain medication.","The company's success is a direct result of following the prescription for ethical business practices."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00486","kind":"word","word":"presume","meaning":"to believe something to be true because it is very likely, although you are not certain:","examples":["I wouldn't presume to tell you how to do your job, but shouldn't this piece go there?","I don't wish to presume (= make a suggestion although I have no right to), but don't you think you should apologize to her?","He presumes on her good nature (= takes unfair advantage of it).","We therefore ran correlations with demographic variables, which could be presumed to be exogenous.","Assume and presume both mean \"to take something for granted\" or \"to take something as true.\" The difference between the words lies in the degree of confidence held by the speaker or writer. If he or she is making an informed guess based on reasonable evidence, presume is the word to use; if a guess is made based on little or no evidence, assume is usually used. (This is not true, however, in the legal catchphrase \"presumed innocent until proven guilty.\" That sense of presume is separately defined as \"to suppose to be true without proof\" and is based on the fact that legal systems grant the presumption of innocence, thereby placing the burden of proof on the prosecution.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00487","kind":"word","word":"presumption","meaning":"the act of believing that something is true without having any proof:","examples":["The presumption of innocence is central to American law.","It is, moreover, fully compatible with the much-prized principle of the presumption of innocence.","Making the presumption that he was innocent was our biggest mistake."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00488","kind":"word","word":"pretense","meaning":"A pretense refers to an attempt to make something false appear true; a claim, especially a false or ambitious one. It implies a fabricated appearance or an act designed to deceive or impress.","examples":["\"Under the pretense of being a doctor, he gained access to the restricted area.\" (He pretended to be a doctor.)","\"Her cheerful attitude was merely a pretense to hide her inner turmoil.\" (A false front or act)","\"They went through the pretense of a fair trial, but the verdict was already decided.\" (The appearance of fairness, but it wasn't genuine.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00489","kind":"word","word":"procrastinate","meaning":"to keep delaying something that must be done, often because it is unpleasant or boring:","examples":["I know I've got to deal with the problem at some point - I'm just procrastinating."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00490","kind":"word","word":"profanity","meaning":"A profanity refers to blasphemous or obscene language; offensive language. It's language that is considered rude, vulgar, or disrespectful, particularly when it involves sacred things or is sexually explicit.","examples":["\"The film received an R-rating due to its excessive violence and profanity.\"","\"He was ejected from the game for using profanity toward the referee.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00491","kind":"word","word":"prompt","meaning":"(of an action) done quickly and without delay, or (of a person) acting quickly or arriving at the arranged time:","examples":["The bishop's speech has prompted an angry response from both political parties.","Recent worries over the president's health have prompted speculation over his political future.","Steeply rising food prices pushed inflation to 5.6% last month prompting renewed concern about whether inflation would spread more widely.","They're usually fairly prompt in dealing with enquiries.","Millions of people lack health insurance and therefore aren't getting regular screening or prompt treatment.","The authority's prompt intervention played a crucial role in the resolving the crisis."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00492","kind":"word","word":"propagate","meaning":"To propagate means to reproduce, multiply, or spread (an idea, disease, plant, animal, etc.) to a wider area or to a greater number of people/things.","examples":["\"Many plants can be propagated from cuttings.\"","\"Misinformation can propagate rapidly through social media.\"","\"Sound waves propagate through the air.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00493","kind":"word","word":"proportion","meaning":"The size, shape, or level of something:","examples":["a building of elegant proportions"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00494","kind":"word","word":"proprietary","meaning":"Proprietary is an adjective that describes something that is exclusively owned and legally controlled by an individual or a corporation. It usually refers to information, technology, or formulas that are protected by patents, copyrights, or trade secret laws.\n\nThe word comes from the Latin proprietarius, which translates directly to \"an owner of property.\"","examples":["A. Technology and Software\nIn computer science, proprietary software (or closed-source software) is owned by the company that created it. The company keeps the underlying source code a secret, meaning users can buy the right to use the software, but they cannot legally look at, modify, or distribute the code themselves.\n\nExample: \"While Linux is an open-source operating system, Microsoft Windows is strictly proprietary.\"\n\nExample: \"Apple's charging cables often use a proprietary design, forcing customers to buy replacements directly from them.\"","B. Business and Manufacturing\nCompanies often use this word to describe a unique method or mixture that they have invented and want to protect from competitors.\n\nExample: \"The energy drink's label doesn't list exact measurements, instead hiding them under a proprietary blend of vitamins and herbs.\"\n\nExample: \"The pharmaceutical company holds a proprietary patent on the new drug, making it illegal for anyone else to manufacture it for twenty years.\"","C. Finance (Proprietary Trading)\nIn banking, \"proprietary trading\" (often called \"prop trading\") happens when a financial firm uses its own money to buy and sell stocks, bonds, or commodities for direct profit, rather than trading on behalf of its clients."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00495","kind":"word","word":"propulsion","meaning":"Propulsion (noun) refers to the action of driving or pushing forward. It is the force that causes something to move.","examples":["\"The boat uses jet propulsion to move swiftly through the water.\"","\"The rocket's powerful engines provide the necessary propulsion for space travel.\"","(Figurative) \"The strong leadership provided the propulsion needed to move the project forward.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00496","kind":"word","word":"prospective","meaning":"A prospective person or thing is expected to be or become something specific in the future. It describes something that is likely or expected to happen, develop, or be in a certain state at a later time.","examples":["\"We met with several prospective students at the university open day.\"","\"The real estate agent showed the house to many prospective buyers.\"","\"The company is analyzing the prospective impact of the new regulations.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00497","kind":"word","word":"prospector","meaning":"a person who searches for gold, oil, or other valuable substances on or under the surface of the earth:","examples":["Up to 600 prospectors have been clambering across the rugged Canadian Shield, hoping to find gold or base metals.","A determined prospector found diamonds in Canada's frozen northwest.","a prospector looking for gold"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00498","kind":"word","word":"protrude","meaning":"To protrude means to extend beyond or above a surface; to stick out. It implies that a part of something is projecting or coming forth from a main body or usual position, often noticeably.","examples":["\"A sharp rock protruded from the ground, posing a hazard to hikers.\"","\"His lower lip protruded slightly when he was deep in thought.\"","\"The old building had several decorative gargoyles that protruded from its walls.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00499","kind":"word","word":"proxy","meaning":"A proxy (noun) refers to the authority to represent someone else, or a person or thing that is authorized to act on behalf of another. It implies substitution, where one entity stands in for or acts as an agent for another.","examples":["\"Shareholders can vote by proxy if they cannot attend the meeting in person.\" (They give someone else the authority to vote for them.)","\"He gave his lawyer proxy to make financial decisions on his behalf.\"","\"The CEO appointed his chief of staff as his proxy for the negotiations.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00500","kind":"word","word":"punctuality","meaning":"Punctuality refers to the quality or habit of being on time or prompt. It's about arriving, acting, or completing tasks at the scheduled or expected time.","examples":["\"His punctuality at work was always appreciated by his boss.\"","\"The train system is renowned for its punctuality; trains almost always arrive and depart on schedule.\"","\"Lack of punctuality can disrupt meetings and show disrespect for those who arrived on time.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00501","kind":"word","word":"punctuation","meaning":"(the use of) special symbols that you add to writing to separate phrases and sentences to show that something is a question, etc.:","examples":["His letter was completely without punctuation."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00502","kind":"word","word":"quantitative","meaning":"relating to numbers or amounts:","examples":["Pricing anomalies in the market could be picked up with the help of sophisticated quantitative analysis.","Standard & Poor's Fund Research assesses the performance of fund managers on a quantitative and qualitative basis.","India struck a deal with America to remove quantitative restrictions on imports two years earlier than planned."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00503","kind":"word","word":"quid pro quo","meaning":"Quid pro quo is a Latin phrase that means \"something for something\" or \"this for that.\" It refers to an exchange of goods or services, where one transfer is dependent upon the other. It's a reciprocal arrangement or a mutual exchange of value.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00504","kind":"word","word":"quintessential","meaning":"being the most typical example or most important part of something:","examples":["Sheep's milk cheese is the quintessential Corsican cheese.","Helping others whom one has assumed no prior obligation to help is the quintessential way to make anyone's existence significant to some degree.","Organized labor was a quintessential aging social movement by 1972."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00505","kind":"word","word":"quirk","meaning":"A quirk is a peculiar behavioral habit, characteristic, or mannerism. It's a distinctive, often slightly odd or unusual, feature of a person's character or something's nature. Think of it as a small, individual oddity that sets someone or something apart, but usually in a relatively harmless or endearing way.","examples":["\"One of his lovable quirks was his habit of humming to himself when he was deep in thought.\"","\"The old house had several charming quirks, like a secret staircase and a slanted floor.\"","\"Her most noticeable quirk was her tendency to speak in movie quotes.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00506","kind":"word","word":"ransom","meaning":"A ransom is a sum of money or other payment demanded or paid for the release of a person or property held captive.","examples":["\"The kidnappers demanded a $1 million ransom for the safe return of the executive.\"","\"The company's servers were infected with ransomware, and the hackers demanded a ransom to restore access to their files.\"","\"The museum paid a large ransom to a collector to retrieve the stolen painting.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00507","kind":"word","word":"rapture","meaning":"Rapture refers to a feeling of intense pleasure, joy, or enthusiasm. It's a state of being carried away by overwhelming emotion, often to the point of ecstasy. In a specific theological context (primarily Christian eschatology), \"the Rapture\" refers to the belief that believers will be caught up to meet Christ in the air before the Second Coming or Tribulation.","examples":["\"The audience listened in rapture as the orchestra played the final, soaring notes.\" (Deep, captivating enjoyment)","\"The novel captivated me, holding me in a state of literary rapture for hours.\" (Completely absorbed by the pleasure of reading)","\"Many evangelical Christians believe in the coming of the Rapture, when true believers will be taken to heaven.\" (The specific theological event)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00508","kind":"word","word":"recency","meaning":"Recency (noun) refers to the state of being recent; the quality of having happened, been made, or been acquired not long ago. It emphasizes how new or fresh something is.","examples":["\"The recency of the data makes these findings particularly relevant for our current situation.\"","\"Despite the recency of the scandal, public opinion has already shifted dramatically.\"","\"In short-term memory, the recency effect explains why we often recall the last few items in a list more easily.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00509","kind":"word","word":"reciprocation","meaning":"the fact of feeling or behaving towards someone else in the same way as they feel or behave towards you:","examples":["Our relationship is based upon reciprocation.","He didn't expect any reciprocation of affection."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00510","kind":"word","word":"Recognition","meaning":"the fact of knowing who a person is or what a thing is because of having seen or experienced that person or thing before:","examples":["Charges were dropped in recognition of the fact that there simply wasn’t enough evidence.","They have been trying for three years to get recognition for their union.","Dole obviously had the greatest name recognition of all the Republican candidates.","They have always regarded it as one of the recognitions of their status as a nation.","It's a new country, hoping for diplomatic recognition from the international community."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00511","kind":"word","word":"recombinant","meaning":"relating to or denoting an organism, cell, or genetic material formed by recombination.","examples":["Researchers have launched a vaccine trial, using new formulas created with recombinant DNA technology."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00512","kind":"word","word":"reconcile","meaning":"Reconcile is a verb that fundamentally means to bring two things that seem different or opposed into agreement, harmony, or balance.\n\nThe word originates from the Latin reconciliare, where re- means \"again\" and conciliare means \"to bring together\" or \"to make friendly.\"","examples":["A. Relationships and People\nThis is the most emotional use of the word. It means to restore friendly relations between people or groups after a fight or disagreement.\n\nExample: \"After years of barely speaking, the two brothers finally managed to reconcile at the family reunion.\"\n\nExample: \"The mediator was brought in to help the union and the management reconcile their differences.\"","B. Ideas and Beliefs\nIn philosophy, science, or daily life, it means finding a way to make two seemingly contradictory facts or ideas exist together peacefully.\n\nExample: \"She found it difficult to reconcile her love for fast, exotic cars with her deep commitment to environmentalism.\"\n\nExample: \"Physicists have spent decades trying to reconcile the theory of general relativity with quantum mechanics.\"","C. Finance and Accounting\nIn business, it is a strict administrative task. To \"reconcile an account\" means to compare two sets of financial records to ensure the figures match perfectly and any discrepancies are explained.\n\nExample: \"Every Friday afternoon, he sits down to reconcile the company's internal ledger with the official bank statements.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00513","kind":"word","word":"reconstitute","meaning":"to change an organization so that it has a different form:","examples":["The Health Education Council has been reconstituted as the Health Education Authority.","Institutions and laws are historically constituted and reconstituted.","Law and politics were reconstituted in \"advanced liberal\" form."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00514","kind":"word","word":"rectify","meaning":"To rectify means to put something right; to correct or adjust something that is wrong. It's about fixing a mistake, making an injustice fair, or bringing a situation into alignment with a standard.","examples":["\"The company had to rectify the accounting error before the annual report was published.\"","\"He had to rectify his mistake by apologizing to his colleague.\"","\"The government promised to rectify the injustice done to the community.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00515","kind":"word","word":"redeem","meaning":"to make something or someone seem less bad:","examples":["She managed to save enough money to redeem her jewellery from the pawn shop.","She took me to see a really dull film, the only redeeming feature of which (= the only thing which prevented it from being completely bad) was the soundtrack.","After his poor performance in the golf tournament two weeks before, he was determined to redeem himself by playing well.","He was an hour late, but he redeemed himself in her eyes by giving her a huge bunch of flowers."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00516","kind":"word","word":"redeem a coupon, voucher, etc.","meaning":"to exchange a piece of paper representing a particular amount of money for that amount of money or for goods to this value:","examples":["I've never had any issues redeeming coupons there."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00517","kind":"word","word":"referral","meaning":"the act of directing someone to a different place or person for information, help, or action, often to a person or group with more knowledge or power:","examples":["The doctor gave him a referral to (= arranged for him to see) the consultant.","The commission's inquiry into the warranties began after a referral from the Office for Fair Trading.","75% of the company's hires come from employee referrals."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00518","kind":"word","word":"refrain","meaning":"To deliberately not do something you want to do; to hold back from an action or impulse, especially one that is tempting or habitual. It often implies self-control. It is usually followed by \"from.\"","examples":["Please refrain from smoking in this area.","She wanted to share the gossip, but she refrained."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00519","kind":"word","word":"relatable","meaning":"related, or able to be related to something else:","examples":["The market value of your property investment is directly relatable to the amount of work, effort and expertise you put into it."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00520","kind":"word","word":"reluctant","meaning":"not willing to do something and therefore slow to do it:","examples":["The risk is that clinicians increasingly will be reluctant to do quite ordinary procedures to help patients because of existing guidelines.","The poll also showed a reluctance to accept higher taxes, particularly at the local level.","She had trouble sleeping but was reluctant to take sleeping pills."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00521","kind":"word","word":"rely","meaning":"to need a particular thing or the help and support of someone or something in order to continue, to work correctly, or to succeed:","examples":["The success of this project relies on everyone making an effort.","Don't rely on finding me here when you get back (= I might have gone).","British weather can never be relied on - it's always changing."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00522","kind":"word","word":"reminiscent","meaning":"Reminiscent means tending to remind one of something; suggestive of something else. When something is described as reminiscent, it brings to mind or recalls a memory, a past event, a person, a feeling, or a particular style. It creates a feeling of similarity or association with something else, often from the past.It's usually followed by \"of.\"","examples":["\"The old house was reminiscent of her grandmother's home, filled with similar antique furniture.\" (It brought back memories of her grandmother's home.)","\"The aroma of fresh-baked bread was reminiscent of her childhood summers.\" (It brought back memories and feelings from her childhood.)","\"The current political climate is somewhat reminiscent of the tensions leading up to the 1960s.\" (It reminds one of that historical period.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00523","kind":"word","word":"remnant","meaning":"A remnant is a small remaining quantity of something. It's a fragment, piece, or trace of a larger whole that is left over after the greater part has been used, removed, or destroyed.","examples":["\"She used the remnant of fabric to patch the torn shirt.\"","The remnant chemicals from the last experiment caused the fire.","Remnant troops gathered upon the bridge"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00524","kind":"word","word":"remorse","meaning":"a feeling of sadness and being sorry for something you have done:","examples":["He felt no remorse for the murders he had committed.","Judges took account of the prisoner’s remorse.","Acknowledging the feelings of remorse, anger, guilt, inadequacy, humiliation, and fear is the first step toward resolution and an important prerequisite for the other steps."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00525","kind":"word","word":"renounce","meaning":"to say formally or publicly that you no longer own, support, believe in, or have a connection with something:","examples":["Gandhi renounced the use of violence.","Her ex-husband renounced his claim to the family house.","They reiterated their commitment to democratic competition, renounced violence, and withheld criticism of the government's structural-adjustment plan."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00526","kind":"word","word":"renown","meaning":"the state of being famous:","examples":["The region is renowned for its natural beauty."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00527","kind":"word","word":"repulsion","meaning":"\"Repulsion\" has a few distinct but related meanings, generally revolving around the idea of pushing away or strong aversion.","examples":["\"The smell from the rotting food caused universal repulsion.\"","\"The strong magnetic field created a force of repulsion between the two objects.\"","\"The army's swift repulsion of the invaders saved the city.\" (Similar to \"repelling an attack\")"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00528","kind":"word","word":"repulsive","meaning":"Repulsive (adjective) means arousing intense distaste or disgust; offensive or repellent. It describes something that is extremely unpleasant, ugly, or morally objectionable, making you want to push it away or avoid it.","examples":["\"The smell emanating from the garbage can was utterly repulsive.\"","\"She found his sexist jokes repulsive and walked away.\" (Morally offensive)","\"The creature had a repulsive appearance, with slimy skin and bulging eyes.\" (Extremely unpleasant to look at)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00529","kind":"word","word":"rescind","meaning":"To rescind means to revoke, cancel, or repeal a law, an agreement, or a decision. It's about taking back or withdrawing something that has already been put into effect.","examples":["\"The company decided to rescind its job offer after discovering the candidate had lied on their resume.\"","He formally rescinded his letter of recommendation after he heard of his transgressions."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00530","kind":"word","word":"resentment","meaning":"Resentment is a feeling of bitter indignation or ill will at having been treated unfairly or unjustly. It's a deep-seated and often suppressed sense of injury, anger, and bitterness.","examples":["\"She harbored a deep resentment toward her brother for inheriting the family business.\"","\"The employees' resentment over the pay cuts led them to stage a protest.\"","\"He spoke with a tone of quiet resentment about the injustice he had faced.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00531","kind":"word","word":"resign","meaning":"to give up a job or position by telling your employer that you are leaving:","examples":["He resigned as policy director to become deputy chief of staff.","The prime minister announced that she will resign after the next election.","He has no intention of resigning over the issue."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00532","kind":"word","word":"respect","meaning":"a particular feature or detail:","examples":["In some respects, I had to admit, I had behaved foolishly.","This proposal differs from the last one in many important respects/one important respect.","In most respects, the new film is better than the original."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00533","kind":"word","word":"retain","meaning":"to keep or continue to have something:","examples":["I have a good memory and am able to retain (= remember) facts easily.","The sea retains the sun's warmth longer than the land.","You retain the right to take legal action if you do not accept his decision."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00534","kind":"word","word":"retention","meaning":"Retention refers to the continued possession, use, or keeping of something. It's about the act of holding onto something rather than losing, discarding, or giving it away.","examples":["\"High employee turnover is a major issue; we need to improve our retention strategies.\"","\"He has excellent memory retention for historical facts.\"","\"The contract includes a clause for the retention of intellectual property rights by the creator.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00535","kind":"word","word":"rhombus","meaning":"A rhombus (plural: rhombuses or rhombi) is a quadrilateral (a four-sided polygon) in which all four sides are equal in length.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00536","kind":"word","word":"riciprocate","meaning":"to do something for someone because the person has done something similar for you:","examples":["We invited them to dinner and a week later they reciprocated.","Moreover, actual deeds of unselfish and cooperative behavior are often reciprocated."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00537","kind":"word","word":"rigorous","meaning":"\"Rigorous\" describes something that is extremely thorough, exhaustive, accurate, and strictly applied or adhered to. It can also mean harsh or severe when referring to conditions or rules.","examples":["I want rigorous financial analysis of the options.","The style of writing is rigorous and clear, and the material is well organized.","\"The scientific study was subjected to a rigorous peer-review process.\"","\"The military academy is known for its rigorous training program.\"","\"They survived the rigorous conditions of the Arctic winter.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00538","kind":"word","word":"rise","meaning":"When emotions, etc. rise, they start to increase:","examples":["Tempers are rising (= people are becoming angry).","My spirits rise (= I feel happier) whenever I think of my friends.","She felt panic and terror rise in her whenever she thought of the future.","After a long career with the company, she has risen to the position of chief executive."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00539","kind":"word","word":"roam","meaning":"to move about or travel, especially without a clear idea of what you are going to do:","examples":["She roamed around America for a year, working in bars and restaurants.","Livestock are allowed to roam unrestricted in these villages.","A punitive expedition of four thousand roamed the country murderously."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00540","kind":"word","word":"RSVP","meaning":"RSVP is an abbreviation that stands for the French phrase \"Répondez s'il vous plaît,\" which literally means \"Please respond.\"\n\nIt is used on invitations for events (such as weddings, parties, or conferences) to request that the invitee reply to let the host know whether they will be attending.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00541","kind":"word","word":"rubric","meaning":"A rubric has a few distinct meanings, primarily referring to a set of rules, instructions, or criteria, often used for evaluation.","examples":["Historically, and still in religious contexts, a rubric is a set of instructions, often printed in red (or formerly in red ink), for the conduct of a religious service or other formal procedure.\n\n\"The priest followed the rubric for the Mass meticulously.\"","In education and other fields, a rubric is a scoring guide that outlines the specific criteria and performance expectations for an assignment, project, presentation, or any task. It defines what constitutes different levels of achievement (e.g., excellent, good, fair, poor).\n\n\"The teacher provided a detailed rubric so students knew exactly how their essays would be graded.\"","\"We need a clear rubric for assessing the quality of the research proposals.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00542","kind":"word","word":"rural","meaning":"Rural (adjective) describes the countryside, as opposed to a city or town. It refers to areas that are characteristic of, or found in, the countryside.","examples":["\"Many people are moving from cities to rural areas in search of a quieter life.\"","\"The cottage was located in a beautiful, rural setting.\"","\"The new policy aims to support rural communities and their economies.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00543","kind":"word","word":"salience","meaning":"Salience (noun) refers to the quality of being particularly noticeable or important; prominence. When something has salience, it stands out or is especially significant.","examples":["\"The red car had a high salience in the otherwise black-and-white photograph.\"","\"The issue of climate change has gained increased salience in political debates.\"","\"The salience of vivid details in a memory can sometimes make it feel more real.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00544","kind":"word","word":"salivate","meaning":"Salivate is a verb that literally means to produce saliva in your mouth. Figuratively, it means to show intense excitement, desire, or anticipation for something you want very badly.","examples":["A. Biological and Literal\nIn a medical or physiological context, it simply describes the activation of the salivary glands. This usually happens when you eat, smell, or even just think about delicious food.\n\nExample: \"The smell of the roasting meat was so incredible that it immediately made me salivate.\"\n\nExample: \"Certain dental procedures require tools to keep the mouth dry because patients naturally salivate during the process.\"","B. Figurative Anticipation\nIn business, sports, or daily life, the word is used metaphorically to describe a person who is greedily anticipating a reward, a victory, or a lucrative opportunity.\n\nExample: \"The real estate developers were salivating over the prime piece of downtown property that just went up for sale.\"\n\nExample: \"Knowing the opposing team's star player was injured made the defense salivate at the prospect of an easy win.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00545","kind":"word","word":"scholastic","meaning":"Scholastic (adjective) refers to of or relating to schools, schooling, and education. It can also pertain to academic learning or scholarship in general.","examples":["\"The debate team's strong performance earned them scholastic recognition.\"","\"Scholastic achievements are often considered important for university admissions.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00546","kind":"word","word":"scold","meaning":"To scold means to rebuke or reprimand someone angrily. It's about expressing disapproval or criticism, usually in an angry or sharp tone, often to a child or someone perceived to have done something wrong or foolish.","examples":["\"The teacher scolded the student for talking during the exam.\"","\"My mother used to scold me for leaving my clothes on the floor.\"","\"He scolded the dog for digging up the flowers in the garden.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00547","kind":"word","word":"scrarcity","meaning":"a situation in which something is not easy to find or get:","examples":["There is a scarcity of skilled workers in the building sector.","A scarcity of flour makes bread, cake, and other baked goods more expensive.","If households will plant, at what level of fuelwood scarcity will they decide that planting trees for fuel is a worthwhile investment?"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00548","kind":"word","word":"scribe","meaning":"a person who made written copies of documents, before the invention of printing","examples":["in biblical times, a teacher of religious law"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00549","kind":"word","word":"semantics","meaning":"the study of meaning in language","examples":["Syntax describes the rules by which words can be combined into sentences, while semantics describes what they mean.","This type of semantics is useful for goal-directed programming."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00550","kind":"word","word":"servitude","meaning":"Servitude (noun) refers to the state of being a slave or completely subject to someone more powerful. It can also mean the condition of being forced to work for someone else.","examples":["\"The country abolished the practice of indentured servitude in the 19th century.\"","\"The prisoners were forced into a life of hard labor and servitude.\"","\"The novel explores the themes of freedom from servitude.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00551","kind":"word","word":"shock value","meaning":"Shock value refers to the potential of an action, image, text, or any form of communication to deliberately provoke a strong, often negative, emotional reaction such as disgust, surprise, outrage, anger, fear, or discomfort in an audience.","examples":["Shockvertising\" uses disturbing or offensive imagery to highlight social issues or make a brand memorable","A speaker might use a provocative statement or anecdote to jolt an audience out of complacency and ensure their message resonates.","\"Shock rock\" or certain hip-hop artists use theatrical or controversial elements in their performances to provoke audiences."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00552","kind":"word","word":"short-circuit","meaning":"a bad electrical connection that causes the current to flow in the wrong direction, often having the effect of stopping the power supply","examples":["If those two wires touch, the appliance will short-circuit and probably go up in flames.","The fire was started by a short circuit in an electric cable."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00553","kind":"word","word":"shortage","meaning":"a situation in which there is not enough of something:","examples":["There's a shortage of food and shelter in the refugee camps.","There is a severe shortage of low-cost housing in the city.","a shortage implies that there is some power, just not enough, and an outage implies that there is no power for a specific area usually the local area."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00554","kind":"word","word":"should the need arise","meaning":"if it is necessary:","examples":["Could you work on Saturday, should the need arise?","We can always rent a car, should the need arise.","They are prepared to make a higher bid if t
