<title>Vocab Desk</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Site-wide tokens (colors, Fraunces, IBM Plex Mono) + the shared nav bar. -->
<link rel="stylesheet" href="../shared/theme.css">
<!-- Fonts this page needs beyond what shared/theme.css already loads. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+JP:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap">

<style>
  /* Canonical tokens (--paper, --ink, --accent, --serif, ...) come from
     /shared/theme.css as aliases to the site's shared palette -- see that
     file's header comment. Only this page's own extras stay here: the
     Japanese-script font stack, and the deliberate accent-color swap when
     browsing the Japanese corpus (data-lang="jp"), which is a scoped,
     intentional in-app touch, not a site-consistency gap. */
  :root {
    --sans:     "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --jp-serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --jp-sans:  "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  /* ---------- tokens: Japanese overrides — washi paper, ai-iro indigo, bengara red ---------- */
  :root[data-lang="jp"] {
    --paper:    #F4EEE1;
    --paper-2:  #ECE4D2;
    --ink:      #1B1614;
    --ink-2:    #35302B;
    --muted:    #6B6558;
    --faint:    #A29A8B;
    --rule:     #D4CBB6;
    --rule-2:   #E4DBC6;
    --accent:   #2B4A78;
    --accent-2: #E4E9F1;
    --warn:     #B44530;
    --warn-2:   #F1DED3;
    --focus:    #2B4A78;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-lang="jp"]:not([data-theme="light"]) {
      --paper:    #14100C;
      --paper-2:  #1B1712;
      --ink:      #EDE7D9;
      --ink-2:    #C4BFB0;
      --muted:    #857F71;
      --faint:    #574F44;
      --rule:     #2D2620;
      --rule-2:   #211B15;
      --accent:   #8DA5CE;
      --accent-2: #1E2635;
      --warn:     #D97960;
      --warn-2:   #291B15;
      --focus:    #8DA5CE;
    }
  }
  :root[data-lang="jp"][data-theme="dark"] {
    --paper:    #14100C;
    --paper-2:  #1B1712;
    --ink:      #EDE7D9;
    --ink-2:    #C4BFB0;
    --muted:    #857F71;
    --faint:    #574F44;
    --rule:     #2D2620;
    --rule-2:   #211B15;
    --accent:   #8DA5CE;
    --accent-2: #1E2635;
    --warn:     #D97960;
    --warn-2:   #291B15;
    --focus:    #8DA5CE;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01","cv11";
  }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

  /* ---------- layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .rail { position: sticky; top: 0; z-index: 10; }
  }

  .rail {
    background: var(--paper-2);
    border-right: 1px solid var(--rule);
    padding: 24px 18px;
    display: flex; flex-direction: column; gap: 22px;
  }
  /* The shared .site-nav (Home/Workout/Vocab pills, from shared/theme.css)
     sits inside this narrow vertical rail rather than a horizontal header
     here, so it stacks instead of running in a row. */
  .rail .site-nav {
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    margin: -8px 0 6px -8px;
  }
  .rail .site-nav a { padding: 5px 8px; font-size: 12px; }
  .brand {
    display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px;
  }
  .brand .mark {
    font-family: var(--serif);
    font-weight: 500;
    font-variation-settings: "SOFT" 20, "opsz" 90;
    font-size: 24px;
    letter-spacing: -0.01em;
    line-height: 1.05;
    color: var(--ink);
  }
  .brand .mark-jp {
    display: none;
    font-family: var(--jp-serif);
    font-weight: 400;
    font-size: 15px;
    color: var(--accent);
    margin-top: 2px;
    letter-spacing: 0.02em;
  }
  :root[data-lang="jp"] .brand .mark-jp { display: block; }
  .brand .tag {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }

  /* ---------- language switch ---------- */
  .lang-switch {
    display: flex; gap: 2px;
    padding: 3px;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: 6px;
  }
  .lang-switch button {
    flex: 1;
    background: transparent; border: 0;
    padding: 7px 8px; border-radius: 4px;
    font: inherit; font-size: 12.5px;
    color: var(--muted); cursor: pointer;
    transition: background .12s, color .12s;
  }
  .lang-switch button:hover { color: var(--ink); }
  .lang-switch button[aria-current="true"] {
    background: var(--paper); color: var(--ink);
    box-shadow: var(--shadow-1);
    font-weight: 500;
  }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: grid; grid-template-columns: 1fr auto;
    align-items: center;
    padding: 8px 10px;
    background: transparent;
    border: 0;
    border-radius: 4px;
    color: var(--ink-2);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .nav button .count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .nav button:hover { background: color-mix(in oklab, var(--ink) 5%, transparent); }
  .nav button[aria-current="true"] {
    background: var(--accent-2); color: var(--ink);
  }
  .nav button[aria-current="true"] .count { color: var(--accent); }

  .rail .foot {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 8px;
    padding-top: 16px;
    border-top: 1px dashed var(--rule);
  }
  .theme-toggle, .link-btn {
    background: transparent; border: 0; padding: 6px 8px;
    text-align: left; color: var(--muted); font: inherit; cursor: pointer;
    border-radius: 4px;
    font-size: 12.5px;
  }
  .theme-toggle:hover, .link-btn:hover { color: var(--ink); background: color-mix(in oklab, var(--ink) 5%, transparent); }

  .stage {
    padding: 40px 44px 80px;
    max-width: 900px;
    width: 100%;
  }
  @media (max-width: 640px) { .stage { padding: 28px 20px 60px; } }

  /* ---------- headings & meta ---------- */
  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  h1.page {
    font-family: var(--serif);
    font-weight: 400;
    font-variation-settings: "opsz" 140;
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: -0.012em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .lede {
    color: var(--muted);
    max-width: 60ch;
    margin: 0 0 32px;
  }

  /* ---------- card (word view) ---------- */
  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow-1);
    padding: 36px 40px 32px;
    min-height: 380px;
    display: flex; flex-direction: column;
    position: relative;
  }
  @media (max-width: 640px) { .card { padding: 26px 22px 22px; } }
  .card .head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule-2);
    margin-bottom: 22px;
  }
  .card .headword {
    font-family: var(--serif);
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    font-size: clamp(38px, 5.4vw, 60px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    color: var(--ink);
    text-wrap: balance;
    word-break: break-word;
  }
  :root[data-lang="jp"] .card .headword {
    font-family: var(--jp-serif);
    font-weight: 400;
    font-variation-settings: normal;
    font-size: clamp(40px, 5.8vw, 64px);
    line-height: 1.15;
    letter-spacing: 0.01em;
  }
  /* Reading line (rōmaji, etc.) beneath the headword — dictionary-pronunciation feel. */
  .card .reading {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(15px, 1.6vw, 18px);
    letter-spacing: 0.02em;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.35;
  }
  .card .reading::before,
  .card .reading::after { color: var(--faint); }
  .card .reading::before { content: "/ "; }
  .card .reading::after  { content: " /"; }
  .card .kind-badge {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .meaning-block { margin-bottom: 20px; }
  .meaning-block .label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .meaning-block .body { white-space: pre-wrap; color: var(--ink); }
  .meaning-block.empty .body { color: var(--faint); font-style: italic; }

  .examples { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
  .examples .ex {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15.5px;
    color: var(--ink-2);
    padding-left: 14px;
    border-left: 2px solid var(--rule);
    line-height: 1.55;
  }
  .examples .ex::before {
    content: "“";
    font-family: var(--serif);
    color: var(--faint);
    margin-right: 2px;
  }
  .examples .ex::after {
    content: "”";
    font-family: var(--serif);
    color: var(--faint);
    margin-left: 2px;
  }

  .my-well {
    margin-top: auto;
    background: var(--paper-2);
    border: 1px dashed var(--rule);
    border-radius: 4px;
    padding: 12px 14px;
  }
  .my-well .label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
    display: flex; justify-content: space-between;
  }
  .my-well textarea {
    width: 100%; resize: vertical;
    min-height: 44px;
    background: transparent; border: 0; padding: 0;
    color: var(--ink);
    font-family: var(--serif);
    font-style: italic;
    font-size: 15.5px;
    line-height: 1.5;
    outline: none;
  }
  .my-well textarea::placeholder { color: var(--faint); font-style: italic; }

  /* ---------- meta / progress dots on card ---------- */
  .card .foot-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
  }
  .box-dots { display: inline-flex; gap: 4px; }
  .box-dots .dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--rule);
  }
  .box-dots .dot.on { background: var(--accent); }

  /* ---------- review controls ---------- */
  .rev-controls {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 22px;
  }
  .rev-controls button {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 12px 8px;
    cursor: pointer;
    font: inherit;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: background .12s ease, border-color .12s ease;
  }
  .rev-controls button:hover { border-color: color-mix(in oklab, var(--ink) 25%, var(--rule)); }
  .rev-controls .grade {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }
  .rev-controls .key {
    font-family: var(--serif);
    font-size: 18px;
    color: var(--ink);
  }
  .rev-controls .again { border-top: 3px solid var(--warn); }
  .rev-controls .hard  { border-top: 3px solid var(--gold); }
  .rev-controls .good  { border-top: 3px solid var(--accent); }
  .rev-controls .easy  { border-top: 3px solid var(--accent); background: var(--accent-2); }

  .flip-btn {
    background: var(--ink);
    color: var(--paper);
    border: 0;
    border-radius: 4px;
    padding: 12px 20px;
    font: inherit;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    align-self: center;
    margin-top: 22px;
    transition: opacity .12s;
  }
  .flip-btn:hover { opacity: .85; }

  /* ---------- empty state ---------- */
  .empty-state {
    padding: 60px 24px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--rule);
    border-radius: var(--radius);
  }
  .empty-state h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 22px;
    color: var(--ink);
    margin: 0 0 6px;
  }
  .empty-state p { margin: 0; max-width: 40ch; margin-inline: auto; }

  /* ---------- triage ---------- */
  .triage-card { }
  .triage-card .headword { font-size: clamp(30px, 4vw, 44px); }
  .triage-form { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
  .triage-form label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    display: block; margin-bottom: 4px;
  }
  .triage-form textarea, .triage-form input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 10px 12px;
    color: var(--ink);
    font: inherit;
    line-height: 1.5;
    resize: vertical;
    font-family: var(--sans);
  }
  .triage-form textarea { min-height: 90px; }
  .triage-actions { display: flex; gap: 8px; margin-top: 8px; }
  .btn {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 9px 14px;
    cursor: pointer;
    font: inherit;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .btn:hover { border-color: color-mix(in oklab, var(--ink) 25%, var(--rule)); }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.primary:hover { opacity: .88; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.warn { color: var(--warn); border-color: var(--warn); }

  .triage-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 12px;
    letter-spacing: 0.06em;
  }

  /* ---------- multi-sense editor ---------- */
  .sense-editor {
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 14px 14px 12px;
    background: var(--paper-2);
    display: flex; flex-direction: column; gap: 10px;
    position: relative;
  }
  .sense-editor .sense-head {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sense-editor .sense-head .n {
    display: inline-flex; align-items: center; gap: 8px;
  }
  .sense-editor .sense-head .n .num {
    display: inline-block;
    width: 20px; height: 20px; line-height: 20px;
    text-align: center;
    border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink-2);
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0;
  }
  .sense-editor .pos-in {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 3px 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-2);
    width: 90px;
    text-transform: lowercase;
  }
  .sense-editor .def-ta {
    width: 100%;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 9px 11px;
    color: var(--ink); font: inherit;
    font-family: var(--sans);
    min-height: 60px; resize: vertical;
    line-height: 1.5;
  }
  .sense-editor .ex-list { display: flex; flex-direction: column; gap: 6px; }
  .sense-editor .ex-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 6px; align-items: center;
  }
  .sense-editor .ex-row input {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 8px 11px;
    color: var(--ink-2); font: inherit;
    font-family: var(--serif);
    font-style: italic;
    line-height: 1.5;
  }
  .sense-editor .ex-row input::placeholder { color: var(--faint); }
  .icon-btn {
    background: transparent; border: 0; padding: 4px 8px;
    color: var(--faint); cursor: pointer;
    font-family: var(--mono); font-size: 14px; line-height: 1;
    border-radius: 3px;
  }
  .icon-btn:hover { color: var(--warn); background: color-mix(in oklab, var(--warn) 8%, transparent); }
  .add-inline {
    background: transparent; border: 1px dashed var(--rule);
    color: var(--muted); cursor: pointer;
    padding: 6px 10px; border-radius: 4px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    align-self: flex-start;
  }
  .add-inline:hover { border-color: var(--accent); color: var(--accent); }
  .add-sense {
    background: transparent; border: 1px dashed var(--rule);
    color: var(--muted); cursor: pointer;
    padding: 10px 14px; border-radius: 5px;
    font-family: var(--mono); font-size: 11.5px;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .add-sense:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-2); }
  .sense-editor .sense-head .del-sense {
    color: var(--faint);
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase;
    background: transparent; border: 0; cursor: pointer;
    padding: 2px 6px; border-radius: 3px;
  }
  .sense-editor .sense-head .del-sense:hover { color: var(--warn); }

  /* ---------- sub-tab bar (Daily) ---------- */
  .sub-tabs {
    display: flex; gap: 4px;
    padding: 4px;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: 6px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .sub-tab {
    flex: 1;
    background: transparent; border: 0;
    padding: 8px 14px; border-radius: 4px;
    font: inherit;
    color: var(--muted); cursor: pointer;
    font-size: 13px;
    letter-spacing: 0.01em;
    transition: background .12s, color .12s;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    white-space: nowrap;
    min-width: 0;
  }
  .sub-tab:hover { color: var(--ink); }
  .sub-tab[aria-current="true"] {
    background: var(--paper);
    color: var(--ink);
    box-shadow: var(--shadow-1);
  }
  .sub-tab .badge {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    background: color-mix(in oklab, var(--ink) 6%, transparent);
    padding: 1px 6px; border-radius: 999px;
  }
  .sub-tab[aria-current="true"] .badge { color: var(--accent); background: var(--accent-2); }

  /* ---------- sentence history ---------- */
  .my-history { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .my-history .entry {
    display: grid; grid-template-columns: 78px 1fr auto;
    align-items: baseline; gap: 10px;
    padding: 6px 0;
    border-top: 1px dashed var(--rule);
  }
  .my-history .entry:first-child { border-top: 0; }
  .my-history .entry .date {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .my-history .entry .text {
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.5;
  }
  .my-history .entry .del {
    background: transparent; border: 0; padding: 2px 6px;
    color: var(--faint); cursor: pointer;
    font-family: var(--mono); font-size: 13px; line-height: 1;
    border-radius: 3px;
  }
  .my-history .entry .del:hover { color: var(--warn); }
  .my-history .editable {
    width: 100%;

  /* ---------- edit toggle on the review card ---------- */
  .edit-toggle {
    align-self: flex-start;
    margin-top: -8px; margin-bottom: 14px;
    background: transparent; border: 1px dashed var(--rule);

    padding: 4px 10px; border-radius: 3px;
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer;
  }
  .edit-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .edit-toggle[aria-pressed="true"] {
    background: var(--accent-2); border-color: var(--accent); border-style: solid;
    color: var(--accent);
  }

  /* ---------- multi-sense display (review + detail read-only) ---------- */
  .senses-view { display: flex; flex-direction: column; gap: 18px; margin-bottom: 20px; }
  .senses-view .s {
    display: grid; grid-template-columns: 26px 1fr;
    gap: 10px; align-items: start;
  }
  .senses-view .s .num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    text-align: right;
    padding-top: 3px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  .senses-view .s .body {
    display: flex; flex-direction: column; gap: 8px;
  }
  .senses-view .s .pos {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: -4px;
  }
  .senses-view .s .def {
    color: var(--ink);
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .senses-view .s .exs {
    display: flex; flex-direction: column; gap: 4px;
    padding-left: 12px;
    border-left: 2px solid var(--rule);
    margin-top: 2px;
  }
  .senses-view .s .exs .ex {
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink-2);
    font-size: 15px;
    line-height: 1.5;
  }
  .senses-view .s .exs .ex::before { content: "“"; color: var(--faint); }
  .senses-view .s .exs .ex::after  { content: "”"; color: var(--faint); }

  /* ---------- progress dashboard ---------- */
  .grid-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin: 24px 0 32px;
  }
  .stat {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .stat .num {
    font-family: var(--serif);
    font-weight: 400;
    font-variation-settings: "opsz" 144;
    font-size: 34px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stat .lbl {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }
  .stat.warn .num { color: var(--warn); }
  .stat.accent .num { color: var(--accent); }

  .boxes {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 20px 22px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    margin-bottom: 24px;
  }
  .box-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box-col .bar {
    width: 100%; max-width: 60px;
    background: var(--accent-2);
    border-top: 3px solid var(--accent);
    min-height: 4px;
    transition: height .3s ease;
  }
  .box-col .n {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .box-col .l {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--faint);
  }

  .heatmap {
    display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px;
    padding: 20px; background: var(--paper);
    border: 1px solid var(--rule); border-radius: var(--radius);
  }
  .heatmap .cell {
    aspect-ratio: 1;
    background: var(--rule-2);
    border-radius: 2px;
  }
  .heatmap .cell[data-l="1"] { background: color-mix(in oklab, var(--accent) 20%, var(--paper-2)); }
  .heatmap .cell[data-l="2"] { background: color-mix(in oklab, var(--accent) 45%, var(--paper-2)); }
  .heatmap .cell[data-l="3"] { background: color-mix(in oklab, var(--accent) 75%, var(--paper-2)); }
  .heatmap .cell[data-l="4"] { background: var(--accent); }
  .heatmap .cell[data-today="1"] { outline: 1px solid var(--ink); outline-offset: 1px; }

  /* ---------- twisters ---------- */
  .twister-hero {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 40px 44px;
    margin-bottom: 24px;
  }
  .twister-hero .text {
    font-family: var(--serif);
    font-weight: 400;
    font-variation-settings: "opsz" 144;
    font-size: clamp(22px, 3vw, 30px);
    line-height: 1.35;
    text-wrap: balance;
    color: var(--ink);
  }
  .twister-hero .lbl {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .twister-list {
    display: flex; flex-direction: column;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);

  .twister-list .item {
    display: grid; grid-template-columns: 40px 1fr auto;
    align-items: center; gap: 12px;
    padding: 12px 16px;

    font-size: 15px;

    flex: 1;

    border-radius: 4px;
    padding: 10px 12px;

  /* ---------- library ---------- */
  .lib-controls {

    align-items: center;
  }

    border-radius: 4px; padding: 8px 12px;

  .filter-chip[aria-pressed="true"] {
    background: var(--accent-2); border-color: var(--accent); color: var(--accent);
  }

  .lib-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .lib-wrap { overflow-x: auto; }
  .lib-table th, .lib-table td {
    text-align: left; padding: 10px 14px;
    border-top: 1px solid var(--rule-2);
    vertical-align: top;
  }
  .lib-table th {
    font-family: var(--mono); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--muted); border-top: 0;
    background: var(--paper-2);
    position: sticky; top: 0;
  }
  .lib-table td.word {
    font-family: var(--serif); font-size: 16px; color: var(--ink);
    white-space: nowrap;
  }
  :root[data-lang="jp"] .lib-table td.word { font-family: var(--jp-serif); }
  .lib-table td.meaning {
    color: var(--ink-2);
    max-width: 480px;
  }
  .lib-table td.meta {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); white-space: nowrap;
  }
  .lib-table tbody tr { cursor: pointer; }
  .lib-table tbody tr:hover { background: var(--paper-2); }

  .pill {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; padding: 2px 6px;
    border-radius: 3px; border: 1px solid var(--rule);
    color: var(--muted);
  }
  .pill.new    { color: var(--muted); }
  .pill.due    { color: var(--warn); border-color: var(--warn); background: var(--warn-2); }
  .pill.learning{ color: var(--gold); border-color: var(--gold); }
  .pill.known  { color: var(--accent); border-color: var(--accent); background: var(--accent-2); }

  /* ---------- data screen ---------- */
  .data-panel {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 16px;
  }
  .data-panel h3 {
    font-family: var(--serif); font-weight: 400; font-size: 20px;
    margin: 0 0 6px; letter-spacing: -0.005em;
  }
  .data-panel p { color: var(--muted); margin: 0 0 14px; }
  .data-panel .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .file-in { display: none; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper);
    padding: 10px 16px; border-radius: 4px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em;
    box-shadow: var(--shadow-2);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 100;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>

warmer weather and blooming flowers.\"","\"With the advent of the internet, communication became much faster and more accessible.\"","\"The advent of the Industrial Revolution completely reshaped society and the economy.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00020","kind":"word","word":"adversity","meaning":"a difficult or unlucky situation or event:","examples":["The road to happiness is paved with adversities.","The vaults can be used as emergency bunkers in the event of adversities."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00021","kind":"word","word":"aesthetic","meaning":"relating to the enjoyment or study of beauty:","examples":["The new building has little aesthetic value/appeal.","Aesthetic treatments include everything from skincare products to injectables.","He moves beyond aesthetic analysis to relate these themes to the broader historical context."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00022","kind":"word","word":"affidavit","meaning":"An affidavit is a written statement that someone makes after promising officially to tell the truth, which might be used as evidence in a court of law or for other legal purposes.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00023","kind":"word","word":"affixation","meaning":"Affixation is a noun that refers to the linguistic process of adding a smaller, bound unit of meaning (an affix) to a core base word (the root or stem) to create a entirely new word or to change its grammatical function.\n\nThe word comes from the Latin affixus, which is the past participle of affigere (meaning \"to attach\" or \"to fasten\"), combining the prefix ad- (to) with figere (to fix or fasten).","examples":["A. Linguistics and Grammar\nThis is the primary use of the word. Affixation is the fundamental way humans build complex vocabulary out of simple building blocks.\n\nExample: \"The word 'unhappiness' is formed through the affixation of both a prefix ('un-') and a suffix ('-ness') to the root word 'happy'.\"\n\nExample: \"English relies heavily on suffix affixation to change a verb's tense, such as adding '-ed' to make it past tense.\"","B. Physical Attachment (Literal)\nIn highly formal, legal, or administrative writing, it can describe the physical act of permanently attaching one object to another.\n\nExample: \"The contract is not legally binding without the affixation of the official corporate seal.\"\n\nExample: \"The postal worker verified the proper affixation of the stamps before processing the package.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00024","kind":"word","word":"aficionado","meaning":"A aficionado (pronounced ah-fih-see-oh-NAH-doh) is a person who is very knowledgeable and enthusiastic about an activity, subject, or pastime.\n\nThe word comes from Spanish and implies a deep passion, expertise, and love for something. It suggests someone who is not just casually interested, but deeply immersed and devoted.","examples":["\"He's a true jazz aficionado and can identify any tune within seconds.\"","\"The annual wine tasting event attracted many culinary aficionados.\"","\"For film aficionados, the director's cut offers new insights.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00025","kind":"word","word":"aforementioned","meaning":"Aforementioned is an adjective that means mentioned previously.\n\nIt's a formal word used to refer back to a person, thing, or idea that has already been spoken or written about in the same text or conversation. It's a way to avoid repeating the full name or description of something.","examples":["\"The two students, Jane and Mark, presented their findings. The aforementioned students will be awarded for their research.\"","\"We discussed the new budget proposal. Based on the aforementioned discussion, we will make a final decision next week.\"","\"The report detailed several security risks. The aforementioned risks must be addressed immediately.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00026","kind":"word","word":"agitate","meaning":"To agitate has several meanings, primarily revolving around stirring something up or causing disturbance/concern.","examples":["To Stir or Shake (a liquid, mixture, etc.) vigorously:\n\"You need to agitate the paint before applying it.\"","To Make Someone Troubled, Nervous, or Upset:\n\"Please don't agitate the patient; he needs rest.\"","To Campaign or Lobby (for a political or social cause):\n\"They agitated for higher wages and better working conditions.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00027","kind":"word","word":"ailment","meaning":"an illness:","examples":["Treat minor ailments yourself.","a respiratory/stomach ailment","Almost 40% of interviewees (93/240) indicated that they were consulting about a minor ailment."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00028","kind":"word","word":"alleviate","meaning":"to make something bad such as pain or problems less severe:","examples":["The drugs did nothing to alleviate her pain/suffering.","The medicine did nothing to alleviate her discomfort.","The contributors mostly see the growth of civil society and the strengthening of civic education as important ways of alleviating the situation."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00029","kind":"word","word":"allude","meaning":"\"Allude\" means to indirectly refer to something without mentioning it explicitly. It is often followed by \"to\" (e.g., \"allude to something\").","examples":["which alludes to the fact that","She alluded to her past struggles but didn’t go into detail.\" (She hinted at her struggles without explicitly stating them.)","\"The book alludes to historical events without directly naming them.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00030","kind":"word","word":"altruism","meaning":"Altruism (noun) is the belief in or practice of disinterested and selfless concern for the well-being of others. It's about acting out of genuine concern for the welfare of others, without expecting personal gain or reward.","examples":["\"The volunteer's altruism was evident in the countless hours she dedicated to helping the homeless.\"","\"Many acts of heroism are driven by profound altruism.\"","\"Scientists continue to study the evolutionary roots of altruism in human and animal behavior.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00031","kind":"word","word":"amass","meaning":"to get a large amount of something, especially money or information, by collecting it over a long period:","examples":["She has amassed a huge fortune from her novels.","Some of his colleagues envy the enormous wealth that he has amassed.","A scientific discipline consists not only of amassing facts and explaining them in theories."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00032","kind":"word","word":"ambience","meaning":"Ambience (also spelled ambiance) is a noun that describes the distinctive character, mood, or atmosphere of a particular environment or physical space.\n\nThe word traces back to the Latin ambire, meaning \"to go around\" or \"to surround.\" It literally refers to the invisible qualities that surround you when you step into a room.","examples":["A. Hospitality and Design\nThis is the most frequent use of the word in daily life. It describes how lighting, furniture, temperature, and decor combine to make a person feel when they enter a restaurant, hotel, or home.\n\nExample: \"The restaurant’s dim lighting and soft jazz music created a very romantic ambience.\"\n\nExample: \"We painted the living room a warm yellow to give it a more cheerful ambience.\"","B. Sound and Acoustics\nIn audio engineering and video game design, \"ambient sound\" or \"ambience\" refers to the continuous background noise of a specific environment. It is the sound of the space itself, rather than a specific focal point.\n\nExample: \"The sound designer recorded the ambience of a busy coffee shop to use in the background of the podcast.\"\n\nExample: \"Ambient music is designed to enhance the ambience of a room without demanding your active attention.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00033","kind":"word","word":"ambiguous","meaning":"having or expressing more than one possible meaning, sometimes intentionally:","examples":["Many companies are appealing against the ruling, because the wording is ambiguous.","Innovations in agriculture tend to promote deforestation, although in the case of land-augmenting technical change this result is ambiguous.","Many tasks involve sensory information that is ambiguous, and other sources of information may be required for adequate perception."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00034","kind":"word","word":"amidst (amid)","meaning":"in the middle of or surrounded by:","examples":["On the floor, amid mounds of books, were two small envelopes.","The new perfume was launched amidst a fanfare of publicity.","We camped that night in a shallow valley amid low hills."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00035","kind":"word","word":"amount to","meaning":"\"Amount to\" is a phrasal verb with several meanings, generally revolving around totaling, equating to, or resulting in something.","examples":["\"All her efforts amounted to nothing in the end.\"","To Be Equivalent To; To Be Identical To (often implying a serious or unexpected equivalence):\n\"His silence amounted to an admission of guilt.\" (His silence was essentially the same as admitting guilt.)\n\"Their refusal to negotiate amounts to a declaration of war.\" (Their refusal is equivalent to declaring war.)","To Result In; To Become:\n\"He's never really amounted to much.\" (Meaning, he's never achieved significant success or importance.)\n\"Her hard work eventually amounted to a successful career.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00036","kind":"word","word":"amplification","meaning":"Amplification makes music or other sounds louder:","examples":["electronic amplification"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00037","kind":"word","word":"amplify","meaning":"To amplify is also to add to the information given in something:","examples":["A funeral can amplify the feelings of regret and loss for the relatives.","Electric guitars are amplified through loudspeakers.","This study amplifies earlier research.","The fragment amplified from the mitochondrial non-coding region showed dimorphism."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00038","kind":"word","word":"analog/analogue","meaning":"Analog (also spelled analogue) functions as both a noun and an adjective. At its core, it refers to something that is proportionate, similar, or comparable to something else.\n\nThe word originates from the Greek analogos, meaning \"proportionate\" or \"according to a proper ratio.\"","examples":["A. Science and Technology (Adjective)In technology, an analog system represents data using continuously variable, measurable physical quantities (like voltage, sound waves, or the physical sweeping hands of a clock). This is the direct opposite of \"digital\" technology, which translates data into discrete, separate numbers ($0$s and $1$s).Example: \"Audiophiles often prefer analog vinyl records over digital MP3s because they believe the continuous sound wave captures more warmth.\"Example: \"The old submarine was entirely controlled by mechanical, analog dials and levers rather than touchscreens.\"","B. Chemistry and Biochemistry (Noun)\nIn molecular biology and pharmacology, a chemical analog is a compound with a molecular structure that is very similar to that of another naturally occurring compound, but differs by a single specific component.\n\nExample: \"The pharmaceutical company developed a synthetic analog of the hormone that lasts longer in the bloodstream.\"\n\nExample: \"Many antibiotic drugs act as substrate analogs, binding to bacterial enzymes to block their normal function.\"","C. General Comparison (Noun)\nIn everyday language, it refers to a person or thing that is comparable to another in a different context.\n\nExample: \"The vegetarian restaurant created a surprisingly accurate analog for a beef burger using black beans and mushrooms.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00039","kind":"word","word":"analogous","meaning":"\"Analogous\" means similar or comparable in certain aspects, typically in a way that allows for analogy or comparison between two different things. It suggests that although the items being compared may be different in nature, they share some characteristics that are relevant for understanding or explaining something.","examples":["\"The structure of the atom is analogous to the solar system, with electrons orbiting the nucleus like planets orbiting the sun.\"","\"Her experience in managing a team was analogous to running a small business.\"","\"The two species have analogous traits that help them survive in similar environments.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00040","kind":"word","word":"analogy","meaning":"a comparison between things that have similar features, often used to help explain a principle or idea:","examples":["He drew an analogy between the brain and a vast computer.","It is sometimes easier to illustrate an abstract concept by analogy with (= by comparing it with) something concrete.","He was explaining that the mind has no form and is invisible, and that a useful analogy is of the mind being like the sky."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00041","kind":"word","word":"aneurysm","meaning":"An aneurysm is a bulge or ballooning in the wall of a blood vessel, most commonly an artery. This bulge is caused by a weakening in the blood vessel wall.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00042","kind":"word","word":"Angeleno","meaning":"An Angeleno (pronounced An-juh-LEE-noh) is a native or resident of Los Angeles, California.\n\nIt's a demonym, which is a word used to denote a resident or native of a particular place.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00043","kind":"word","word":"anorexia","meaning":"Anorexia nervosa (often shortened to \"anorexia\") is a serious and potentially life-threatening eating disorder characterized by a person's refusal to maintain a healthy body weight, an intense fear of gaining weight, and a distorted body image.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00044","kind":"word","word":"anthrax","meaning":"A Serious Infectious Disease (most common meaning):\n\nDefinition: Anthrax is a serious infectious disease caused by spore-forming bacteria, Bacillus anthracis. It typically affects hoofed animals (like cattle, sheep, goats), but it can also infect humans.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00045","kind":"word","word":"apathy","meaning":"lack of interest, or the attitude of not caring resulting from it:","examples":["There is a growing sense of apathy among teens and a feeling that there are no opportunities, he said.","The problem of boredom as a health care issue has been subsumed under research on other complaints such as depression, apathy, or fatigue.","How ironic that it was the war that was likely to dispel at least some of this apathy, whether real or presumed."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00046","kind":"word","word":"aphrodisiac","meaning":"An aphrodisiac is a food, drink, or other substance that is believed to increase sexual desire or arousal. The term comes from the name of the Greek goddess of love and beauty, Aphrodite.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00047","kind":"word","word":"apologia","meaning":"An apologia is a formal written defense or justification of one's beliefs, opinions, or actions. It is a reasoned argument in response to an accusation or criticism, intended to defend a position rather than to simply apologize for it.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00048","kind":"word","word":"appeal","meaning":"a request made to a court of law or to someone in authority to change a previous decision:","examples":["l She has lodged (= made) an appeal against the severity of the fine.","He won his appeal and the sentence was halved.","The appeal was rejected by the High Court.","The police have issued an appeal to the public to stay away from the area over the weekend.","They're launching (= starting) an appeal to raise money for famine victims."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00049","kind":"word","word":"appease","meaning":"To appease means to pacify or placate someone by acceding to their demands; to relieve or satisfy a demand or a feeling.","examples":["\"The manager tried to appease the angry customer with a full refund and a gift voucher.\"","\"Critics argued that the government's foreign policy was an attempt to appease aggressive dictatorships.\"","\"A snack was offered to appease their hunger until dinner.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00050","kind":"word","word":"apportionment","meaning":"the act of sharing something between several people or organizations:","examples":["The apportionment of resources within the health service is very complicated.","I do not argue that apportionments should be based on actual votes cast rather than population."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00051","kind":"word","word":"appraisal","meaning":"\"Appraisal\" refers to an act of assessing or evaluating the worth, value, quality, or nature of something or someone. It's a formal judgment or estimation.","examples":["Real Estate and Finance: This is one of the most common uses. An appraisal is a professional valuator's opinion of the market value of a property (like a house, land, or commercial building) or an asset.","An appraisal (often called a performance appraisal or performance review) is a regular assessment of an employee's job performance, skills, and contribution to the organization. It usually involves feedback and setting goals.","\"We need to get an official appraisal of the house before the bank will approve the mortgage.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00052","kind":"word","word":"arbitrarily","meaning":"in a way that is based on chance rather than being planned or based on reason:","examples":["We made the decision to go to Italy quite arbitrarily.","We didn't make these changes arbitrarily, but for a good reason.","You can't just arbitrarily say that there are going to be 500 more students."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00053","kind":"word","word":"arbitrate","meaning":"to make a judgment in an argument, usually because asked to do so by those involved:","examples":["An outside adviser has been brought in to arbitrate the dispute between the management and the union.","In some cases, the specific institutions of the federal arrangement have arbitrated ethnic conflict peacefully.","As local courts are costly and unable to cope with the number of cases, village meetings to arbitrate in land matters have become more popular."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00054","kind":"word","word":"archaic","meaning":"\"Archaic\" refers to something that is very old or outdated, often relating to language, customs, or practices that are no longer in common use. It can also describe words or phrases that were once used but have fallen out of favor in modern times.","examples":["\"Some legal terms are archaic and may confuse those unfamiliar with them.\"","\"The museum displayed archaic artifacts from ancient civilizations.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00055","kind":"word","word":"arise","meaning":"to start to happen or exist:","examples":["If the opportunity arises, I'd love to go to China.","He died of complications arising from heart surgery."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00056","kind":"word","word":"aristocrat","meaning":"Aristocrat is a noun that refers to a member of the highest social class in a society, often someone who holds a hereditary title (like a duke, earl, or baron) and possesses significant inherited wealth and political influence.\n\nThe word originates from the Greek aristos, meaning \"best,\" and kratia, meaning \"rule\" or \"power.\" Literally, it translates to \"rule by the best,\" reflecting the historical belief that nobility were inherently superior and best suited to govern.","examples":["A. History and Government\nThis is the literal and historical use of the word, describing the ruling class in a monarchy or an aristocracy.\n\nExample: \"During the French Revolution, many an aristocrat was forced to flee the country and abandon their sprawling estates.\"\n\nExample: \"He was born an aristocrat, inheriting his grandfather's title and a seat in the House of Lords.\"","B. Finance and Investing\nIn the modern stock market, a \"Dividend Aristocrat\" is a highly specific, prestigious title given to an S&P 500 company that has not only paid out dividends but has consistently increased its dividend payout every single year for at least 25 consecutive years.\n\nExample: \"Because the investor wanted stable, guaranteed income for retirement, she focused her portfolio entirely on Dividend Aristocrats.\"","C. Behavior and Demeanor (Figurative)\nIn everyday conversation, the word can describe someone who behaves with immense elegance, refinement, or a slight air of snobbish superiority, regardless of their actual birth.\n\nExample: \"Even though she grew up completely broke, she carried herself with the flawless posture and grace of an aristocrat.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00057","kind":"word","word":"arrest","meaning":"To stop or slow down the progress, motion, or development of something.","examples":["Vigorous treatment can arrest the spread of the disease.","A sudden noise arrested his movement."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00058","kind":"word","word":"article","meaning":"grammar","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00059","kind":"word","word":"artifice","meaning":"(the use of) a clever trick or something intended to deceive:","examples":["Amazingly for Hollywood, she seems almost entirely without artifice.","Yet other groups are united by a commonality, due to nature or artifice, that does affect how they themselves behave."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00060","kind":"word","word":"ascertain","meaning":"To find out or determine something with certainty, often through investigation or inquiry.","examples":["The detective tried to ascertain the cause of the accident.\"","\"Before making a decision, she needed to ascertain all the relevant facts.\"","\"The scientist conducted several tests to ascertain the accuracy of the results.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00061","kind":"word","word":"aside","meaning":"\"Aside\" is a versatile word that can function as an adverb or a noun, with its core meaning usually revolving around to one side or apart from.","examples":["\"She pushed the curtain aside to look out the window.\"","\"Joking aside, we need to focus on the task.\" (Leaving jokes out of the main focus)","\"The court set the previous ruling aside.\" (Overturned or dismissed it)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00062","kind":"word","word":"aspire","meaning":"\"Aspire\" means to have a strong desire, longing, or ambition to achieve something high or great. It implies directing one's hopes or efforts towards achieving a significant goal.","examples":["\"She aspires to become a renowned neurosurgeon.\"","\"Many young athletes aspire to compete in the Olympics.\"","\"He aspired to a life of quiet contentment rather than fame.\"","Many athletes aspire to compete in the Olympics.","He aspires to a leadership role within the company.","They aspire after a world with no poverty."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00063","kind":"word","word":"assent","meaning":"To assent means to express approval or agreement, especially in a formal or official way. It's about giving one's consent or sanction.\n\nBoth assent and consent mean to agree to something, but they differ in the degree of formality, capacity, and authority involved. Consent is a stronger, more formal, and often legal term, implying a deliberate and free choice made by someone with the capacity to understand the implications. Assent is a milder form of agreement, often implying passive compliance or a lack of power to disagree.","examples":["\"The child assented to the doctor's examination.\"","\"The board members all assented to the new budget proposal with a nod.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00064","kind":"word","word":"assert","meaning":"to behave in a way that expresses your confidence, importance, or power and earns you respect from others:","examples":["The companies have asserted that everything they did was appropriate.","Several members of Congress called upon the president to assert leadership.","You have to learn to speak up and assert yourself at meetings, or you’ll never get anywhere."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00065","kind":"word","word":"assertion","meaning":"Assertion is a noun that means a confident and forceful statement of a fact or belief.\n\nWhen a person makes an assertion, they are declaring something to be true, often without immediately providing the proof or evidence to back it up. The word comes from the Latin asserere, meaning \"to claim\" or \"to declare.\"","examples":["A. Debate and Academic Writing\nIn rhetoric, essays, and debate, an assertion is the primary claim you are trying to convince your audience to believe. It is the backbone of your argument.\n\nExample: \"The author's core assertion is that renewable energy will completely replace fossil fuels within three decades.\"\n\nExample: \"The defense lawyer aggressively challenged the witness's assertion that she had seen the defendant at the scene of the crime.\"","B. Computer Science and Software Engineering\nIn programming, an \"assertion\" is a specific line of code used for debugging. It is a confident statement by the programmer that a specific condition must be true at that exact moment in the program. If the condition turns out to be false, the program immediately throws an \"AssertionError\" and crashes, preventing the system from producing corrupted data.\n\nExample: \"Before running the complex calculation, the engineer added an assertion to ensure the input variable was never zero.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00066","kind":"word","word":"assume","meaning":"to accept something to be true without question or proof:","examples":["I assumed (that) you knew each other because you went to the same school.","The stoichiometry of the exact reaction will depend on the nature of the organic matter involved, here assumed to be saturated aliphatic hydrocarbon.","Let us assume for the moment that such simulations are possible physically and follow the implications."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00067","kind":"word","word":"assumption","meaning":"something that you accept as true without question or proof:","examples":["People tend to make assumptions about you when you have a disability.","The plan was based on the assumption that the schedule could be substantially speeded up by adding more people.","They decided to go ahead on the assumption that the figures they had been given were accurate."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00068","kind":"word","word":"astound","meaning":"to surprise and shock someone, esp. with news of something that is completely unexpected:","examples":["Considering how badly they’re paid and what little support they get, the dedication of these teachers astounds me.","Its policies of that period are credited for its astounding economic growth.","The era's ideological bigotry is nothing short of astounding."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00069","kind":"word","word":"astride","meaning":"with a leg on each side of something:","examples":["The town lies astride (= on either side of) the River Havel.","She sat proudly astride her new motorbike.","He was good enough to tell me before he left that some minor technical adjustment was required to that technological wonder which sits astride his splendid brow."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00070","kind":"word","word":"at bay","meaning":"idiomatic expression that means to keep something or someone at a distance or under control, often to prevent them from causing harm or creating trouble. For example, if you keep your fears at bay, you're managing to control or suppress them so they don't overwhelm you. It can also refer to keeping something from advancing or approaching closer, as if holding it at a safe distance.","examples":["Despite the rising tensions, diplomatic efforts are keeping the conflict at bay for now.","Regular exercise and a healthy diet can help keep many health problems at bay."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00071","kind":"word","word":"atheist","meaning":"someone who does not believe in any god or gods, or who believes that no god or gods exist:","examples":["As an atheist, I do not accept this religious argument.","Although I am atheist, I don’t just automatically hate religion or dismiss other people's faith.","Kaufman claims that his atheist beliefs play a central role in his life."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00072","kind":"word","word":"atlas","meaning":"An atlas primarily refers to a book of maps.","examples":["\"I used the atlas to plan our road trip across the country.\"","\"A human anatomy atlas shows detailed illustrations of the body's systems.\"","\"The celestial atlas plots the positions of stars and galaxies.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00073","kind":"word","word":"attenuate","meaning":"Attenuation generally means to reduce the force, effect, or value of something; to weaken or thin. It's about making something less intense, less powerful, or less concentrated.","examples":["\"Filters are used to attenuate high frequencies in an audio signal.\"","\"The drug helps to attenuate the painful symptoms.\"","\"Fibers can be attenuated by drawing them through a small opening.\" (Made thin)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00074","kind":"word","word":"audible","meaning":"able to be heard:","examples":["The lecturer spoke so quietly that he was scarcely audible at the back of the hall.","She gave an audible sigh of relief."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00075","kind":"word","word":"audibly","meaning":"Audibly (adverb) means in a way that can be heard.\n\nIt describes an action or sound that is loud enough or clear enough to be perceived by the ear. It's the adverbial form of the adjective \"audible\" (able to be heard).","examples":["\"She sighed audibly with relief as she finally sat down.\" (Her sigh was loud enough to be heard.)","\"He swallowed audibly, trying to compose himself before speaking.\" (His swallowing sound was distinct.)","\"The old floorboards creaked audibly as he walked across the room.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00076","kind":"word","word":"aversion","meaning":"(a person or thing that causes) a feeling of strong dislike or of not wishing to do something:","examples":["She has a deep aversion to getting up in the morning.","Greed is my pet aversion (= the thing I dislike most of all).","The countdown task consisted of five trials with two separate conditions: signaled aversion and unsignaled aversion."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00077","kind":"word","word":"axiom","meaning":"Axiom is a noun that refers to a statement or proposition that is considered so self-evidently true that it is accepted without controversy or question. It serves as the unquestioned starting point for further reasoning or arguments.\n\nThe word originates from the Greek axiōma, meaning \"that which is thought worthy or fit\" (essentially, a principle worthy of being assumed true).","examples":["In formal logic and math, an axiom is an unprovable rule that forms the absolute foundation of a system. You cannot prove an axiom; you simply have to accept it to do any further calculations.\n\nExample: \"In Euclidean geometry, it is a fundamental axiom that the shortest distance between two points is a straight line.\"\n\nExample: \"To build a functioning AI logic model, the programmers had to establish a few basic axioms about how the agent should behave.\"","In general conversation, an axiom is a universally accepted rule, a proverb, or a practical truth about human nature or society.\n\nExample: \"It is a widely held axiom in politics that people vote with their wallets.\"\n\nExample: \"The coach built his training program on the simple axiom that hard work beats talent.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00078","kind":"word","word":"b.o.","meaning":"Body odor","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00079","kind":"word","word":"balk","meaning":"to be unwilling to do something or to allow something to happen:","examples":["I balked at the prospect of spending four hours on a train with him.","We should not be balked by the fact that local authorities cannot meet this sort of expenditure during the ensuing year."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00080","kind":"word","word":"basis","meaning":"the most important facts, ideas, etc. from which something is developed:","examples":["This document will form the basis for our discussion.","Decisions were often made on the basis of (= using) incorrect information.","Their proposals have no proven scientific basis.","Skills need to be updated on an ongoing basis.","She's employed by the agency on a temporary basis.","Assessment of insurance claims takes place on a case-by-case basis."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00081","kind":"word","word":"battery","meaning":"legal context","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00082","kind":"word","word":"beef","meaning":"slang","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00083","kind":"word","word":"beg to differ","meaning":"\"I beg to differ\" is a polite and formal expression used to state that you disagree with someone or with something that has just been said. It's a more courteous way of saying \"I disagree,\" \"I don't agree,\" or \"That's not my opinion.\" It signals that you are about to present an opposing viewpoint without being confrontational or rude.","examples":["\"You mentioned that the project is behind schedule, but I beg to differ; we are actually ahead according to the latest report.\"","\"While many believe the new policy will solve the problem, I beg to differ. I think it will create more issues.\"","\"With all due respect, sir, I beg to differ on that point.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00084","kind":"word","word":"belittle","meaning":"to make a person or an action seem as if he, she or it is not important:","examples":["Though she had spent hours fixing the computer, he belittled her efforts."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00085","kind":"word","word":"benchmark","meaning":"In general terms, a benchmark is a standard or point of reference against which things may be compared or assessed. Think of it as a \"yardstick\" used to measure the quality, value, or performance of something else.","examples":["In finance, a benchmark is often an index (like the S&P 500) used to measure the performance of a portfolio. If your stocks gained $8\\%$, but the benchmark gained $12\\%$, your portfolio underperformed relative to the market.","\"The new processor set a new benchmark for energy efficiency, consuming $20\\%$ less power than the previous generation.\"","\"This court ruling provides a benchmark for how future privacy cases will be handled.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00086","kind":"word","word":"berth","meaning":"a bed in a boat or train, or a place for a ship or boat to stay in a port","examples":["In addition, the berths approved for use have been selected so as to minimise the effect on the public of any accidental release of radioactivity."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00087","kind":"word","word":"bestow","meaning":"to give something as an honour or present:","examples":["The country’s highest medal was bestowed upon him for heroism.","The George Cross is a decoration that is bestowed upon/on British civilians for acts of great bravery."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00088","kind":"word","word":"bid","meaning":"to offer a particular amount of money for something that is for sale and compete against other people to buy it, especially at a public sale of goods or property:","examples":["The communications group has shown an interest in bidding for the company.","A foreign collector has bid $500,000 for the portrait.","What am I bid for this fine vase?"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00089","kind":"word","word":"blistering","meaning":"Extremely Hot or Intense (causing blisters): This is the literal meaning, referring to something so hot it could cause blisters on skin.\nExtremely Fast; Rapid: Often used to describe speed or pace in a figurative sense.\nVery Harsh, Severe, or Scathing (of criticism, anger, etc.): Used to describe strong, often aggressive, verbal attacks or conditions.","examples":["\"The sun beat down with blistering heat on the desert landscape.\"\n\"After working in the garden all day, my hands developed blistering calluses.\"","\"The runner finished the marathon at a blistering pace.\"\n\"The new software processes data with blistering speed.\"","\"The politician faced blistering criticism from the opposition.\"\n\"The manager gave the team a blistering rebuke after the poor performance.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00090","kind":"word","word":"blitz","meaning":"london blitz","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00091","kind":"word","word":"blockade","meaning":"to surround a country or place with soldiers, ships, etc. to stop people or goods from going in or out:","examples":["Fishermen began blockading ports to protest the high cost of diesel fuel.","French farmers lifted their blockade of the Channel Tunnel yesterday.","Protesters are threatening to blockade refineries if the Government does not lower the tax on fuel."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00092","kind":"word","word":"blunt","meaning":"\"Blunt\" is a word with several distinct meanings, used as both an adjective and a verb. It often implies a lack of sharpness, either literally or figuratively.","examples":["\"He was hit by a blunt instrument, causing a serious injury.\"","Direct and Frank (in speech or manner): Saying exactly what you think without trying to be polite or considering other people's feelings. This often implies a lack of subtlety or tact. \"She's known for her blunt honesty, which some people find refreshing and others find rude.\"","\"The passage of time can blunt the pain of grief.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00093","kind":"word","word":"border on","meaning":"It means to be very like, come very close to being, or verge on something else, especially something extreme or undesirable.","examples":["\"His enthusiasm for the subject began to border on obsession.\" (His enthusiasm was so intense it was almost obsessive.)","\"Her politeness was so extreme it began to border on sarcasm.\" (It was so polite it felt like sarcasm.)","\"The play's dialogue sometimes borders on the ridiculous.\" (It was almost ridiculous.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00094","kind":"word","word":"botch","meaning":"Botch is a verb (and sometimes a noun) that means to do something badly, clumsily, or unsuccessfully. When you botch a task, you ruin it through incompetence, carelessness, or a lack of skill, resulting in a messy or unusable final product.\n\nThe word traces back to the Middle English bocchen, which originally meant \"to patch or repair clumsily.\" Over time, the meaning shifted from a bad repair job to the act of ruining the job entirely.","examples":["A. Everyday Tasks and Projects\nIn daily life, it describes ruining a hands-on task, a performance, or a conversation.\n\nExample: \"I tried to cut my own hair during the lockdown, but I completely botched it.\"\n\nExample: \"He was so nervous during the interview that he botched the answer to the very first question.\"","B. Professional and Medical Errors\nIn professional settings, a \"botched\" job implies a severe, often costly failure by someone who should have known better. It is frequently used as an adjective to describe failed medical procedures or corporate initiatives.\n\nExample: \"The patient had to undergo reconstructive surgery to fix a botched cosmetic procedure.\"\n\nExample: \"The software company lost thousands of users after a severely botched server migration.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00095","kind":"word","word":"bound","meaning":"Tied; Fastened; Secured: \"The packages were bound with strong twine.\"\nObligated; Required; Committed: Under a moral, legal, or contractual obligation; certain to do something. \"He is bound by his contract to complete the work.\"\nTraveling or destined for a particular place. \"The train is bound for Busan.\"\nLimited or restricted by conditions or circumstances. \"We are bound by the rules of the organization.\"","examples":["To form a boundary or limit of an area.\n\"The field was bounded by a stone wall.\"\n\"The property is bounded on the north by the river.\"","A Leap or Jump: \"With a single bound, the dog cleared the fence.\"\nA Boundary or Limit (often plural): \"The discussion went beyond the bounds of polite conversation.\"\n\"He respected the bounds of his authority.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00096","kind":"word","word":"brandish","meaning":"Brandish is a verb that means to wave or flourish something, especially a weapon, in a menacing, theatrical, or excited way. The action implies a public display, often as a threat or a show of power.","examples":["\"The robber brandished a knife at the store clerk.\"","\"He brandished his diploma, celebrating his graduation.\"","\"The politician brandished a copy of the report, claiming it proved his opponent's corruption.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00097","kind":"word","word":"bribe","meaning":"the act of giving someone money or something else of value, often illegally, to persuade that person to do something you want:","examples":["Congressmen have been accused of accepting bribes to pass bills favoring particular companies.","They were accused of trying to bribe voters with promises of tax cuts.","Corrupt officials had been bribed to approve shoddy construction work."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00098","kind":"word","word":"browse","meaning":"To browse means to look through something casually, often without a specific goal or intention to buy or find something particular. It implies a relaxed and unhurried examination.","examples":["\"She likes to browse online clothing stores, even if she doesn't buy anything.\" (Looking at items, not necessarily purchasing)","\"He browsed through the channels on TV, trying to find something interesting.\"","\"Deer were Browse peacefully in the meadow.\" (Of an animal) to feed on leaves, tender shoots, or other vegetation."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00099","kind":"word","word":"buzzword","meaning":"A buzzword is a word or phrase, often from a specialized field, that has become fashionable or trendy, and is used frequently and conspicuously to impress or to give an impression of expertise.\n\n\"Buzzword\" often carries a slightly negative or cynical connotation, implying that the word is used more for its trendy appeal or to sound impressive rather than for clear communication.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00100","kind":"word","word":"by virtue of","meaning":"\"By virtue of\" is an idiom that means because of, on account of, or as a result of.\n\nIt indicates that something is true, or something happens, because of the inherent quality, power, or existence of something else. It often implies that the reason is an inherent characteristic or a specific right/privilege.","examples":["\"He was granted citizenship by virtue of his marriage to a national.\" (Because of his marital status)","\"The company succeeded by virtue of its innovative technology.\" (Because its technology was innovative)","\"The law is binding on all citizens by virtue of its being duly enacted.\" (Because it was legally enacted)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00101","kind":"word","word":"cadaver","meaning":"A \"cadaver\" is a term used to refer to a dead body, particularly one that is used for medical or scientific purposes, such as in anatomy studies or surgical training. It is often associated with the field of medicine and research.","examples":["\"Medical students learn about human anatomy by studying cadavers in the lab.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00102","kind":"word","word":"calf","meaning":"This is perhaps the most common meaning. A calf is a young bovine, specifically the young of a domestic cow.\nThe calf is the fleshy, muscular back part of the human leg below the knee. It's primarily formed by the gastrocnemius and soleus muscles.","examples":["The calf stayed close to its mother in the pasture.","e saw a baby humpback whale, a tiny calf, swimming next to its enormous mother.","After a long run, his calves were sore."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00103","kind":"word","word":"came at great personal cost","meaning":"The phrase \"came at great personal cost\" means that achieving something (a goal, a victory, a piece of knowledge, etc.) required significant sacrifice, suffering, or hardship on the part of the individual.","examples":["His promotion to CEO came at great personal cost, as he neglected his family for years and suffered from burnout.","The athlete's Olympic gold medal came at great personal cost, requiring countless hours of training and enduring multiple severe injuries.","She finally found justice, but it came at great personal cost, as the legal battle drained her financially and emotionally"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00104","kind":"word","word":"capital","meaning":"adjective","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00105","kind":"word","word":"capricious","meaning":"A capricious person or thing is characterized by sudden and unaccountable changes of mood or behavior. It means that something is prone to unpredictable and impulsive shifts, often without any logical reason.","examples":["\"The weather in the mountains is often capricious, changing from sunshine to sudden storms in minutes.\"","\"Her capricious nature made it difficult to plan anything with her; she might agree one day and cancel the next.\" (Prone to sudden changes of mind)","\"The capricious demands of the director made the actors' jobs very challenging.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00106","kind":"word","word":"careen","meaning":"To move swiftly and in an uncontrolled or unsteady way, often by tilting or swaying from side to side.\n(Nautical) To turn a ship on its side (or partially over) in order to clean, caulk, or repair its hull below the waterline.","examples":["The car lost a tire and began to careen wildly across the highway.","The shopping cart, overloaded with groceries, started to careen down the aisle.","The sailors had to careen the old wooden vessel to fix the damaged planks."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00107","kind":"word","word":"carnal","meaning":"\"Carnal\" primarily means relating to physical, especially sexual, needs and activities. It often contrasts with spiritual or intellectual matters, focusing on the desires and appetites of the body.","exa
