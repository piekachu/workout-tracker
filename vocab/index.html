mples":["\"The novel explored themes of both spiritual yearning and carnal desire.\"","\"He indulged in carnal pleasures, neglecting his intellectual pursuits.\"","\"He preached against the dangers of carnal temptations and worldly possessions.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00108","kind":"word","word":"carousel","meaning":"A Rotating Display – Used in websites, advertisements, or retail stores to showcase images or products in a sliding or rotating manner.","examples":["\"The homepage features a carousel of the latest fashion trends.\"","\"The children enjoyed riding the carousel at the fair.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00109","kind":"word","word":"casket","meaning":"a small, decorative box, especially one used to keep jewellery in (or just a coffin)","examples":["After his death, his body was encased inside a casket along with his most valuable belongings."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00110","kind":"word","word":"cathedral","meaning":"a very large, usually stone, building for Christian worship. It is the largest and most important church of a diocese:","examples":["I was woken up by the chimes of the cathedral bells.","The old city around the cathedral is the most colourful part of town.","In the cathedral vaults the air was dank and stale."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00111","kind":"word","word":"caught up","meaning":"To Become Involved in Something (often against one's will): This means to be entangled in a situation, often one that is unexpected or out of your control.\n\nExample: \"I got caught up in the protest on my way home.\"","examples":["To Reach the Same Point as Someone Who is Ahead of You: This is about closing a gap, whether it's in a race, work, or school.\n\nExample: \"After being sick for a week, I had to work hard to get caught up on my assignments.\"","To Be Fully Informed or Updated: To get the latest information about something you've missed.\n\nExample: \"I haven't seen you in a while, let's grab coffee and get caught up.\"","I don't want to get caught up in the idiotic shenanigans of my brother."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00112","kind":"word","word":"caveat","meaning":"a warning to consider something before taking any more action, or a statement that limits a more general statement:","examples":["There are, of course, caveats to be made here: not everything is possible through these two mechanisms.","We will review herein some of the evidence and the caveats surrounding the neurodevelopmental hypothesis.","One caveat that must be noted in this situation is that our assumptions have low fidelity."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00113","kind":"word","word":"cease","meaning":"to stop:","examples":["He ordered his men to cease firing.","Her behaviour never ceases to amaze me."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00114","kind":"word","word":"churn","meaning":"To stir or agitate a liquid, especially milk or cream, to make butter.","examples":["She churned the cream until it turned into butter."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00115","kind":"word","word":"circuit","meaning":"a particular area containing different courts that a judge visits:","examples":["He was a familiar figure on the lecture circuit.","They first met each other on the tennis circuit (= while at different tennis competitions).","He always takes part in the polo circuit.","The judge had served for many years on the northeastern Circuit."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00116","kind":"word","word":"clam","meaning":"a type of sea creature with a hard shell in two parts, or its soft body that can be eaten raw or cooked","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00117","kind":"word","word":"clause","meaning":"A clause is a group of words that contains a subject (who or what performs the action) and a verb (the action or state of being). It's a fundamental building block of sentences.","examples":["In this context, a clause is a particular and separate article, stipulation, section, or provision within the document. Each clause typically deals with a specific point or condition.","\"The contract included a clause outlining the penalties for late payment.\"","\"The non-disclosure agreement had a confidentiality clause.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00118","kind":"word","word":"cluttered","meaning":"Cluttered (adjective) means covered with a disorganized collection of things. It describes a state of being messy, untidy, or filled with an excessive amount of stuff in a disorderly way.","examples":["My desk was cluttered with laundry, books, leftover food, and toys.","My memory is cluttered with the images of my traumatic past."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00119","kind":"word","word":"coalition","meaning":"context is in a building","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00120","kind":"word","word":"codify","meaning":"to arrange something such as laws or rules into a formal system for people to follow:","examples":["We don't object to better standards, but we don't want them codified into state law.","The essential function of our organization is to codify best banking practice.","If a limited codification is deemed necessary, then this is what needs to be codified : act in accordance with a humble assessment."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00121","kind":"word","word":"cognitive","meaning":"connected with thinking or conscious mental processes:","examples":["Some of her cognitive functions have been impaired.","Studies show a connection between aerobic exercise and cognitive ability.","It also happens through information exchange that allows the emergence of cognitive distinction between players."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00122","kind":"word","word":"collectively","meaning":"as a group:","examples":["She has a staff of four who collectively earn almost $200,000.","Industrialized countries collectively spend over $240bn subsidizing intensive agriculture.","But perhaps we should collectively get over this and move on."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00123","kind":"word","word":"colonoscopy","meaning":"Colonoscopy is a noun that refers to a specific medical procedure in which a doctor examines the inner lining of a patient's large intestine (colon) and rectum.\n\nThe word is a straightforward combination of the Greek anatomical word kolon (the large intestine) and the suffix -scopy, which comes from skopein, meaning \"to look at\" or \"to examine.\"","examples":["A. Medical and Preventative Care\nThis is the literal and primary use of the word. It is a routine screening procedure used to detect early signs of colorectal cancer, look for swollen tissues, or remove abnormal growths called polyps.\n\nExample: \"Because he just turned forty-five, his primary care physician strongly recommended he schedule a routine colonoscopy.\"\n\nExample: \"The patient was asleep under mild sedation for the entire duration of the colonoscopy.\"","B. Figurative Use (Intense Scrutiny)\nIn informal or comedic contexts, people sometimes use the word metaphorically to describe an incredibly invasive, uncomfortable, and deeply thorough examination of something private, like their finances or personal history.\n\nExample: \"The defense attorney essentially gave the witness's alibi a colonoscopy while on the stand.\"\n\nExample: \"Applying for that top-secret security clearance felt like a financial colonoscopy; they looked at every single receipt I've kept for the last ten years.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00124","kind":"word","word":"committed","meaning":"loyal and willing to give your time and energy to something that you believe in:","examples":["The whole family are committed vegetarians."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00125","kind":"word","word":"commodity","meaning":"a substance or a product that can be traded in large quantities, such as oil, metals, grain, coffee, etc.:","examples":["One big commodity that Canada exports is oil.","Higher commodities prices boosted first-quarter profits.","Returning barren fields to their natural state as wetlands creates a host of \"wetland mitigation credits,\" a commodity the company plans to sell."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00126","kind":"word","word":"compel","meaning":"to produce a strong feeling or reaction:","examples":["Over the years her work has compelled universal admiration and trust.","In 1543 an earth-centered cosmos was the physical orthodoxy of the day, supported by philosophical arguments that, at the time, were peculiarly compelling.","\"Compelling\" typically means captivating or persuasive, often in a way that draws intense interest or attention. It doesn't inherently carry a negative meaning; rather, it suggests something that is so engaging or persuasive that it's difficult to ignore or resist. For example, a compelling argument or a compelling story can be positive attributes, indicating that they are particularly strong or convincing."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00127","kind":"word","word":"compensation","meaning":"\"Compensation\" is a word with several related meanings, generally revolving around the idea of counterbalancing, making up for something, or providing something (often money) in recognition of loss, suffering, or work done.","examples":["The company offers a competitive compensation package to attract top talent.","The court ordered the defendant to pay compensation to the victims of the accident.","The thermostat includes a compensation mechanism to account for ambient temperature changes."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00128","kind":"word","word":"complacent","meaning":"A person who is complacent is feeling smug or uncritical satisfaction with oneself or one's achievements. It implies a sense of self-satisfaction that is often accompanied by a lack of awareness of potential dangers, deficiencies, or challenges. A complacent attitude can lead to a failure to prepare for future problems, or to resist calls for change, because one is too comfortable with the current state of affairs.","examples":["\"After years of success, the company became complacent and failed to innovate, eventually losing market share.\"","\"We cannot afford to be complacent about climate change; urgent action is required.\"","\"His complacent attitude about the upcoming exams worried his parents, as he hadn't studied at all.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00129","kind":"word","word":"complicity","meaning":"Complicity (noun) refers to the state of being involved with others in an illegal activity or wrongdoing. It means being an accomplice or a partner in a crime or morally objectionable act, often by helping, encouraging, or being aware of the act and failing to report it.","examples":["\"The police investigated his complicity in the financial fraud.\"","\"Her silence in the face of the injustice was viewed as complicity.\"","\"The report highlighted the government's complicity in human rights abuses.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00130","kind":"word","word":"comply","meaning":"to act according to an order, set of rules, or request:","examples":["The state's mining law requires mine operators to comply with local land use regulations.","He's been ordered to have the dog destroyed because it's dangerous, but he refuses to comply.","There are serious penalties for failure to comply with the regulations."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00131","kind":"word","word":"composure","meaning":"Composure is a noun that describes the state of being calm, collected, and in complete control of your emotions, especially in highly stressful or difficult situations.\n\nThe word originates from the Latin componere, meaning \"to put together.\" When you have composure, your mind and emotions are firmly \"put together\" rather than falling apart under pressure.","examples":["A. Professional and High-Stakes Environments\nThis is the most common use of the word. It describes a person's ability to maintain a clear head when things go wrong, allowing them to make rational decisions instead of panicking.\n\nExample: \"Despite the aggressive questions from the reporters, the CEO maintained her composure and answered calmly.\"\n\nExample: \"Emergency room nurses are trained to keep their composure no matter how chaotic the trauma center becomes.\"","B. Athletics and Performance\nIn sports or public speaking, composure is the psychological anchor that prevents an individual from making unforced errors when the spotlight is on them.\n\nExample: \"The gymnast lost her balance for a fraction of a second, but she quickly regained her composure and finished the routine flawlessly.\"\n\nExample: \"Taking a slow, deep breath before walking onto the stage helped him recover his composure.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00132","kind":"word","word":"compound inerest","meaning":"interest calculated on both the initial principal and all of the previously accumulated interest","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00133","kind":"word","word":"compression","meaning":"the act of pressing something into a smaller space or putting pressure on it from different sides until it gets smaller:","examples":["Tectonic forces caused compression in the earth’s crust.","Compression fractures of the spine are common in older people."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00134","kind":"word","word":"compromise","meaning":"an agreement in an argument in which the people involved reduce their demands or change their opinion in order to agree:","examples":["In a compromise between management and unions, a four percent pay rise was agreed in return for an increase in productivity.","His opponents charged that the deal would compromise conservative principles.","Don't compromise your beliefs/principles for the sake of being accepted."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00135","kind":"word","word":"compunction","meaning":"Compunction (noun) is a feeling of guilt or moral scruple that prevents or follows the doing of something bad. It's a sense of uneasiness, remorse, or hesitation about an action that you think may be wrong.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00136","kind":"word","word":"computation","meaning":"the act or process of calculating an answer or amount by using a machine:","examples":["a scientific software package for numerical computations","The amount due was a simple matter of mathematical computation."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00137","kind":"word","word":"con artist","meaning":"A con artist is a person who swindles or defrauds others by means of a confidence trick.","examples":["\"The con artist posed as a wealthy investor, convincing people to give him money for a fake startup.\"","\"She was a master con artist, able to disappear with people's life savings before they even realized they'd been tricked.\"","\"Beware of strangers offering get-rich-quick schemes; they might be a con artist.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00138","kind":"word","word":"concatenate","meaning":"To concatenate is a verb that means to link or join things together in a chain or a series.\nWhile it can be used in general English to describe things linked in a sequence, it is most frequently used as a technical term in computer science, mathematics, and linguistics.","examples":["If you have String A (\"Hello\") and String B (\"World\"), concatenating them results in \"HelloWorld\".","In English, we concatenate the prefix 'un-' with the word 'happy' to create 'unhappy'."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00139","kind":"word","word":"concede","meaning":"to admit, often unwillingly, that something is true:","examples":["The former president's concession came even before all the votes had been counted.","Some politicians fear that agreeing to the concession would set a dangerous precedent.","The government has conceded (that) the new tax policy has been a disaster.","The chairman conceded that shareholders had been \"impacted by the decline in market prices\".","The insurers ultimately conceded liability for repairing the damage to the car."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00140","kind":"word","word":"concession","meaning":"something that is allowed or given up, often in order to end a disagreement, or the act of allowing or giving this:","examples":["As a concession to environmental groups, the energy giant agreed to scale down its coal plant expansion plans.","The administration has demanded concessions from auto workers as part of the \"viability plan\" it is preparing.","We would be prepared to make concessions in order to reach an agreement."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00141","kind":"word","word":"concise","meaning":"short and clear, expressing what needs to be said without unnecessary words:","examples":["Make your answers clear and concise."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00142","kind":"word","word":"condone","meaning":"To condone means to accept and allow behavior that is considered morally wrong or offensive to continue. It implies that by not doing anything to stop or criticize something bad, you are implicitly approving of it or giving it your silent permission.","examples":["\"The school does not condone bullying in any form.\" (They do not allow or approve of it.)","\"His silence was interpreted as an act to condone the unethical behavior.\" (By not speaking up, he seemed to approve.)","\"Society cannot condone violence as a means to resolve conflict.\" (It cannot accept or allow violence.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00143","kind":"word","word":"conducive","meaning":"providing the right conditions for something to happen or exist:","examples":["These kinds of responses were conducive to language development and provided a guide to the students in their thinking about language.","Our mild climate is conducive to outdoor entertaining.","Such a noisy environment was not conducive to a good night's sleep."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00144","kind":"word","word":"conduit","meaning":"someone or something that provides a way of passing something such as information or payments from one person to another:","examples":["They make pipes and tubes that are used in construction and as electrical conduits.","The warehouse will be a regional conduit for goods shipped to the port, then transported to stores.","The social media platform has served as a conduit for misinformation."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00145","kind":"word","word":"confer","meaning":"to exchange ideas on a particular subject, often in order to reach a decision on what action to take:","examples":["They were in constant contact, conferring about every aspect of the construction project.","We asked for some time to confer with our advisers."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00146","kind":"word","word":"confine","meaning":"to limit an activity, person, or problem in some way:","examples":["Let's confine our discussion to the matter in question, please!","Please confine your use of the phone to business calls.","By closing the infected farms we're hoping to confine the disease to the north of the region.","The hostages had been confined for so long that they couldn't cope with the outside world."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00147","kind":"word","word":"connoisseur","meaning":"A connoisseur (pronounced kon-uh-SOOR or kon-uh-SUR) is a person who is an expert judge in matters of taste. They have a highly developed knowledge and appreciation of a particular subject, especially in fine arts or culinary arts.\n\nIt implies a refined discernment and a deep, critical understanding gained through extensive experience and study.","examples":["\"He's a true wine connoisseur, able to identify the vintage and region of almost any bottle by taste.\"","\"The art gallery relies on a panel of connoisseurs to authenticate rare paintings.\"","\"To a coffee connoisseur, the brewing method is as important as the beans themselves.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00148","kind":"word","word":"connotation","meaning":"vs denotation","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00149","kind":"word","word":"constructively","meaning":"in a useful or helpful way","examples":["We ought to deal constructively with the problems.","92% reported improvement in their ability to resolve conflicts constructively."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00150","kind":"word","word":"contemplate","meaning":"to spend time considering a possible future action, or to consider one particular thing for a long time in a serious way:","examples":["The owner of the team contemplated moving his football club to another city.","He propelled people along career paths that without his encouragement they would never even have contemplated."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00151","kind":"word","word":"contempt","meaning":"behaviour that is illegal because it does not obey or respect the rules of a law court:","examples":["The tobacco companies may be guilty of contempt of court for refusing to produce the documents.","I would never hold someone in contempt for making a few mistakes in English.","You should treat those remarks with the contempt that they deserve.","She's beneath contempt (= I have no respect for her)!"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00152","kind":"word","word":"content","meaning":"pleased with your situation and not hoping for change or improvement:","examples":["He seems fairly content with (his) life.","I was just content to see my daughter in such a stable relationship but a grandchild, that really was the icing on the cake.","They're content to socialize with a very small circle of people."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00153","kind":"word","word":"contentment","meaning":"happiness and satisfaction, often because you have everything you need:","examples":["More people were finding that material things do not bring contentment .","His face wore a look of pure contentment."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00154","kind":"word","word":"contiguous","meaning":"Contiguous means touching or sharing a border, while continuous means without interruption or forming an unbroken whole.","examples":["\"five hundred contiguous dictionary entries\"","\"the 48 contiguous states\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00155","kind":"word","word":"contingent","meaning":"a group of people representing an organization or country, or a part of a military force:","examples":["The French contingent certainly made their presence known at this year's conference."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00156","kind":"word","word":"continuum","meaning":"A continuum (noun) is a continuous sequence or range in which adjacent elements are not perceptibly different from each other, but the extremes are quite distinct. It describes something that is a continuous whole, without clear breaks or divisions.","examples":["\"The electromagnetic spectrum is a continuum of different wavelengths of energy, from radio waves to gamma rays.\" (You can't point to one specific spot and say, \"This is where radio waves end and microwaves begin.\")","\"Political ideologies can be seen as a continuum from far-left to far-right.\"","\"There is a continuum between a language and a dialect; sometimes it's hard to tell where one stops and the other starts.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00157","kind":"word","word":"contradict","meaning":"(of people) to say the opposite of what someone else has said, or (of one fact or statement) to be so different from another fact or statement that one of them must be wrong:","examples":["Recent evidence has contradicted established theories on this subject.","Her testimony contradicted the policeman’s testimony, and the jury had to decide who was telling the truth.","We received contradictory accounts about the success of the military campaign."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00158","kind":"word","word":"contribute","meaning":"to give something, especially money, in order to provide or achieve something together with other people:","examples":["Aren't you going to contribute towards Jack's leaving present?","Her family has contributed $50,000 to the fund.","Devotion means 100% commitment, contribution means a proportional comitment."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00159","kind":"word","word":"controversial","meaning":"causing disagreement or discussion","examples":["a controversial issue/decision/speech/figure"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00160","kind":"word","word":"convalescent","meaning":"A convalescent is a person who is recovering from an illness, injury, or medical treatment. The term can also be used as an adjective to describe the period of recovery itself.","examples":["She is still in the convalescent stage of her recovery.","He spent a month at a specialized care facility for convalescents after his surgery."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00161","kind":"word","word":"convention","meaning":"\"convention\" can mean a custom, an international agreement, a large meeting, or an accepted artistic/technical standard.","examples":["This is about established traditions, accepted practices, or common manners that people generally follow. It's often an unwritten rule. \"By convention, the eldest child inherits the title.\"","In international relations, a convention is a formal agreement or treaty, especially one less formal than a full treaty but still legally binding for the signatories. \"The Geneva Conventions outline the rules of war and the treatment of prisoners.\"","A formal assembly or gathering of people for a common purpose, often to discuss particular matters, elect officials, or promote a cause. \"Attending the annual medical convention is a great way to stay updated on new research.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00162","kind":"word","word":"converse","meaning":"1. As a Verb: con-VERSE\nTo engage in conversation; to talk with someone. It implies a social, back-and-forth exchange of ideas.","examples":["\"They spent the evening conversing about their travel experiences.\"","\"It's important to converse openly to resolve misunderstandings.\"","\"It is difficult to converse with someone who is being intentionally irreverent during a serious meeting.\"","2. As a Noun or Adjective: CON-verse\nThis refers to the opposite or the reverse of a statement or situation. It is very common in logic, mathematics, and formal arguments.","\"She claims that all squares are rectangles, but the converse—that all rectangles are squares—is not true.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00163","kind":"word","word":"conversely","meaning":"\"Conversely\" is an adverb used to introduce a statement or idea that contrasts with or is opposite to what has just been mentioned. It indicates a shift in perspective or a different viewpoint.","examples":["\"She enjoys classical music; conversely, her brother prefers rock.\"","\"The new policy will benefit employees; conversely, it may increase costs for the company.\"","\"Some people thrive in a structured environment; conversely, others perform better with more freedom.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00164","kind":"word","word":"convey","meaning":"to express feelings, thoughts, or information to other people:","examples":["He always conveyed a sense of genuine interest in his students.","His poetry conveys a great sense of religious devotion.","Words alone cannot convey the untold misery endured by people in these refugee camps."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00165","kind":"word","word":"conveyance","meaning":"the legal process of moving land or property from one owner to another:","examples":["The expense of the conveyance usually falls upon the purchaser."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00166","kind":"word","word":"coon","meaning":"It is primarily used as a deeply insulting term for a Black person, especially in the United States. Its origins are tied to racist caricatures and minstrel shows, and it was widely used during slavery and the Jim Crow era to dehumanize and demean Black individuals.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00167","kind":"word","word":"corny","meaning":"Corny is an adjective used to describe something that is unoriginal, overly sentimental, or trying too hard to be funny. It refers to jokes, movies, or gestures that rely on tired clichés rather than genuine emotion or cleverness.\n\nThe word originally comes from the early 1900s, when it was used by city dwellers to describe the unsophisticated, rustic habits or tastes of \"country folks\" (people from the cornfields). Over time, it evolved into its modern meaning of being predictably cheesy.","examples":["A. Humor and Entertainment\nThis is the most frequent use. A \"corny joke\" (often synonymous with a \"dad joke\") is a pun or a punchline that is so obvious and unoriginal that it makes you groan rather than laugh out loud.\n\nExample: \"The comedian's routine was full of corny puns about farm animals.\"\n\nExample: \"I know it sounds corny, but my favorite movies are those predictable holiday rom-coms.\"","B. Overly Sentimental\nIt is also used to describe expressions of love, sadness, or patriotism that feel manufactured, exaggerated, or lacking in genuine depth.\n\nExample: \"He wrote her a poem, but it was so corny that she couldn't take it seriously.\"\n\nExample: \"The commercial tried to be inspiring, but the swelling music and slow-motion hugging just felt corny.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00168","kind":"word","word":"counterclaim","meaning":"A counterclaim is a claim made to rebut a previous claim. It is a claim, especially in a legal proceeding, that is made by a defendant against the plaintiff.","examples":["A contractor sues a homeowner for not paying for a renovation. The homeowner files a counterclaim arguing that the renovation was done poorly and caused property damage."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00169","kind":"word","word":"counterintuitive","meaning":"Something that is counterintuitive does not happen in the way you would expect it to:","examples":["It may seem counterintuitive to open a shop in the middle of a recession.","Steering a sailboat is counter-intuitive - you push the tiller the opposite way to the way you want to go.","His careful and counterintuitive analysis of the market brought him great success."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00170","kind":"word","word":"countermand","meaning":"\"Countermand\" means to revoke, cancel, or reverse an order or command that has already been given, usually by issuing a contrary order.","examples":["The general countermanded his previous order to attack, telling his troops to hold their position instead.","Due to the sudden change in weather, the captain had to countermand the instruction to set sail.","The client countermanded the payment after discovering an error in the invoice."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00171","kind":"word","word":"courteous","meaning":"Courteous (adjective) means polite, respectful, and considerate in one's behavior toward others. It describes someone who acts with good manners, shows deference, and is thoughtful in their interactions.","examples":["\"Despite the difficult situation, the customer remained surprisingly courteous.\"","\"He was always courteous to his elders, always opening doors for them.\"","\"A courteous reply can make a big difference in a disagreement.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00172","kind":"word","word":"covenant","meaning":"In law, a covenant is a type of contract or a specific clause within a contract where one party promises to do something (an affirmative covenant) or to refrain from doing something (a negative or restrictive covenant).","examples":["The two nations entered into a covenant to support each other in times of crisis.","She made a covenant with herself to finish her studies no matter the obstacles.","The deed for the house included a restrictive covenant preventing any new owners from painting the exterior a different color.","The company had to meet certain financial covenants as part of its loan agreement with the bank, such as maintaining a specific debt-to-equity ratio."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00173","kind":"word","word":"covert","meaning":"Covert (adjective) means not openly acknowledged or displayed; secret or disguised. It implies something that is hidden, concealed, or done in a way that is not easily seen or known.","examples":["\"They launched a covert investigation into the corruption allegations.\" (A secret investigation, done without public knowledge)","\"His actions were driven by covert motives that he never revealed.\" (Hidden motives)","\"The intelligence agency specializes in covert surveillance.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00174","kind":"word","word":"craigslist","meaning":"Craigslist is a long-standing and widely used online platform for local classified advertisements, connecting individuals within a community to buy, sell, find jobs, housing, and engage in various community activities, primarily for free.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00175","kind":"word","word":"cranium","meaning":"The \"cranium\" is the part of the skull that encloses and protects the brain. It consists of several bones that are fused together and forms the upper portion of the skull, providing structure and support.","examples":["\"The cranium protects the brain from external trauma.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00176","kind":"word","word":"credentials","meaning":"the abilities and experience that make someone suitable for a particular job or activity, or proof of someone's abilities and experience:","examples":["All the candidates had excellent academic credentials."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00177","kind":"word","word":"creditor","meaning":"A creditor is a person, company, or institution that lends money or extends credit to another party, expecting repayment.","examples":["The creditor demanded payment before the due date.","After failing to repay the loan, he was sued by his creditor.","Banks and financial institutions are common creditors for businesses and individuals."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00178","kind":"word","word":"creed","meaning":"A creed is a system of religious or philosophical beliefs, especially a formal statement of faith. It's a formal summary of fundamental beliefs or a set of guiding principles.","examples":["\"The company's creed was to prioritize customer satisfaction above all else.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00179","kind":"word","word":"cringe","meaning":"to suddenly move away from someone or something because you are frightened:","examples":["She didn't think she was afraid of being vaccinated, but cringed when she saw the needle.","This scene will have audiences cringing in fear.","The puppy is very nervous and cringes at every loud noise."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00180","kind":"word","word":"crip","meaning":"Historically, \"crip\" is a shortened, informal, and offensive form of the word \"cripple.\" \"Cripple\" itself has a long history, dating back to Old English, and refers to a person who is partially or totally unable to use one or more limbs, or who has difficulty walking.","examples":["\"Crips\" (capitalized) is the name of a well-known, primarily African-American alliance of street gangs that originated in Los Angeles, California, in 1969."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00181","kind":"word","word":"culminate","meaning":"If an event or series of events culminates in something, it ends with it, having developed until it reaches this point:","examples":["My arguments with the boss got worse and worse, and finally culminated in my resignation.","Their many years of research have finally culminated in a cure for the disease."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00182","kind":"word","word":"culprit","meaning":"A \"culprit\" is a person or thing responsible for a crime or a fault; it refers to someone who has committed an offense or wrongdoing. The term can also be used more generally to describe the source of a problem or undesirable situation.","examples":["\"The police are trying to identify the culprit behind the robbery.\"","\"In this case, the culprit for the project's failure was a lack of communication.\"","\"The culprit of the environmental damage was traced back to industrial waste.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00183","kind":"word","word":"cushion","meaning":"to reduce the bad effects of something:","examples":["Various attempts were made to cushion the impact of unemployment.","Overseas savings provide a cushion against tax rises at home."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00184","kind":"word","word":"cuttable","meaning":"able or available to be cut:","examples":["They expressed the cuttable timber in each area as a percentage of total cuttable timber in the state.","Applications to export rough cuttable diamonds will not be considered for any destination.","District leaders were asked to identify a cuttable 8 percent in their budgets."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00185","kind":"word","word":"cyst","meaning":"a round mass growing just under the skin or deeper in the body, that contains liquid:","examples":["He had a cyst removed from near his eye.","Depending on the geographical situation, the nature of infected hosts and the sites of infection, cysts may have different fertility rates."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00186","kind":"word","word":"dateline","meaning":"A dateline is a line of text that appears at the beginning of a news article or dispatch, stating the place where the story was written or filed, and often the date it was sent. It serves as a crucial piece of information for readers, indicating the origin of the report and its timeliness.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00187","kind":"word","word":"daunting","meaning":"\"Daunting\" describes something that seems difficult to deal with in anticipation; intimidating or discouraging because of its scale, difficulty, or apparent danger.","examples":["\"Climbing Mount Everest is a daunting challenge for even the most experienced mountaineers.\"","\"Facing a large audience for the first time can be a daunting prospect.\"","\"The amount of work required to complete the project seemed daunting.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00188","kind":"word","word":"de-centralized","meaning":"De-centralized (or decentralized, often spelled without the hyphen in modern usage, especially in computing and economics) describes a system, organization, or power structure where authority, control, or functions are distributed away from a central or single point.","examples":["\"The goal of the new management strategy is to create a more decentralized workflow, empowering individual teams.\"","\"Blockchain technology is famous for its decentralized ledger, which makes it very secure.\"","\"The movement advocates for a decentralized approach to education, allowing more local control over schools.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00189","kind":"word","word":"dearest","meaning":"Dearest is the superlative form of the adjective \"dear.\"\n\nIt is used to express the highest degree of affection, fondness, or endearment.","examples":["\"My dearest friend, I'm so happy to see you.\"","\"She held onto the photograph as her dearest possession.\"","\"My Dearest Mother,\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00190","kind":"word","word":"deats","meaning":"slang","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00191","kind":"word","word":"debutantes","meaning":"A debutante (pronounced deb-yoo-TAHNT) is a young woman from a wealthy or upper-class family who is making her first formal entrance into society.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00192","kind":"word","word":"decietful","meaning":"dishonest or hiding the truth:","examples":["deceitful behaviour","We protect consumers against unfair or deceitful practices.","At best it was misleading; at worst it was downright deceitful."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00193","kind":"word","word":"dedicate","meaning":"to give all of your energy, time, etc.:","examples":["He dedicated his life to helping the poor.","Dedicating something is very special and meaningful. Devoting something is even deeper, more meaningful."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00194","kind":"word","word":"deed","meaning":"This is the more general meaning, referring to something that is done, an act, or an achievement. It often implies an intentional action. It can be good or bad.","examples":["Helping the stranded motorist was a good deed.","The villain's evil deeds finally caught up with him."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00195","kind":"word","word":"define","meaning":"To define means to state or explain the meaning of a word, phrase, concept, or term.It's about providing a clear, precise, and often authoritative description that clarifies what something is, what it means, or what its boundaries are.","examples":["\"The dictionary defines ' ephemeral' as lasting for a very short time.\"","\"The bright light helped to define the contours of her face.\"","\"We need to define the project scope before we begin.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00196","kind":"word","word":"degree","meaning":"A qualification awarded to students who have successfully completed a course of study at a college or university.","examples":["She earned a Bachelor's degree in history.","Refers to the intensity, amount, or level of something. It indicates a certain point on a scale.\nTo what degree are you committed to this project?","amily Relationships (Degrees of Kinship)\nUsed to describe the remoteness of a relationship.\nFirst-degree relatives include parents, siblings, and children."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00197","kind":"word","word":"delineate","meaning":"\"Delineate\" means to describe or portray something precisely, or to indicate the exact position of a border or boundary.","examples":["The main characters are clearly delineated in the first chapter.","The boundary of the car park is delineated by a low brick wall.","The constitution carefully delineates the duties of the treasurer’s office.","\"The professor asked us to delineate the main arguments of the philosopher's theory.\"","\"The report clearly delineates the company's strategy for the next five years.\"","\"The treaty delineated the new borders between the countries.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00198","kind":"word","word":"demean","meaning":"to cause someone to become less respected:","examples":["The entire family was demeaned by his behaviour.","I wouldn't demean myself by asking my parents for money."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00199","kind":"word","word":"demographics","meaning":"statistical data relating to the population and particular groups within it.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00200","kind":"word","word":"denotation","meaning":"vs connotation","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00201","kind":"word","word":"deprive","meaning":"to take something, especially something necessary or pleasant, away from someone:","examples":["He claimed that he had been deprived of his freedom/rights.","You can't function properly when you're deprived of sleep.","Sleep deprivation is one of the main causes that make people evade military service."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00202","kind":"word","word":"dereliction","meaning":"(especially of a building) a state of not being cared for:","examples":["The old railway station was in a state of dereliction.","Some parts of the palace have been rescued from dereliction.","For the next 16 years the building and its contents fell into dereliction."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00203","kind":"word","word":"detergent","meaning":"a chemical substance in the form of a powder or a liquid for removing dirt from clothes, dishes, etc.","examples":["It occurs in body wastes, in artificial fertilizers, as a by-product of natural decay, and very notably in detergents.","Borax is a mild alkaline body, and as a detergent is probably equivalent to a slight excess of caustic soda."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00204","kind":"word","word":"determined","meaning":"wanting to do something very much and not allowing anyone or any difficulties to stop you:","examples":["I'm determined to get this piece of work done today."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00205","kind":"word","word":"detractor","meaning":"someone who criticizes something or someone, often unfairly:","examples":["His detractors claim that his fierce temper makes him unsuitable for leadership.","Most of his detractors are not interested in his personal life; they only criticize his academic achievements."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00206","kind":"word","word":"devote","meaning":"to give all of something, especially your time, effort, or love, or yourself, to something you believe in or to a person:","examples":["He left the Senate to devote more time to his family.","She has devoted herself to getting justice for her son."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00207","kind":"word","word":"diagonal","meaning":"A diagonal can be either an adjective or a noun, primarily referring to a line, direction, or cut that is slanted or goes from one corner to the opposite corner, rather than being horizontal or vertical.","examples":["\"The path cut diagonally across the field.\" (describes the direction of the cut)","The square has two diagonals that intersect in the middle.\"","\"He measured the diagonal of the television screen.\" (meaning the length from one corner to the opposite)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00208","kind":"word","word":"diameter","meaning":"A diameter (noun) is a straight line passing from side to side through the center of a circle or sphere (or other circular object). It's also the length of this line.","examples":["\"The diameter of the Earth at the equator is about 12,756 kilometers.\"","\"Measure the diameter of the pipe before you buy the fittings.\"","\"In a geometric proof, you often need to draw the diameter of a circle.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00209","kind":"word","word":"dictate","meaning":"to give orders, or tell someone exactly what they must do, with total authority:","examples":["The UN will dictate the terms of troop withdrawal from the region.","The rules dictate that only running shoes must be worn on the track.","I wanted to take a year off, but my financial situation dictated that I got a job."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00210","kind":"word","word":"diffuse","meaning":"To diffuse means to spread or cause to spread over a wide area or among a large number of people. It implies a spreading out from a central point, often in a scattered or less concentrated manner.","examples":["\"The artist used diffuse lighting to create a soft effect.\" (Spread out, not harsh)","\"His argument was too diffuse and lacked a clear central point.\" (Wordy, rambling, not concise)","\"The essay was criticized for its diffuse style.\"","\"The light was diffused by the sheer curtains, creating a soft glow.\" (Spread out and softened)","\"The pleasant aroma of baking bread diffused throughout the house.\" (Spread slowly through the air)","\"His calm demeanor helped to diffuse the tension in the room.\" (To lessen or spread out the intensity of an emotion or situation)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00211","kind":"word","word":"diligent","meaning":"Diligent (adjective) means showing care and effort in one's work or duties.","examples":["She is a diligent researcher who double-checks all her data.","He was diligent in completing his assignments on time.","He worked diligently to complete his project on time."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00212","kind":"word","word":"diminish","meaning":"to reduce or be reduced in size, importance, or value","examples":["Religion remained a significant determinant of intended family size but its effect had diminished.","If consumers start losing confidence, it will diminish demand for household goods.","Over a period of several years, these securities diminished in value and the corporation went bankrupt."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00213","kind":"word","word":"discard","meaning":"To discard means to get rid of something because it is no longer useful or wanted. It implies an act of throwing away, abandoning, or rejecting something as superfluous or undesirable.","examples":["Please discard your empty coffee cup in the recycling bin.","They decided to discard their original plan and start fresh with a new strategy.","Some companies are known to discard older employees in favor of cheaper, younger talent."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00214","kind":"word","word":"discrete","meaning":"Discrete is an adjective that describes things that are individually separate, completely distinct, and unconnected. If something is discrete, it can be broken down into individual, countable blocks rather than flowing as a smooth, unbroken stream.\n\nThe word comes from the Latin discretus, meaning \"separated,\" which is the past participle of discernere (to distinguish or separate).\n\nImportant Homophone Alert: People frequently confuse discrete (separate) with discreet (careful, silent, or maintaining privacy). If you are keeping a secret, you are being discreet. If a puzzle has 500 individual pieces, it is made of discrete parts.","examples":["A. Mathematics and Computer Science\nIn math and data science, \"discrete\" refers to variables that can only take on specific, distinct values (like integers) rather than any value within a range. You can count discrete data, but you cannot measure it with infinite precision.\n\nExample: \"The number of students in a classroom is a discrete variable; you cannot have half of a student.\"\n\nExample: \"He specializes in discrete mathematics, studying network graphs and logic rather than calculus.\"","B. General and Everyday Use\nIn daily life, it refers to breaking a large concept, project, or object into completely separate, independent units.\n\nExample: \"The training program is divided into five discrete modules that must be completed in order.\"\n\nExample: \"Instead of one massive payment, the loan was paid off in several discrete installments.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00215","kind":"word","word":"disgrace","meaning":"embarrassment and the loss of other people's respect, or behaviour that causes this:","examples":["He brought disgrace on the whole team by falsifying the results.","I believe that an industry that acts in this way disgraces itself.","What he did was outrageous. He's a disgrace to the medical profession."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00216","kind":"word","word":"disingenuous","meaning":"Disingenuous (adjective) describes someone who is not sincere and is pretending to be honest or naive. It implies that a person is acting in a calculated, deceitful, or insincere way to mislead someone.","examples":["The politician's apology was seen as disingenuous because he continued to defend the policy he was apologizing for.","We could instantly notice he was disingenuous."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00217","kind":"word","word":"dismay","meaning":"Dismay is a word that functions as both a noun and a verb. It describes a sudden, overwhelming feeling of disappointment, shock, or loss of courage, typically caused by something highly unexpected and negative.\n\nThe word originates from the Old French desmaier, which roughly translates to \"to deprive of power or ability.\" When you are struck with dismay, the surprise and disappointment physically drain your energy and resolve.","examples":["A. Sudden Disappointment or Shock (Noun)\nThis is the most common use. It describes the sinking feeling in your stomach when a situation suddenly goes wrong or a harsh truth is revealed. It is frequently used in the phrase \"to someone's dismay.\"\n\nExample: \"To the manager's utter dismay, the team missed the critical deadline by a full week.\"\n\nExample: \"She stared in dismay at the massive dent in the door of her brand-new car.\"","B. To Discourage or Dishearten (Verb)\nWhen used as a verb, it means an event or a piece of information actively causes someone to lose their courage or motivation.\n\nExample: \"The sheer volume of the required reading for the course dismayed the incoming freshmen.\"\n\nExample: \"Do not let one small failure dismay you; the project is still entirely salvageable.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00218","kind":"word","word":"displacement","meaning":"Displacement is a noun that literally means moving something (or someone) out of its original, proper, or regular position.\n\nThe word is built from the prefix dis- (away or apart) and placement. Because it describes the act of shifting things around, it has highly specific meanings across several different fields, from physics to psychology.","examples":["A. Physics and Mathematics (Vector Quantity)\nIn physics, displacement is the shortest straight-line distance from an object's initial position to its final position, along with the direction of that line. It only cares about where you started and where you ended up, not the path you took to get there.\n\nExample: \"Even though the runner completed a 400-meter lap around the track, her net displacement was exactly zero because she ended up right where she started.\"\n\nExample: \"The sensor measures the precise displacement of the bridge's suspension cables during high winds.\"","B. Society, Economics, and Environment\nIn everyday news, it refers to people or things being forced out of their usual places. This could be refugees fleeing a war zone (displaced persons) or human workers losing jobs to new technology.\n\nExample: \"The introduction of the new automated assembly line caused widespread job displacement in the factory.\"\n\nExample: \"Rising sea levels are expected to cause the displacement of millions of coastal residents over the next century.\"","C. Psychology\nIn Freudian psychology, displacement is a defense mechanism where a person redirects a negative emotion from its original, dangerous source to a safer, substitute target.\n\nExample: \"Yelling at your roommate because you are actually angry at your boss is a classic example of emotional displacement.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00219","kind":"word","word":"dissident","meaning":"Dissident (pronounced DISS-ih-dent) is most commonly used as a noun to describe a person who actively challenges and opposes established official policy, rules, or laws, particularly those of an authoritarian government. It can also be used as an adjective (e.g., \"a dissident group\").\n\nThe word comes from the Latin dissidere, which literally translates to \"to sit apart\" (dis- meaning apart, and sedere meaning to sit). A dissident is someone who refuses to sit with the majority.","examples":["A. Politics and Government (Primary Usage)\nThis is the most frequent use of the word. It usually carries a tone of bravery or moral conviction, describing someone fighting against an oppressive regime, often at great personal risk.\n\nExample: \"The political dissident was exiled from the country for publishing articles that criticized the dictator.\"\n\nExample: \"Amnesty International fought for the release of several dissidents who had been jailed for peaceful protests.\"","B. Institutional and Organizational\nBeyond governments, it can describe someone who goes against the established norms or leadership of a corporation, a religious institution, or a scientific community.\n\nExample: \"A dissident faction within the board of directors attempted to vote out the CEO.\"\n\nExample: \"He was considered a dissident among physicists because he entirely rejected the standard model of quantum mechanics.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00220","kind":"word","word":"distinctive","meaning":"Something that is distinctive is easy to recognize because it is different from other things:","examples":["A distinctive feature of qualitative methods is the flexibility of research designs, particularly where ethnographic methods using a range of techniques are involved.","The qualitative character of men and women's friendships was often distinctive, although mediated by social class and area differences.","Specifically, measurement studies highlight the distinctive nature of impulsive aggression."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00221","kind":"word","word":"diversion","meaning":"the fact of something being sent somewhere different from where it was originally intended to go:","examples":["the diversion of money to other projects","Shoplifters often work in pairs, with one creating a diversion to distract the staff while the other steals the goods."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00222","kind":"word","word":"divert","meaning":"to cause something or someone to change direction:","examples":["Traffic will be diverted through the side streets while the main road is resurfaced.","Our flight had to be diverted to Newark because of the storm."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00223","kind":"word","word":"dogma","meaning":"Dogma (noun) refers to a set of principles, beliefs, or tenets established by a religion, philosophy, or other authoritative group that are considered unquestionably true. It implies a belief or system of beliefs that is held as authoritative and not open to dispute.","examples":["\"The company's long-held dogma that 'the customer is always right' was challenged by new research.\"","\"The central dogma of the faith is the belief in one God.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00224","kind":"word","word":"dormant","meaning":"(of an animal) having normal physical functions suspended or slowed down for a period of time; in or as if in a deep sleep.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00225","kind":"word","word":"downside","meaning":"he negative part of a situation:","examples":["It’s a great plan – the downside is that it’s going to cost a lot of money.","Unemployment, inflation, and greater inequality are often the downside of a market economy.","The new version has many great features, but there are downsides."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00226","kind":"word","word":"draft","meaning":"A Current of Air: A draft is a current of cool air, especially one that moves into a closed space.\n\nExample: \"I closed the window to stop the draft.\"","examples":["Compulsory Enlistment: In the military, a draft is a system of compulsory recruitment for military service.\n\nExample: \"The government announced a military draft during the war.\"","A Financial Order: A draft is a written order to pay a specified amount of money to a named person or institution; a check.\n\nExample: \"She received a bank draft for the house payment.\"","A Selection of Players: In sports, a draft is a system for selecting new players from a pool of eligible candidates.\n\nExample: \"He was the first pick in the NBA draft.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00227","kind":"word","word":"drawback","meaning":"a disadvantage or problem; the negative part of a situation:","examples":["A drawback for some savers is that the bond has a minimum investment of £10,000.","Every strategic choice has its benefits and drawbacks.","The design of the computer has one big drawback: a noisy built-in fan."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00228","kind":"word","word":"DUI","meaning":"Driving Under Influence","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00229","kind":"word","word":"duly","meaning":"\"Duly\" is an adverb that means in accordance with what is required or appropriate; properly; at the correct time; or as expected. It emphasizes that an action or event is carried out correctly, respectfully, or according to established procedure or schedule.","examples":["\"After a thorough investigation, the suspect was duly arrested.\"","\"The manager duly thanked all the volunteers for their hard work.\"","\"The new regulations were duly implemented across all departments.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00230","kind":"word","word":"eagerness","meaning":"Eagerness (noun) refers to keenness, enthusiasm, or a strong desire to do or have something. It describes a state of excited anticipation and willingness.","examples":["\"His eagerness to learn new skills impressed his supervisor.\"","\"The children showed great eagerness to open their presents.\"","\"She expressed her eagerness to start the new project.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00231","kind":"word","word":"earnest","meaning":"Earnest is an adjective used to describe someone who is sincere, intense, and serious in their intentions or convictions. If you are doing something in an earnest way, you aren't joking around or being \"cool\" and detached; you genuinely mean what you are saying or doing.","examples":["\"The work began in earnest once the funding was approved.\" (The work didn't just start; it started with full focus and energy.)","The young activist spoke with such earnest conviction that the entire room went silent.","The soldier approached the wounded man in the most earnest manner."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00232","kind":"word","word":"enamor","meaning":"to cause someone to like or love something or someone:","examples":["The tail fins and rocket details of 1950s cars were an impression of the technology that enamored that decade.","Persephone was the Greek goddess who enamored Hades, the king of the underworld.","His bad temper did not enamor [=endear] himto his employees. [=his bad temper made hisemployees dislike him]"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00233","kind":"word","word":"encompass","meaning":"to include different types of things:","examples":["It encompasses the whole learning process, including learning styles and strategies.","The plan encompasses repaving the street and planting 40 new trees.","The festival is to encompass everything from music, theatre, and ballet to literature, cinema, and the visual arts."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00234","kind":"word","word":"encounter","meaning":"\"Encounter\" can be used as both a verb and a noun, generally referring to meeting something or someone, often unexpectedly, or facing a particular situation, especially a challenging one.","examples":["\"I encountered an old friend while shopping downtown today.\"","\"The project encountered several unexpected delays.\"","\"Our encounter at the coffee shop was brief but pleasant.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00235","kind":"word","word":"endeavor","meaning":"to try very hard to do something:","examples":["I endeavoured to help her, but she wouldn't let me."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00236","kind":"word","word":"endonym","meaning":"An endonym (pronounced EN-doh-nim) is the name used by a group of people for themselves, their language, or their geographic place, as opposed to a name given by outsiders. It's the \"inside\" name. (Antonym: exonym)","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00237","kind":"word","word":"enquiry","meaning":"→  inquiry","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00238","kind":"word","word":"ensnare","meaning":"To ensnare means to catch or trap someone or something in a snare or a difficult situation. It implies a cunning or deceptive method of trapping, making escape difficult.","examples":["\"The hunter used a small wire to ensnare the rabbit.\"","\"He used false promises to ensnare the investors in a fraudulent scheme.\"","\"She felt ensnared by the web of lies she had told.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00239","kind":"word","word":"ensue","meaning":"To ensue is a verb that means to happen afterward or as a result of a previous event. It implies a logical or chronological sequence—first one thing happens, and then another thing follows it.\n\nIt is often used to describe a situation that develops naturally (and sometimes uncontrollably) from a specific starting point.","examples":["\"When the power went out in the stadium, total chaos ensued.\"","\"In the years that ensued, the small village grew into a bustling city.\"","\"A heated argument ensued after the referee made a controversial call.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00240","kind":"word","word":"ephemeral","meaning":"Ephemeral (adjective) means lasting for a very short time. It describes something that is fleeting, transient, or temporary. It suggests that something exists or is enjoyed only for a brief period before fading away or ceasing to exist.","examples":["\"Fashion trends are often ephemeral; what's popular today might be outdated tomorrow.\"","\"His fame was ephemeral, fading quickly after his initial success.\"","\"We paused to admire the ephemeral beauty of the dew on the spiderweb.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00241","kind":"word","word":"epigenetics","meaning":"Epigenetics is a fascinating field of study that explores how your behaviors and environment can cause changes that affect the way your genes work without altering the underlying DNA sequence itself. The \"epi-\" prefix is Greek for \"on, above, or outside of,\" which aptly describes how these changes function as a layer of control \"on top of\" your genetic code.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00242","kind":"word","word":"erode","meaning":"to slowly reduce or destroy something, or to be slowly reduced or destroyed:","examples":["Wind and rain have eroded the statues into shapeless lumps of stone.","Sudden movements in exchange and interest rates can erode profit margins.","The retail industry is struggling with eroding consumer confidence and a weakening sales trend."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00243","kind":"word","word":"et al","meaning":"\"Et al.\" is a Latin abbreviation that stands for \"et alii,\" meaning \"and others.\"\n\nIt is commonly used in academic writing, citations, and legal documents to save space and avoid listing every single name when there are many authors, people, or things involved.","examples":["\"The research conducted by Smith et al. (2023) demonstrated significant findings.\" (Meaning, Smith and other authors.)","\"The lawsuit named Johnson et al. as defendants.\" (Meaning, Johnson and other defendants.)","\"Further studies by Chen et al. explored the long-term effects of the treatment.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00244","kind":"word","word":"ethereal","meaning":"Ethereal (adjective) describes something that is extremely delicate and light in a way that seems not to be of the real, physical world; heavenly or spiritual. It also carries connotations of being airy, intangible, and highly refined.\n\nThe word comes from the ancient Greek concept of \"ether,\" believed to be a pure, subtle substance that filled the heavens, distinct from the denser elements of earth, air, fire, and water.","examples":["\"The ballerina's movements were so graceful and ethereal that she seemed to float across the stage.\" (Delicate, otherworldly grace)","\"She had an ethereal beauty, with pale skin and large, luminous eyes.\" (Delicate, almost not real beauty)","\"Philosophers often delve into ethereal concepts that are hard to grasp in concrete terms.\" (Abstract, unworldly ideas)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00245","kind":"word","word":"eugenics","meaning":"Eugenics is a noun that refers to the historically discredited and morally abhorrent practice or belief of attempting to improve the genetic quality of the human population. It typically involved encouraging the reproduction of people with traits deemed \"desirable\" (positive eugenics) and forcefully preventing the reproduction of people with traits deemed \"undesirable\" (negative eugenics).\n\nThe word was coined in 1883 by the British scientist Francis Galton. It is derived from the Greek roots eu- (meaning \"good\" or \"well\") and genos (meaning \"birth\" or \"race\").","examples":["A. Historical Atrocities and Human Rights\nIn a historical context, eugenics is synonymous with some of the worst atrocities of the 20th century. It was adopted as state policy in many countries, leading to the forced sterilization of hundreds of thousands of individuals—often the poor, minorities, or the mentally ill.\n\nExample: \"The horrific policies of Nazi Germany were heavily based on the pseudo-scientific principles of eugenics.\"\n\nExample: \"Many early 20th-century laws allowed the state to institutionalize and sterilize citizens under the banner of public eugenics.\"","B. Modern Bioethics and Genetic Engineering\nToday, the word is most frequently used in ethical debates as a severe warning. As modern medicine develops powerful tools to edit human DNA (like CRISPR) and screen embryos for diseases, critics often use the term to warn against repeating the mistakes of the past.\n\nExample: \"Ethicists argue that allowing parents to select the eye color or height of their children inches dangerously close to a modern form of eugenics.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00246","kind":"word","word":"euthanize","meaning":"To euthanize (pronounced YOO-thuh-nize) means to kill an animal (or, in very specific and legally defined circumstances, a person) painlessly, especially to relieve suffering from an incurable illness or severe injury. It's typically done out of mercy to prevent further prolonged pain or a poor quality of life.","examples":["\"The family made the heartbreaking decision to euthanize their beloved dog after it was diagnosed with an aggressive, untreatable cancer.\"","\"The veterinarian had to euthanize the injured deer that had been hit by a car, as its injuries were too severe to treat.\"","\"In countries where it is legal, some terminally ill patients may choose to be euthanized to end their unbearable suffering.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00247","kind":"word","word":"ever-present","meaning":"used to describe something that is always there:","examples":["the ever-present danger of a terrorist attack"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00248","kind":"word","word":"exact","meaning":"verb","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00249","kind":"word","word":"exacta","meaning":"In English, an exacta (pronounced uhg-ZAK-tuh or ig-ZAK-tuh) is a term used primarily in horse racing (and sometimes dog racing or jai alai).\n\nIt refers to a type of wager (bet) where the bettor must correctly predict the first two finishers of a race in their exact order of finish.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00250","kind":"word","word":"exert","meaning":"to use something such as authority, power, influence, etc. in order to make something happen:","examples":["I believe that this exerted a decisive influence on our language habits.","Some managers exert considerable pressure on their staff to work extra hours without being paid.","The salts are exerted from the 'cultivator' at a rate proportional to their concentration."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00251","kind":"word","word":"exhibitionism","meaning":"A mental condition characterized by a recurrent urge or fantasy to expose one's genitals to an unsuspecting stranger, for the purpose of sexual arousal or gratification.","examples":["\"The psychiatrist diagnosed the patient with exhibitionism due to his compulsive need to expose himself in public.\"","Extravagant or attention-seeking behavior, especially in public, intended to attract notice or admiration. It's about a tendency to show off or to behave in a way that draws attention to oneself. This usage does not necessarily imply sexual exposure.","\"His flamboyant clothing and loud declarations were pure exhibitionism.\"\n\"The politician's grand gestures were criticized as mere exhibitionism, lacking real substance.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00252","kind":"word","word":"expedite","meaning":"to make something happen more quickly:","examples":["Since many of the expatriates had little background in economics, the similarities in mathematics initially served to expedite their migrations into the field","A convenience sample was used to expedite collection of data.","We do believe, however, that the visualizations greatly expedite the task of domain definition."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00253","kind":"word","word":"expense","meaning":"A. Financial Cost (Literal)\nThis is the everyday use of the word. It describes the money you must pay to acquire goods, use services, or run a business.\n\nExample: \"We need to reduce our monthly travel expenses if we want to save up for a new car.\"\n\nExample: \"The company will reimburse you for any out-of-pocket expenses you incur during the business trip.\"","examples":["B. Sacrifice or Harm (Figurative)\nIn a figurative sense, the phrase \"at the expense of\" means achieving a goal but causing harm, loss, or disadvantage to something or someone else in the process. The \"cost\" here is not money, but well-being or integrity.\n\nExample: \"He finally got the promotion he wanted, but it came at the expense of his physical health.\"\n\nExample: \"You should never make a joke at the expense of someone else's feelings.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00254","kind":"word","word":"explicate","meaning":"To explicate is a formal verb that means to analyze and explain something in great detail. It is more than just \"explaining\"; it involves a thorough, step-by-step breakdown of a complex idea, a piece of literature, or a difficult theory to make its meaning completely clear.","examples":["When you explicate a poem or a passage of text, you examine the metaphors, the word choice (diction), and the structure to reveal deeper meanings.\n\nExample: \"The professor asked the students to explicate the first stanza of the poem to uncover its hidden political themes.\"","It is used when a theory or a set of rules is dense and needs to be \"unfolded\" for an audience.\n\nExample: \"In his latest paper, the scientist attempts to explicate the relationship between quantum mechanics and general relativity.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00255","kind":"word","word":"expound","meaning":"To expound means to present and explain (a theory or idea) in detail. It's about giving a thorough, comprehensive, and often systematic explanation of a subject.","examples":["\"The CEO expounded his strategy to increase the company's market value.\"","After being interrupted by a student, the professor continued expounding on his theory."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00256","kind":"word","word":"extenuate","meaning":"to cause a wrong act to be judged less seriously by giving reasons for it:","examples":["He was unable to say anything that might have extenuated his behaviour.","To an extent this may be true, but it is really a rather extenuated argument based on various possible contingent sets of events."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00257","kind":"word","word":"extravagant","meaning":"spending too much money, or using too much of something:","examples":["Severe cuts in public spending mean that demands for extravagant pay rises are no longer realistic.","The familiar failures of leadership and ex
