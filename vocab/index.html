amples of extravagant demagoguery are paraded."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00258","kind":"word","word":"faggy","meaning":"\"Faggy\" is a derogatory and offensive slur used to refer to a gay man. It is a shortened and often more aggressive form of the word \"faggot.\" Both terms are deeply rooted in homophobia and have been used for decades to demean, insult, and attack gay men.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00259","kind":"word","word":"falter","meaning":"To falter means to lose strength or momentum; to stumble or hesitate. It suggests a wavering or weakening, either physically, mentally, or in performance","examples":["\"His voice faltered as he tried to explain what happened.\"","\"His courage never faltered even in the face of danger.\"","\"After a strong start, the team's performance began to falter in the second half.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00260","kind":"word","word":"farcical","meaning":"Farcical (pronounced FAR-sih-kull) is an adjective used to describe a situation, event, or plan that is so completely absurd, disorganized, or ridiculous that it becomes comical.\n\nIt comes from the noun \"farce,\" which is a type of exaggerated comedy based on highly unlikely and ridiculous situations (like people constantly walking in and out of the wrong doors at the wrong time).","examples":["This is the most common way the word is used in daily life. It describes a real-world situation—often a serious one, like a meeting, a trial, or a project—that has gone completely off the rails and lost all credibility.\n\nExample: \"The city council meeting turned into a farcical shouting match over who took the last donut.\"\n\nExample: \"Trying to run a marathon in a giant inflatable dinosaur costume is a beautifully farcical idea.\"","In reviews of books, movies, or plays, it describes a plot or character that is intentionally exaggerated for comedic effect.\n\nExample: \"The movie is a farcical look at the fashion industry, full of bizarre outfits and cartoonish villains.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00261","kind":"word","word":"fare","meaning":"This is the most common everyday usage. It refers to the money a passenger must pay to use public transportation (like a bus, train, taxi, or airplane).\n\nThe train fare to the city center has increased again this year.","examples":["In a culinary or descriptive context, \"fare\" refers to a specific range or type of food, usually associated with a particular place, event, or culture.\n\nWe were expecting a gourmet meal, but they only served standard pub fare."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00262","kind":"word","word":"fathom","meaning":"To fathom means to understand a difficult or complex problem or person after much thought. It can also mean to measure the depth of water.","examples":["\"He couldn't fathom why she would make such a strange decision.\"","\"I can't even begin to fathom the magnitude of the universe.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00263","kind":"word","word":"fatigue","meaning":"weakness in something, such as a metal part or structure, often caused by repeated bending:","examples":["The crash was caused by metal fatigue in one of the propeller blades.","The doctor said he was suffering from fatigue and work-related stress.","Structural equation twin modeling was used to estimate the latent genetic architecture of varying definitions of fatiguing illness."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00264","kind":"word","word":"favorable","meaning":"positive or pleasing:","examples":["The movie received generally favorable reviews.","Consumers responded favorably to the new product.","The rich diversity and the production environment and methods are favorable for organic rice production."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00265","kind":"word","word":"feeble","meaning":"\"Feeble\" means weak, lacking strength, or ineffective. It can refer to physical weakness, but it can also describe ideas, arguments, or efforts that are lacking in vigor or effectiveness.","examples":["The feeble man struggled to lift the box.","Her feeble attempt to persuade them was met with indifference."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00266","kind":"word","word":"femur","meaning":"A femur is the thigh bone, which is the longest and strongest bone in the human body.","examples":["\"He broke his femur in a skiing accident and required extensive surgery.\"","\"The paleontologist identified the large bone as the femur of a prehistoric dinosaur.\"","\"The femur plays a crucial role in walking, running, and jumping.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00267","kind":"word","word":"fend","meaning":"to take care of and provide for yourself without depending on anyone else","examples":["The corporation will no longer receive a government subsidy, and must fend for itself financially."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00268","kind":"word","word":"festoon","meaning":"To festoon (pronounced feh-STOON) can be used as both a noun and a verb.\n\nAs a noun, it refers to a decorative chain or garland of flowers, leaves, ribbons, or lights hung in a downward curve. As a verb, it means to adorn or decorate a place with these draped, hanging chains.\n\nThe word paints a very specific visual picture of celebratory, looping decorations.","examples":["The wedding planners decided to festoon the reception hall with thousands of fairy lights.","A beautiful festoon of pine branches and red ribbons hung over the fireplace."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00269","kind":"word","word":"feud","meaning":"A feud (noun) is a prolonged, bitter quarrel or dispute. It often refers to a state of hostility between two families, clans, or individuals that can last for years or even generations.","examples":["\"The two families had been locked in a feud for decades over a property dispute.\"","\"The political feud between the two leaders dominated the news cycle.\"","\"The film tells the story of a bloody feud between rival gangs.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00270","kind":"word","word":"fixate","meaning":"To fixate means to focus one's eyes or attention intently and unmovingly on something. It implies an unusually strong or obsessive concentration on a particular object, idea, or person, sometimes to the exclusion of other things.","examples":["\"His eyes fixated on the distant ship as it approached the harbor.\"","\"He tends to fixate on minor mistakes, unable to move past them.\"","\"The dye was chemically treated to fixate the color to the fabric.\" (To make it permanent)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00271","kind":"word","word":"flabbergast","meaning":"to shock someone, usually by telling that person something they were not expecting:","examples":["He was flabbergasted when we told him how cheap it was.","It is quite flabbergasting the amount of racism there is within the media still"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00272","kind":"word","word":"foe","meaning":"an enemy","examples":["The two countries have united against their common foe.","He was still uncertain whether the soldiers were friend or foe as they led him to a hilltop village."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00273","kind":"word","word":"folly","meaning":"the fact of being stupid, or a stupid action, idea, etc.:","examples":["It would be folly to attempt a trip in this snowstorm.","It would be folly for the country to become involved in the war."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00274","kind":"word","word":"fondest","meaning":"It means most cherished, most beloved, most affectionate, or most dearly held.","examples":["\"My fondest wish is to travel the world someday.\"","\"She shared her fondest memories of her late husband with her grandchildren.\"","\"Of all the gifts I received, the handmade card from my daughter is my fondest.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00275","kind":"word","word":"food regulatory body","meaning":"A food regulatory body is essentially a government agency or public organization responsible for ensuring the safety and quality of the food supply. Their main job is to protect public health by making and enforcing rules about how food is produced, processed, labeled, and sold.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00276","kind":"word","word":"footage","meaning":"Footage refers to a section of film or video recording. It's the raw, unedited, or edited visual content captured by a camera. Think of it as the visual material itself, regardless of whether it's from a movie, a news report, a home video, or surveillance.","examples":["\"The news report included dramatic footage of the storm hitting the coast.\"","\"Police are reviewing the security camera footage to identify the suspect.\"","\"He spent hours editing the raw footage from his trip into a short film.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00277","kind":"word","word":"for the record","meaning":"The phrase \"for the record\" is an idiom that means for the sake of official documentation, public knowledge, or clear and accurate understanding.\n\nIt's used when someone wants to make sure that a statement, fact, or opinion is formally noted, remembered, or understood without any ambiguity or future misinterpretation.","examples":["\"I'd like to say, for the record, that I object to this proposal.\"","\"The politician released a statement, for the record, denying all allegations.\"","\"For the record, the meeting was adjourned at 3:15 PM.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00278","kind":"word","word":"force majeure","meaning":"Force Majeure (pronounced force mah-ZHUR) is a French legal term that has been adopted into English contracts and law. It literally means \"superior force.\n\nMeaning:\nA force majeure clause in a contract refers to unforeseeable circumstances that prevent someone from fulfilling a contract. These events are typically beyond the control of either party and make performance of contractual obligations impossible or impracticable.","examples":["\"The company invoked the force majeure clause in its contract, citing the unprecedented flooding.\"","\"Due to the global pandemic, many businesses faced force majeure situations.\"","\"War is a classic example of a force majeure event.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00279","kind":"word","word":"forcibly","meaning":"in a way that happens or is done against someone's wishes, especially with the use of physical force:","examples":["Their parents are of the generation that was forcibly sent away to boarding schools.","The Ponca Indians were forcibly removed from their lands in 1877."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00280","kind":"word","word":"forefront","meaning":"the most important or leading position:","examples":["Anyone who wants to stay on the forefront of modern approaches to software construction should read this book.","Nutrition education, particularly young child nutrition, has been the first large-scale campaign and continues in the forefront of health education activities.","UK technology companies are only now coming to the forefront."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00281","kind":"word","word":"foreman","meaning":"A foreman (plural: foremen) is a person who is in charge of a group of workers, usually supervising them directly on a job or in a factory. They are typically skilled workers themselves who have been promoted to a supervisory role.","examples":["\"The construction foreman directed the crew on where to place the new beams.\"","\"She started as a factory worker and quickly rose to become a foreman on the assembly line.\"","\"The foreman is responsible for ensuring that all safety regulations are strictly adhered to on site.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00282","kind":"word","word":"foreplay","meaning":"Foreplay refers to sexual activity that precedes sexual intercourse.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00283","kind":"word","word":"foreseeable","meaning":"as far in the future as you can imagine:","examples":["Prices will remain high for the foreseeable future."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00284","kind":"word","word":"forgo","meaning":"To forgo means to decide not to have, do, or use something, often something desirable. It implies giving up or doing without something, usually by choice, for a specific reason or benefit.\nIt's about voluntarily abstaining from something you could have or do.","examples":["To save money for a down payment on a house, they forgo expensive vacations.","The company decided to forgo profits this quarter to invest heavily in new technology.","He had to forgo his usual morning coffee to make it to the early meeting on time."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00285","kind":"word","word":"formulation","meaning":"the action of developing all the details of a plan for doing something, or something that is developed in this way:","examples":["Both groups are involved in policy formulation.","Einstein's formulations about gravity and light","His main achievement was the formulation of compounds needed to sustain cells in test tubes."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00286","kind":"word","word":"forsaken","meaning":"A forsaken (adjective) person, place, or thing is abandoned or deserted. It often carries a strong connotation of being left alone, neglected, or rejected, often in a desolate or helpless state.","examples":["\"She felt utterly forsaken after her friends left without her.\"","\"He looked at the dusty, forsaken guitar in the corner of the room.\"","\"They found themselves in a forsaken corner of the desert, miles from any civilization.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00287","kind":"word","word":"foul","meaning":"The word \"foul\" is incredibly versatile and can be an adjective, noun, verb, or even an adverb, carrying various meanings depending on the context. Its core sense often relates to something unpleasant, offensive, or incorrect.","examples":["Extremely Unpleasant/Offensive to the Senses: \"He's been in a foul mood all day.\" \nVile, detestable, abominable, or wicked. \"It was a foul crime.\"","\"The ship's bottom was foul with barnacles.\" \"The rope fouled around the propeller.\"","\"The oil spill fouled the coastline.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00288","kind":"word","word":"frantic","meaning":"A frantic person or action is desperate or wild with excitement, fear, anxiety, or other strong emotion. It suggests a state of agitated, uncontrolled, and often hurried activity, usually driven by urgency or desperation.","examples":["\"The missing child's parents made a frantic appeal for information.\" (Desperate and urgent)","\"We made frantic efforts to put out the fire before it spread.\" (Wild, desperate, and hurried actions)","\"The last few days before the deadline were a frantic rush to finish everything.\" (Extremely busy and chaotic)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00289","kind":"word","word":"fume","meaning":"As a noun, fume (usually plural: fumes) refers to a gas, smoke, or vapor, especially if it's unpleasant, harmful, or strong-smelling.\nAs a verb, to fume means to feel, show, or express great anger, especially in a quiet, suppressed way. It implies simmering resentment or irritation, often expressed by visible signs like a red face or tense posture, rather than an outburst.","examples":["\"The exhaust fumes from the car were choking.\"","\"Be careful not to inhale the toxic fumes from the","\"The manager was fuming over the missed deadline.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00290","kind":"word","word":"funicular","meaning":"A funicular is a type of railway that ascends or descends a steep slope. It's often called a funicular railway or funicular.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00291","kind":"word","word":"G.I.","meaning":"Government Issue","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00292","kind":"word","word":"gait","meaning":"A gait (noun) refers to a person's or animal's manner of walking. It describes the particular way someone or something moves their legs and body when walking or running.\n\nIt can also refer to any of the ways in which a horse or other animal can move, such as a trot, canter, or gallop.","examples":["\"The old man's gait was slow and shuffling due to his arthritis.\"","\"She recognized him from a distance by his distinctive, confident gait.\"","\"The horse's elegant gait made it a favorite in equestrian competitions.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00293","kind":"word","word":"gallant","meaning":"Brave, courageous, or heroic; noble-minded. This is a very common and often admired use of the word. It implies facing danger or difficulty with spirit and honor.","examples":["The gallant soldiers defended their position against overwhelming odds.","She made a gallant effort to win the race, even though she was injured."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00294","kind":"word","word":"gargantuan","meaning":"very large:","examples":["a problem of gargantuan proportions"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00295","kind":"word","word":"geocentric","meaning":"geocentric means Earth-centered, a term most famously used to describe an old model of the universe.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00296","kind":"word","word":"gilded","meaning":"Covered thinly with gold or a gold-colored substance.\n\nThis is the literal meaning. It refers to something that has been coated with a thin layer of gold leaf, gold paint, or another material that resembles gold. The purpose is usually decorative, to make something appear more luxurious or valuable.","examples":["Having a specious or deceptively attractive appearance.\n\nThis is the very common figurative meaning. It suggests that something looks attractive or valuable on the surface, but may hide something less appealing, inferior, or even corrupt underneath. It implies superficiality or a false front. This meaning often comes with a negative connotation.\n\nThis meaning is famously captured in the phrase \"gild the lily\" (to adorn what is already beautiful, implying unnecessary or excessive ornamentation), and in the historical term \"Gilded Age\" (a period in U.S. history where rapid economic growth and prosperity hid underlying social problems and corruption).","\"The old picture frame was beautifully gilded with intricate patterns.\"\n\n\"The church altar was adorned with gilded statues.\"","\"The company presented a gilded image of success, but behind the scenes, they were facing serious financial troubles.\"\n\n\"His charming smile was just a gilded facade for his manipulative personality.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00297","kind":"word","word":"glaze","meaning":"If someone's eyes glaze or glaze over, they stop showing any interest or expression because they are bored or tired.","examples":["to cover the surface of objects made of clay with a liquid that makes them hard and shiny when they are baked","to put a liquid on food to make it shiny and more attractive"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00298","kind":"word","word":"grifter","meaning":"A grifter is a con artist; someone who obtains money or property dishonestly by tricking or swindling people.","examples":["\"He warned his elderly neighbor to be wary of online grifters who promise easy money.\"","\"The documentary exposed a network of political grifters who used donations for personal lavish spending.\"","\"The charming stranger turned out to be a grifter, convincing people to invest in a non-existent company.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00299","kind":"word","word":"guarantee","meaning":"a promise that something will be done or will happen, especially a written promise by a company to repair or change a product that develops a fault within a particular period of time:","examples":["The system costs £99.95 including shipping and handling and a twelve-month guarantee.","The TV comes with/has a two-year guarantee.","The United Nations has demanded a guarantee from the army that food convoys will not be attacked."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00300","kind":"word","word":"guest of honor","meaning":"A guest of honor is the most important or distinguished guest at a special event or gathering.\n\nThis person is typically the central focus of the occasion, and the event is often held specifically to celebrate, acknowledge, or welcome them.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00301","kind":"word","word":"hallmark","meaning":"More commonly today, a hallmark refers to a distinguishing characteristic, trait, or feature, especially one that is typical of a person or thing and often implies excellence or high quality.","examples":["\"Attention to detail is a hallmark of her craftsmanship.\"","\"Witty dialogue and complex plots are the hallmarks of his novels.\"","\"This type of behavior bears all the hallmarks of a desperate attempt.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00302","kind":"word","word":"haul off","meaning":"while \"haul off\" can refer to a physical preparation for a strike, it also commonly means to forcefully remove or transport something or someone, or, in a nautical sense, to move away from an object. The context will usually make the intended meaning clear.","examples":["\"He hauled off and hit the wall in frustration.\"","\"They had to haul off the broken machinery from the factory floor.\"","The captain ordered the helmsman to haul off from the rocky coastline.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00303","kind":"word","word":"heliocentric","meaning":"Heliocentric is an adjective used to describe a model or theory that places the Sun at the center of the solar system or the universe.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00304","kind":"word","word":"heuristics","meaning":"a way of solving problems by discovering things yourself and learning from your own experiences","examples":["Heuristics should rather be tested against the other forms of applied rationality, not against utopian scientific models.","Focusing on simple cognitive heuristics does not make the application of rational standards derived from formal calculi unnecessary.","Our method for distinguishing complements from adjuncts relies on heuristics that are based on local structural information."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00305","kind":"word","word":"high-maintenance","meaning":"High-maintenance is an adjective used to describe someone or something that requires a great deal of attention, care, time, or effort. It implies that a person or thing is difficult to manage or keep in good condition.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00306","kind":"word","word":"hold the distinction","meaning":"The phrase \"hold the distinction\" means to possess or be recognized for a particular special quality, honor, achievement, or characteristic that sets one apart from others. It implies having a unique or notable attribute.\n\nIt's often used when speaking about something that is unique, exceptional, or a source of pride.","examples":["\"The small town holds the distinction of being the oldest continuously inhabited settlement in the state.\" (It possesses that unique historical status.)","\"This particular species of bird holds the distinction of having the longest migratory path.\" (It possesses that unique biological characteristic.)","\"Our company proudly holds the distinction of being the first in the industry to achieve carbon neutrality.\" (We possess that notable achievement.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00307","kind":"word","word":"hone","meaning":"to make an object sharp:","examples":["Her debating skills were honed in the students' union.","His physique was honed to perfection."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00308","kind":"word","word":"horoscope","meaning":"An astrological forecast: This is the most common everyday usage. It's a prediction of events or advice about the future, usually based on the position of the stars and planets at the time of a person's birth (their zodiac sign). You often find daily horoscopes in newspapers, magazines, or online.","examples":["An astrological chart or diagram: In a more technical astrological sense, a horoscope is a diagram that shows the positions of the Sun, Moon, planets, and signs of the zodiac at a specific moment in time (e.g., the moment of a person's birth). Astrologers use this chart to analyze a person's character, personality traits, and to make predictions about their life.","\"I always read my daily horoscope to see if I'm going to have a lucky day.\"","\"According to her horoscope, she's a passionate and adventurous Sagittarius.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00309","kind":"word","word":"house","meaning":"to give a person or animal a place to live, or to provide space for something:","examples":["The base can house up to 2,000 soldiers.","The museum houses the biggest collection of antique toys in Europe.","It will be difficult to house all the refugees."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00310","kind":"word","word":"hygiene","meaning":"the degree to which people keep themselves or their environment clean, especially to prevent disease:","examples":["Poor standards of hygiene mean that the disease spreads fast.","health and hygiene regulations"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00311","kind":"word","word":"hypocrisy","meaning":"Hypocrisy (noun) is the practice of claiming to have moral standards or beliefs to which one's own behavior does not conform. It's about a contradiction between what a person says they believe and how they actually act.","examples":["\"It was pure hypocrisy for the politician to preach about family values while having an affair.\"","\"He was a hypocrite for criticizing my spending habits when he was in debt himself.\"","\"The company's claim of being environmentally friendly was seen as hypocrisy after it was found to be polluting a local river.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00312","kind":"word","word":"immunity","meaning":"legal","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00313","kind":"word","word":"impair","meaning":"Impair is a verb that means to weaken, damage, or make something worse. It usually refers to a loss of quality, strength, or functionality rather than complete physical destruction.\n\nThe word comes from the Old French empeirier, which traces back to the Late Latin word pejorare, literally meaning \"to make worse.\"","examples":["A. Medical and Physical Function\nThis is the most common everyday usage. It describes a reduction in a human faculty, such as vision, hearing, cognitive ability, or physical mobility.\n\nExample: \"A lack of sleep will severely impair your ability to concentrate on the exam.\"\n\nExample: \"Lifting weights with poor form can lead to joint injuries that permanently impair your range of motion.\"","B. Business and Finance\nIn accounting and investing, an \"impaired asset\" is a specific term for an asset—like a piece of real estate or an ETF holding—whose current market value has fallen below the value listed on the company's balance sheet.\n\nExample: \"The sudden market crash caused the bank to impair several of its long-term investments.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00314","kind":"word","word":"impartial","meaning":"not supporting any of the sides involved in an argument:","examples":["The jury has to give an impartial verdict after listening to all of the evidence.","Impartial observers are invited to make their own calculation of the evidence and credibility of all concerned."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00315","kind":"word","word":"impartiality","meaning":"Impartiality is the principle of being unbiased; the quality of not favoring one side over another. It means making decisions, judgments, or evaluations based on objective facts and fairness, rather than on personal feelings, beliefs, or prejudice.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00316","kind":"word","word":"impasse","meaning":"An impasse is a situation in which no progress is possible, especially because of disagreement; a deadlock.","examples":["The wage negotiations reached an impasse after three days of talks.","The committee reached an impasse on the proposed changes, with an even split in votes.","They found themselves at an impasse, unable to solve the complex engineering problem with their current resources."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00317","kind":"word","word":"impediment","meaning":"Impediment is a noun that means a hindrance or obstacle in doing something. It can refer to anything that slows progress, makes a task more difficult, or prevents something from being achieved.","examples":["He had a slight speech impediment that made it difficult for him to pronounce certain sounds.","The couple faced a legal impediment to their marriage due to their close familial relationship."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00318","kind":"word","word":"impetus","meaning":"Impetus refers to the force or energy with which a body moves, or, more commonly, the force that makes something happen or happen more quickly. It's about a driving force, stimulus, or a push.","examples":["\"The discovery of new evidence provided fresh impetus to the investigation.\" (It gave a new driving force.)","\"His passionate speech provided the impetus for the team to work harder.\" (It motivated them.)","\"The powerful engine gave the car tremendous impetus.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00319","kind":"word","word":"imposition","meaning":"Imposition has a few related meanings, generally revolving around the act of imposing something (a rule, tax, burden, belief, etc.) on others, or something that is imposed. It often carries a connotation of being unwelcome, unfair, or burdensome.","examples":["\"The new government announced the imposition of stricter environmental regulations.\"","\"I hope my request isn't too much of an imposition.\"","\"Critics argued against the imposition of Western cultural values on indigenous communities.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00320","kind":"word","word":"impute","meaning":"To impute means to attribute something (especially a fault or misconduct) to someone. It's about assigning responsibility or a characteristic to a person, often when there is some doubt or it's a matter of inference rather than direct proof.","examples":["\"The critics imputed political motives to the artist's work, even though he denied them.\" (Attributed motives by inference)","\"It is unfair to impute blame to him for a decision that was made by the whole committee.\" (Assign blame)","\"They tried to impute the failure of the project to a lack of effort on her part.\" (Assign the cause of failure)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00321","kind":"word","word":"in terms of","meaning":"used to describe which particular area of a subject you are discussing:","examples":["In financial terms, the project was not a success.","This was the biggest animal rights protest in the capital just in terms of sheer numbers.","In terms of quality, this is undoubtedly the better product."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00322","kind":"word","word":"incarceration","meaning":"Incarceration is a noun that refers to the state of being confined in a prison, or more broadly, the act of restricting someone's freedom of movement by trapping them in a specific space.\n\nThe word comes directly from the Latin incarcerare, which combines the prefix in- (into) with carcer (prison or enclosed space).","examples":["A. The Justice System (Literal)\nThis is the most common use of the word. It describes the formal, legal imprisonment of a person as a punishment for a crime or while awaiting trial.\n\nExample: \"The judge sentenced the defendant to ten years of incarceration in a federal facility.\"\n\nExample: \"The country is currently looking at ways to reduce its high rates of mass incarceration by focusing on rehabilitation.\"","B. Medicine and Anatomy\nIn a medical context, an \"incarcerated\" hernia occurs when a piece of tissue (like a loop of intestine) becomes severely trapped in a weakness in the abdominal wall and cannot easily be pushed back into place.\n\nExample: \"The patient required emergency surgery to relieve the incarceration of the bowel before the tissue lost its blood supply.\"","C. Metaphorical or Psychological\nIn everyday literature, it can vividly describe a feeling of being hopelessly trapped in a terrible situation, a dead-end job, or a restrictive environment, even if there are no physical bars.\n\nExample: \"After ten years in the windowless cubicle, the office job felt less like a career and more like an incarceration.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00323","kind":"word","word":"inception","meaning":"Inception refers to the establishment or beginning of an institution, activity, or idea. It marks the starting point, the creation, or the very first stage of something.","examples":["\"Since its inception in 2005, the company has grown exponentially.\"","\"The project has been plagued with problems from its inception.\"","\"We need to plan carefully, considering all possible challenges from the inception of the idea.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00324","kind":"word","word":"incline","meaning":"having natural artistic, technical, etc. ability:","examples":["She's very bright, but she's not academically inclined.","You will probably enjoy this book if you are at all mathematically inclined.","No one seemed inclined to help.","He was inclined to agree with them.","The prime minister is believed to be inclining towards an April election."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00325","kind":"word","word":"inclusion","meaning":"the idea that everyone should be able to use the same facilities, take part in the same activities, and enjoy the same experiences, including people who have a disability or other disadvantage:","examples":["The school has a strong culture of inclusion of students with special needs.","She is being considered for inclusion in the Olympic team.","The book's value stems from its inclusion of multiple viewpoints."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00326","kind":"word","word":"indefinitely","meaning":"\"Indefinitely\" means for an unlimited or unspecified period of time. It suggests that something will continue without a clear endpoint or that a duration is not defined.","examples":["\"The project has been postponed indefinitely.\" (There is no set date for when it will resume.)","\"She will be working from home indefinitely due to the circumstances.\" (There is no defined end date for her working from home.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00327","kind":"word","word":"indelible","meaning":"An indelible mark or memory is one that cannot be removed or forgotten. It describes something that is permanent, lasting, and impossible to erase or efface.","examples":["\"The marker left an indelible stain on the fabric.\" (Cannot be removed)","\"His kindness left an indelible impression on her heart.\" (Cannot be forgotten)","\"The experience of the war left an indelible scar on the nation's psyche.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00328","kind":"word","word":"indifference","meaning":"\"Indifference\" refers to a lack of interest, concern, or sympathy towards something or someone. It implies a state of being neutral or apathetic, where an individual does not show any strong feelings or reactions regarding a situation or issue.","examples":["Her indifference to the suffering of others was surprising.","The team's indifference towards the project led to its failure.","He shrugged his shoulders in indifference when asked about the outcome."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00329","kind":"word","word":"indignation","meaning":"Indignation is a feeling of righteous anger or annoyance provoked by what is perceived as unfair treatment, insult, or injustice. It's a reaction to something you feel is morally wrong or offensive.","examples":["\"The public expressed their indignation at the corrupt politician's light sentence.\"","\"He felt a sense of indignation when the new employee received a promotion that he had been working towards for years.\"","\"She spoke with indignation about the company's unfair labor practices.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00330","kind":"word","word":"indiscernible","meaning":"Indiscernible means impossible to see, hear, or perceive clearly; barely noticeable.\n\nIt's used when something is so subtle, faint, or unclear that it's very difficult or even impossible to distinguish or recognize.","examples":["\"The differences between the two fabric samples were almost indiscernible to the naked eye.\" (Meaning they looked almost exactly the same.)","\"A faint whisper, indiscernible in the noisy crowd, was all he heard.\" (Meaning it was too quiet to make out.)","\"His motives for the sudden change in plans remained indiscernible to his colleagues.\" (Meaning his reasons were unclear or hidden.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00331","kind":"word","word":"indoctrinate","meaning":"To indoctrinate means to teach a person or group to accept a set of beliefs uncritically and without question. It implies a deliberate and systematic process of instilling specific doctrines, ideas, or principles, often with the goal of suppressing independent thought and critical analysis.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00332","kind":"word","word":"inept","meaning":"Inept is an adjective that describes someone or something that completely lacks skill, ability, or competence. It refers to a profound clumsiness or a total unsuitability for a specific task.\n\nThe word comes directly from the Latin ineptus, which is a combination of the prefix in- (meaning \"not\") and aptus (meaning \"apt,\" \"fit,\" or \"suited\"). If you are inept, you are fundamentally \"not fit\" for the job.","examples":["A. Professional or Technical Incompetence\nThis is the most common use. It describes someone who is remarkably bad at their job or a specific physical task, often resulting in failure or a mess.\n\nExample: \"The inept contractor installed the plumbing backward, causing the entire first floor to flood.\"\n\nExample: \"Due to inept management, the highly profitable company went bankrupt within two years.\"","B. Social Clumsiness\nIt is also frequently used to describe someone who lacks social grace, tact, or the ability to read a room, resulting in highly awkward interactions.\n\nExample: \"His attempt at a romantic compliment was so socially inept that it ended up sounding like an insult.\"\n\nExample: \"She is a brilliant scientist in the lab, but entirely inept at making small talk at parties.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00333","kind":"word","word":"inert","meaning":"\"Inert\" describes something that is lacking the ability or strength to move, or chemically unreactive.","examples":["After the power outage, the machinery remained inert.","Helium and neon are inert gases, meaning they don't easily form compounds with other elements."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00334","kind":"word","word":"inevitability","meaning":"Inevitability is a noun that describes the quality of being absolutely certain to happen. It refers to a situation, event, or outcome that cannot be avoided, prevented, or escaped, no matter what actions are taken.\n\nThe word originates from the Latin inevitabilis, combining the prefix in- (not) with evitare (to avoid).","examples":["A. Narrative and Everyday Life\nIn storytelling and daily life, it describes the looming certainty of an event, such as aging, a consequence of a bad decision, or the end of a journey.\n\nExample: \"He finally accepted the inevitability of his retirement and began planning for the future.\"\n\nExample: \"There was a tragic inevitability to the fall of the empire due to its massive overexpansion and corruption.\"","B. Politics and Economics\nIn social sciences, people often debate whether certain historical events (like recessions, revolutions, or wars) possess inevitability, or if different policies could have changed the outcome.\n\nExample: \"Many economists argue against the inevitability of a market crash, suggesting that proper regulations can stabilize the system.\"\n\nExample: \"The general viewed the conflict not as a diplomatic failure, but as a geopolitical inevitability.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00335","kind":"word","word":"inexorably","meaning":"Inexorably (adverb) means in a way that is impossible to stop or prevent. It describes a process or force that is relentless, unyielding, and destined to continue or unfold regardless of attempts to halt or change it.","examples":["\"The ice caps are melting inexorably, altering global weather patterns.\" (The process cannot be stopped.)","\"Technology has inexorably changed the way we communicate.\" (The change was unavoidable and persistent.)","\"His health continued to decline inexorably despite all medical interventions.\" (His decline was relentless and could not be prevented.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00336","kind":"word","word":"ingratitude","meaning":"Ingratitude (noun) is the state of being ungrateful; a lack of gratitude or thankfulness. It refers to the failure to appreciate benefits or kindness received.","examples":["\"His ingratitude for all the help he received was truly shocking.\"","\"The story highlighted the profound ingratitude shown by the villain towards his benefactors.\"","\"She was hurt by his casual ingratitude after all the sacrifices she had made for him.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00337","kind":"word","word":"inquiry","meaning":"an official process to discover the facts about something bad that has happened:","examples":["The Council has set up an independent inquiry which will show the effect of closure of the plant.","Citizens have demanded a full inquiry into the government's handling of the epidemic."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00338","kind":"word","word":"integrate","meaning":"Noun form?","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00339","kind":"word","word":"integrity","meaning":"the quality of being honest and having strong moral principles:","examples":["A modern extension on the old building would ruin its architectural integrity.","They do not independently check the integrity of the data that companies send to them.","He was a man of the highest personal integrity.","No one doubted that the president was a man of the highest integrity.","He was a journalist of immense skill and integrity."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00340","kind":"word","word":"intensive","meaning":"Intensive is an adjective that means concentrated on a single area or subject, or using a large amount of effort or resources in a short time. It implies a high degree of focus, thoroughness, or force.","examples":["The government began intensive research into the recent incident.","Newborn babies need intensive care and attention."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00341","kind":"word","word":"intercede","meaning":"To intercede means to intervene on behalf of another person. It implies acting as a mediator or a go-between in a dispute or a difficult situation to try to bring about an agreement or reconciliation.","examples":["I had no choice but to intercede on behalf of my brother to settle the situation.","The hasty attempt at intercession has worsened the situation.","Efforts to intercede were all rendered moot as the terrorists were all eliminated by the SWAT team."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00342","kind":"word","word":"interdisciplinary","meaning":"involving two or more different subjects or areas of knowledge:","examples":["interdisciplinary courses","an interdisciplinary approach to the problem","The university is doing interdisciplinary research into the impact of cellphones on the brain and body."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00343","kind":"word","word":"intermediary","meaning":"a person or organization that makes business or financial arrangements between companies or organizations that do not deal with each other directly:","examples":["Insurance brokers act as intermediaries between companies that are seeking insurance and companies that provide such coverage.","The bank has three million customers and provides loans via intermediaries such as high street stores.","The former president has agreed to act as an intermediary between the government and the rebels."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00344","kind":"word","word":"Interpolation","meaning":"Interpolation is a noun that refers to the act of inserting something of a different nature into something else. In scientific and mathematical contexts, it specifically means estimating an unknown value that falls between two known values.\n\nThe word originates from the Latin interpolare, which means \"to alter, freshen up, or refurbish,\" combining the prefix inter- (between) with polire (to polish).","examples":["A. Mathematics, Science, and Data\nThis is the most common technical usage. When you have a set of known data points, interpolation is the mathematical method used to guess the data points that exist in the gaps between them.\n\nExample: \"Because we only recorded the temperature at noon and 2:00 PM, we had to use interpolation to estimate how hot it was at 1:00 PM.\"\n\nExample: \"The software uses frame interpolation to insert artificial frames into the video, making the slow-motion playback look completely smooth.\"","B. Literature and History\nIn textual analysis, interpolation refers to words or passages inserted into an original text or manuscript by someone other than the original author, often centuries later.\n\nExample: \"Historical scholars proved that the controversial paragraph was not written by the ancient philosopher, but was a later interpolation by a medieval translator.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00345","kind":"word","word":"intimidate","meaning":"To intimidate someone means to frighten or make them feel timid or fearful, often to influence their behavior or to make them do what you want (or not do what you don't want).","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00346","kind":"word","word":"intravenously","meaning":"Intravenously (adverb) means into a vein.\n\nIt describes a method of administering substances (like medication, fluids, blood, or nutrients) directly into a person's or animal's bloodstream via a vein. This is typically done using a needle and syringe or an intravenous (IV) drip.","examples":["\"The patient received antibiotics intravenously to combat the severe infection.\"","\"Fluids were administered intravenously to rehydrate the dehydrated child.\"","\"Some chemotherapy drugs are given intravenously over several hours.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00347","kind":"word","word":"intrinsic","meaning":"\"Intrinsic\" means belonging naturally; essential. It describes something that is an inherent, fundamental, and essential part of a person or thing, rather than being something that is acquired, external, or superficial. If something is intrinsic, it's \"built-in\" or \"comes from within.\"","examples":["\"The intrinsic value of a diamond is determined by its rarity and hardness, not just its market price.\" (Its natural, inherent worth)","\"One of the intrinsic challenges of space travel is dealing with zero gravity.\" (A fundamental, inherent difficulty)","\"He found intrinsic satisfaction in helping others, regardless of any reward.\" (Satisfaction that comes from within, not from external praise)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00348","kind":"word","word":"intuition","meaning":"(knowledge from) an ability to understand or know something immediately based on your feelings rather than facts:","examples":["Often there's no clear evidence one way or the other and you just have to base your judgment on intuition.","I can't explain how I knew - I just had an intuition that you'd been involved in an accident.","This intuition has sometimes been stated in previous studies."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00349","kind":"word","word":"irreverent","meaning":"Irreverent is an adjective used to describe a lack of proper respect for people, things, or ideas that are usually taken seriously.\nWhile \"disrespectful\" is often purely negative, irreverent can sometimes be a positive trait, especially in comedy or art. It suggests a \"playful\" or \"daring\" refusal to bow down to tradition, religion, or authority.","examples":["The movie offered an irreverent look at the lives of Greek gods, portraying them as grumpy neighbors.","The student’s irreverent attitude during the graduation ceremony earned him a stern look from the principal."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00350","kind":"word","word":"itinerant","meaning":"Itinerant (adjective or noun) describes someone or something that travels from place to place, especially for work.\n\nIt implies a migratory or nomadic lifestyle, often without a fixed home or permanent base.","examples":["\"The circus performers led an itinerant life, moving from town to town.\"","\"An itinerant preacher traveled the rural circuit, delivering sermons to various communities.\"","\"The old man was an itinerant, never staying in one town for more than a few days.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00351","kind":"word","word":"jargon","meaning":"special words and phrases that are used by particular groups of people, especially in their work:","examples":["Thankfully, the author has made sure that these items are free of technical jargon and complex numerical tables.","military/legal/computer jargon"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00352","kind":"word","word":"jeopardy","meaning":"Jeopardy means danger or risk, especially when something valuable is at stake. It can refer to physical danger, financial risk, or legal jeopardy.","examples":["His reckless behavior put his life in jeopardy.","The company's future is in jeopardy due to financial losses.","In law, double jeopardy refers to being prosecuted twice for the same crime."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00353","kind":"word","word":"jester","meaning":"A jester is a professional clown or comedian, historically employed by a monarch or nobleman to entertain them.","examples":["\"The king's jester was the only one allowed to openly mock him without fear of punishment.\"","\"He's always acting like a jester, trying to make everyone laugh even in serious moments.\"","\"The children were delighted by the street performer, who dressed like a medieval jester.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00354","kind":"word","word":"jurisdiction","meaning":"the authority of a court or official organization to make decisions and judgments :","examples":["An industrial tribunal claimed that it lacked jurisdiction to hear the appellant's complaint of unfair dismissal.","The United States Court of Appeals has exclusive jurisdiction over patent appeals.","For the rules as to jurisdiction in bankruptcy proceedings, including debtors' petitions, see Chapter 1."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00355","kind":"word","word":"keepsake","meaning":"A keepsake is a small item kept in memory of the person who gave it or the place where it was found. It's an object that serves as a reminder or memento of a person, event, or special time.","examples":["\"She kept the seashell as a keepsake of her first trip to the beach.\"","\"My grandmother gave me this locket as a keepsake before she passed away.\"","\"The old photographs served as precious keepsakes of their youth.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00356","kind":"word","word":"lapse","meaning":"to end legally or officially by not being continued or made effective for a longer period:","examples":["The association needs to win back former members who have allowed their subscriptions to lapse.","I must have let my subscription lapse, because I haven’t received any issues of the magazine in months."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00357","kind":"word","word":"lapsed","meaning":"no longer involved in an activity or organization:","examples":["a lapsed subscription","a lapsed Catholic","One suggestion is to revive lapsed tax breaks for businesses' research expenses."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00358","kind":"word","word":"lavatory","meaning":"A lavatory is a formal or polite term for a toilet or a room containing a toilet and a washbasin.","examples":["\"The flight attendant announced that the lavatories were located at the front and rear of the aircraft.\"","\"Excuse me, could you tell me where the nearest lavatory is?\"","\"The luxurious hotel room featured a spacious en-suite lavatory.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00359","kind":"word","word":"lavish","meaning":"spending, giving, or using more than is necessary or reasonable; more than enough:","examples":["The evening was a lavish affair with glorious food and an endless supply of champagne.","Being free from family responsibilities, he came to regard his flock as his children and lavished his love and care upon them instead."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00360","kind":"word","word":"law abiding citizen","meaning":"A law-abiding citizen is a person who obeys the law; someone who respects and adheres to the laws of their country or society. It emphasizes a person's conformity to legal rules and regulations, implying that they are a good, responsible member of society who follows the established legal framework.","examples":["\"The police chief assured the law-abiding citizens that their safety was his top priority.\"","\"As a law-abiding citizen, she always pays her taxes on time.\"","\"The government strives to protect the rights of all law-abiding citizens.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00361","kind":"word","word":"leisurely","meaning":"Leisurely (adjective/adverb) means slow, relaxed, and unhurried, often implying enjoyment without rushing.","examples":["We took a leisurely stroll through the park. (relaxed, unhurried)","He drank his coffee leisurely, enjoying the morning. (slowly, at a relaxed pace)","\"He seemed to be oddly leisurely even in the most perilous circumstances.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00362","kind":"word","word":"leprosy","meaning":"Leprosy, also known as Hansen's disease, is a chronic infectious disease caused by a slow-growing bacteria called Mycobacterium leprae. It's a curable disease that primarily affects the skin and peripheral nerves.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00363","kind":"word","word":"libido","meaning":"Libido (pronounced lih-BEE-doh) is a term that primarily refers to sexual drive or desire for sexual activity.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00364","kind":"word","word":"liken","meaning":"\"Likened\" means compared or described as being similar to something else. It is often used in the phrase \"likened to.\"","examples":["they likened the reigning emperor to a god","\"She likened his determination to that of a warrior.\" (She compared his determination to a warrior’s.)","\"The scientist likened the brain to a complex computer.\" (The scientist compared the brain to a computer.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00365","kind":"word","word":"linger","meaning":"Linger (verb) means to stay in a place longer than necessary, often due to reluctance to leave or a delay in action. It can also refer to remaining in a state or condition.","examples":["After the party ended, some guests chose to linger for a while to chat.","The scent of her perfume seemed to linger in the air long after she had left.","He couldn't help but linger on the memories of their time together."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00366","kind":"word","word":"living up to","meaning":"\"Living up to\" something means to fulfill expectations, standards, or promises; to be as good as something or someone is expected to be.","examples":["\"He found it hard living up to his parents' high expectations.\"","The new product is living up to the company's reputation for quality.","The sequel didn't quite live up to the brilliance of the original movie."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00367","kind":"word","word":"lodge","meaning":"to make an official complaint about something:","examples":["The US lodged a formal protest against the arrest of the foreign reporters.","Lawyers said last night that they would be lodging an appeal against the sentence.","We have until next month to lodge our objections to the development."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00368","kind":"word","word":"loiter","meaning":"To loiter means to stand or wait around idly or without apparent purpose. It implies lingering in a public place, often in a way that suggests wasting time, causing a nuisance, or waiting to commit a minor offense.","examples":["\"Teenagers were loitering outside the convenience store.\"","\"Police warned the group not to loiter on private property.\"","\"He spent the afternoon loitering in the park, enjoying the sunshine.\" (More neutral use)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00369","kind":"word","word":"longitudinal","meaning":"longitudinal sutdy","examples":["longitudinal fissure"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00370","kind":"word","word":"lopsided","meaning":"Lopsided is an adjective that describes something that is disproportionately heavy, large, or dominant on one side, making it asymmetrical or unevenly balanced.\n\nThe word originates from the early 18th century, combining the verb lop (meaning to hang loosely or droop, as seen in \"lop-eared\" rabbits) with the word sided. It was originally a nautical term used to describe a ship that leaned awkwardly to one side in the water.","examples":["A. Sports and Competition\nThis is one of the most frequent uses in daily conversation. A \"lopsided\" game or election is a blowout where one side vastly outperforms the other, completely eliminating any tension.\n\nExample: \"The final score was a lopsided 45-3, proving that the two teams were completely mismatched.\"\n\nExample: \"Despite early polling, the mayor won reelection by a highly lopsided margin.\"","B. Physical Appearance\nIt describes physical objects, structures, or features that lack symmetry.\n\nExample: \"The boy gave a lopsided grin, smiling only out of the right side of his mouth.\"\n\nExample: \"If you don't level the foundation first, the entire bookshelf will turn out lopsided.\"","C. Economics and Contracts\nIn business, a lopsided agreement is one that heavily favors one party while offering very little to the other.\n\nExample: \"The union rejected the lopsided contract proposal because it heavily favored corporate management.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00371","kind":"word","word":"macro","meaning":"relating to the whole of something, rather than its parts:","examples":["The state's ability to exercise macro-control was weakened.","macroscopic (= large enough to be seen by the human eye)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00372","kind":"word","word":"make use of","meaning":"To make use of something means to use it; to put it into service or apply it for a particular purpose or advantage.\n\nIt's a common phrasal verb that is often interchangeable with \"use,\" but can sometimes imply a more deliberate or strategic application of a resource or opportunity.","examples":["\"We should make use of all the available resources to complete the project on time.\" (Utilize resources)","\"I always try to make use of constructive criticism to improve my skills.\" (Apply the feedback)","\"The company aims to make use of renewable energy sources.\" (Employ them for power)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00373","kind":"word","word":"malcontent","meaning":"a person who is not satisfied with the way things are, and who complains a lot and is unreasonable and difficult to deal with","examples":["Throughout history, the malcontent always attempted to seize power."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00374","kind":"word","word":"malleable","meaning":"Malleable is an adjective that describes a material's ability to be hammered, pressed, or rolled into a new shape without breaking or cracking. Figuratively, it describes a person or an abstract concept that is easily influenced, trained, or altered.\n\nThe word comes from the Latin malleare, meaning \"to hammer,\" which itself derives from malleus, the Latin word for \"hammer.\"","examples":["A. Metallurgy and Materials (Literal)\nIn physics and manufacturing, this is a specific mechanical property of metals. A highly malleable metal can be pounded into incredibly thin sheets.\n\nExample: \"Because gold is the most malleable metal on Earth, a single ounce can be beaten into a translucent sheet covering nearly three hundred square feet.\"\n\nExample: \"Heating the iron in the forge made it highly malleable and easy for the blacksmith to shape.\"","B. Psychology and Personality (Figurative)\nWhen applied to human beings, it describes a mind or personality that is highly impressionable and easily molded by outside forces, for better or worse.\n\nExample: \"The cult leader specifically targeted young, malleable recruits who were looking for a sense of belonging.\"\n\nExample: \"A child's brain is incredibly neuroplastic and malleable, allowing them to absorb new languages effortlessly.\"","C. Abstract Concepts\nIt can also describe schedules, plans, or memories that are flexible and prone to changing.\n\nExample: \"Human memory is not a perfect video recording; it is a highly malleable reconstruction that changes every time we recall it.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00375","kind":"word","word":"mandate","meaning":"an official order or commission to do something.","examples":["\"a mandate to seek the release of political prisoners\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00376","kind":"word","word":"manifest","meaning":"to make something happen by imagining it and consciously thinking that it will happen:","examples":["He had been listed on the manifest for the flight but it could not be confirmed if he had boarded.","Some people believe you can manifest a healthy body.","She claims she can help you manifest a new job, more money, or a new relationship.","\"She wished for success, and opportunities began to manifest in unexpected ways.\" (Opportunities began to appear or materialize.)","The workers chose to manifest their dissatisfaction in a series of strikes.","Lack of confidence in the company manifested itself in a fall in the share price.","Kipper manifested no joy or disappointment, but remained in his chair, calm and unconcerned."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00377","kind":"word","word":"manifestation","meaning":"Manifestation (noun) refers to the act of something becoming clear, visible, or evident. It can also mean a sign or expression of something abstract, such as an idea, emotion, or condition.","examples":["manifestation of pure hatred and rage","His constant fatigue was a manisfestation of his stress and overwork","His psychological symptoms were an evident manifestation of his lingering pain from war trauma."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00378","kind":"word","word":"manifesto","meaning":"a written statement of the beliefs, aims, and policies of an organization, especially a political party:","examples":["In their election manifesto, the Liberal Democrats proposed increasing taxes to pay for improvements in education.","The Communist Manifesto"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00379","kind":"word","word":"manifold","meaning":"many and of several different types:","examples":["Our organization’s problems are manifold – too few members, too little money, and poor management.","Despite her manifold faults, she was a strong leader.","In mathematics, a manifold is a topological space that locally resembles Euclidean space near each point."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00380","kind":"word","word":"manner","meaning":"the way in which something is done:","examples":["Please exit the building in an orderly manner.","The manners and habits of patronage, therefore, were embedded in the manners and habits of society."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00381","kind":"word","word":"mantissa","meaning":"In the context of common logarithms (logarithms with base 10), the mantissa is the positive fractional part of the logarithm. The integer part is called the \"characteristic.\"","examples":["In scientific notation and floating-point number representation (used in computers), the term \"mantissa\" refers to the part of the number that contains its significant digits."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00382","kind":"word","word":"margin","meaning":"the difference between two amounts of time, money, etc, usually between people in a competition:","examples":["to win by a narrow/wide margin","He took third place by a margin of seven minutes."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00383","kind":"word","word":"maximal","meaning":"The greatest or best possible amount of something. For example, you might describe a car's speed as maximal.","examples":["The greatest or best possible amount of something. For example, you might describe a car's speed as maximal.","In between there is a critical thickness when the strain energy density is maximal."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00384","kind":"word","word":"maximum","meaning":"The greatest quantity or value attainable or attained. For example, you might describe a sentence as the maximum possible.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00385","kind":"word","word":"meager","meaning":"very small in amount or number; only as much or not as much as is needed or thought to be suitable:","examples":["The food at my grandmother's house was meager and barely edible.","However, the evidence for their universal validity remains meager.","In a state that has a relatively meager tax base and a struggling educational system, proper school land management is important."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00386","kind":"word","word":"measles","meaning":"Measles (noun) is a highly contagious infectious disease caused by a virus. It is characterized by a distinctive red, blotchy rash that usually starts on the face and spreads to the rest of the body.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00387","kind":"word","word":"mediate","meaning":"to talk to two separate people or groups involved in a disagreement to try to help them to agree or find a solution to their problems:","examples":["Last-minute attempts at mediation failed, and the workers went on strike.","The governor appointed a mediator and asked both sides to return to the bargaining table.","What's the difference between mediation and arbitration? In a mediation process, a neutral, trained mediator works to help disputants come to a consensus on their own. In arbitration, a neutral, trained arbitrator serves as a judge who is responsible for resolving the dispute."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00388","kind":"word","word":"meticulously","meaning":"in a way that shows great care and attention to detail:","examples":["Each piece of writing is meticulously edited, and provided with a useful but unobtrusive commentary.","At the same time, in public, he meticulously observed the various protocols that protected the outward forms of propriety.","It is a superb contribution, meticulously researched and lavishly exemplified with details that are both entertaining and instructive."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00389","kind":"word","word":"midst","meaning":"the middle of a group of people or things:","examples":["She caught sight of Johnny in their midst (= among them), laughing and talking.","The summit of the mountain appeared midst the clouds.","Long Beach is in the midst of a revival."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00390","kind":"word","word":"minimal","meaning":"very small in amount:","examples":["There were no injuries and damage to the building was minimal."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00391","kind":"word","word":"misappropriation","meaning":"Misappropriation is the act of taking something, usually money or property, from its rightful owner and using it for an unauthorized or illegal purpose. It is a form of theft or fraud, but specifically implies a breach of trust where the person taking the item was entrusted with it or had a duty to care for it.","examples":["\"The treasurer was charged with misappropriation of funds after she used the club's money for personal expenses.\"","\"The company sued its former employee for the misappropriation of trade secrets.\"","\"His misappropriation of the trust fund was discovered during the annual audit.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00392","kind":"word","word":"moderate","meaning":"A. Avoiding Extremes (Adjective & Noun)\nIn politics, weather, or personal habits, \"moderate\" describes something that sits comfortably in the middle. A political \"moderate\" (noun) is someone who avoids the extreme left or extreme right.\n\nExample: \"The doctor recommended a moderate amount of daily exercise, like a brisk 30-minute walk.\"\n\nExample: \"Because she is a political moderate, she often ends up voting for candidates from both major parties.\"","examples":["B. To Lessen or Control (Verb)\nWhen you moderate something, you are actively turning down the volume, speed, or intensity. It also refers to the act of guiding or controlling a formal discussion to keep it civil.\n\nExample: \"As the storm moved inland, the heavy winds began to moderate.\"\n\nExample: \"The professor was asked to moderate the debate between the two competing scientists.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00393","kind":"word","word":"mods","meaning":"in terms of time blocks","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00394","kind":"word","word":"monetary","meaning":"Monetary is an adjective that relates to money, currency, or the mechanisms by which money is circulated in an economy.\n\nWhen you see this word, it almost always points to the actual cash value of something or the high-level management of a nation's money supply.","examples":["In macroeconomics, this word is most famously paired with \"policy.\" Monetary policy refers to the actions a central bank takes to influence the economy, primarily by changing interest rates or printing more money.\n\nExample: \"To combat rising inflation, the central bank decided to tighten its monetary policy by raising interest rates.\"\n\nExample: \"The country is facing a severe monetary crisis due to the collapse of its currency.\"","In law, insurance, and daily life, it is used to distinguish the cash value of an object or action from its emotional or practical value.\n\nExample: \"The old photograph has immense sentimental value to the family, but absolutely no monetary value.\"\n\nExample: \"The judge ordered the company to provide monetary compensation to the workers who were injured.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00395","kind":"word","word":"monetize","meaning":"To monetize means to convert something into money or to earn revenue from it. It's about finding a way to make money from an asset, service, product, audience, or activity that may not traditionally be seen as a direct source of income.","examples":["\"Many free apps monetize their users through in-app purchases or displaying ads.\"","\"Social media influencers often monetize their large followings through brand partnerships and advertisements.\" (Making money from their audience)","\"The company plans to monetize its patent portfolio by licensing the technology to other firms.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00396","kind":"word","word":"monolith","meaning":"A monolith (noun) literally means a single large block of stone, especially one shaped into a pillar or monument. Figuratively, it can refer to something large, powerful, and unyielding.","examples":["\"Stonehenge is comprised of several ancient monoliths.\"\n\n\"The movie '2001: A Space Odyssey' features a mysterious black monolith.\"","By extension, \"monolith\" is often used metaphorically to describe a very large, powerful, and often unyielding entity, organization, or structure that is seen as uniform, rigid, and sometimes oppressive or unchangeable. It can imply a lack of diversity, responsiveness, or flexibility.","Critics described the large corporation as a bureaucratic monolith that was slow to adapt.\"\n\n\"The government was seen by some as an impenetrable monolith.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00397","kind":"word","word":"moot","meaning":"not important or not relevant, therefore not worth discussing:","examples":["We don't have enough money to go, so it's all moot anyway.","Because the claim of negligence was denied, seeking an award for damages was moot."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00398","kind":"word","word":"narrative","meaning":"a particular way of explaining or understanding events:","examples":["a first-person/third-person narrative","a gripping/compelling narrative","Both sides in the conflict have a narrative of victimhood."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00399","kind":"word","word":"nauseate","meaning":"\"Nauseated\" means feeling as if you are going to vomit; affected with nausea.","examples":["\"The rocking boat made him feel nauseated.\"","\"She felt nauseated after eating the spoiled food.","\"The strong perfume was so overwhelming that it made me nauseated.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00400","kind":"word","word":"negate","meaning":"to cause something to have no effect:","examples":["The increase in our profits has been negated by the rising costs of running the business."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00401","kind":"word","word":"negation","meaning":"Negation is a multifaceted concept that, in its most general sense, refers to the act of denying, contradicting, or making something the opposite of what it was. It can also signify the absence or non-existence of something.","examples":["Stating that something is not true or not the case. For example, \"Her statement was a negation of all previous reports.\" Shaking one's head can be a physical gesture of negation.","Representing the complete antithesis or lack of something. For instance, \"Darkness is the negation of light.\"","Causing something to lose its effect or to cease to exist. For example, \"The new evidence led to the negation of the earlier theory.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00402","kind":"word","word":"noisome","meaning":"Noisome (adjective) means having an extremely offensive or unpleasant smell. It can also mean causing or able to cause nausea, annoyance, or disgust.\n\nIt often implies a smell that is not just bad, but actively harmful or sickening.","examples":["\"The garbage dump emitted a noisome stench that wafted across the entire town.\"","\"They discovered a noisome swamp teeming with mosquitoes behind the old factory.\"","\"His noisome habits, like chewing with his mouth open, made him unpopular.\" (Here, it refers to causing disgust/annoyance, not necessarily smell.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00403","kind":"word","word":"nomad","meaning":"A nomad is a person who lives a wandering life, moving from place to place rather than living in one permanent location.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00404","kind":"word","word":"nook and cr
