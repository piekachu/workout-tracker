he need arises."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00555","kind":"word","word":"sic","meaning":"\"Sic\" is a Latin word, functioning as an adverb, that is primarily used in writing (especially in quotes) to indicate that something written is reproduced exactly as it was in the original, even if it contains a mistake, is unusual, or appears incorrect.\n\nIt's pronounced \"sick\" (like when you're feeling ill).","examples":["\"The politician stated, 'Our nations will form an unassailable allience [sic] for peace.'\" (The [sic] indicates that the misspelling \"allience\" was in the original statement and not a typo made by the person quoting it.)","\"According to the ancient manuscript, 'the sun riseth in the west [sic] and setteth in the east.'\" (The [sic] highlights that the original text stated the opposite of what is scientifically true.)","\"In her diary, she wrote, 'I felt great compunction [sic] about eating the last cookie.'\" (The [sic] might be used if the editor thinks \"compunction\" is an unusual or potentially misused word in that context, implying the diarist meant \"no compunction\" or a different feeling.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00556","kind":"word","word":"silver lining","meaning":"A silver lining is a metaphor for a sign of hope or a positive aspect in an otherwise gloomy, difficult, or negative situation. It suggests that even in bad times, there is always something good to be found.\n\nThe phrase comes from the idiom \"every cloud has a silver lining,\" which is based on the appearance of clouds. When the sun is behind a dark cloud, the cloud's edges can be illuminated with a bright, silvery light. This visual is used to represent hope or a positive side to a seemingly negative situation.","examples":["\"Losing his job was tough, but the silver lining was that he finally had time to start his own business.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00557","kind":"word","word":"simple interest","meaning":"calculated using the principal only and does not include compounding interest","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00558","kind":"word","word":"simultaneously","meaning":"Simultaneously means at the same time. It describes two or more events, actions, or processes that are happening or occurring concurrently.","examples":["\"The two runners crossed the finish line simultaneously.\" (They both finished at the exact same instant.)","\"The phone rang and the doorbell chimed simultaneously, making her jump.\" (Both sounds occurred at the same time.)","\"The conductor asked the string and wind sections to play simultaneously.\" (They were to start playing at the same instant.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00559","kind":"word","word":"skepticism","meaning":"doubt that something is true or useful:","examples":["The company's environmental claims have been greeted/regarded/treated with skepticism by conservationists.","Many experts remain skeptical about/of his claims.","This requirement is so sufficiently bizarre that it merits a deeply skeptical response."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00560","kind":"word","word":"smother","meaning":"To smother has a few distinct but related meanings, primarily revolving around the idea of covering something completely, often to suppress or extinguish it.","examples":["\"The fire in the fireplace was accidental, but the smoke smothered the occupants.\"","\"She quickly smothered the small fire with a blanket.\"","\"She likes to smother her pancakes in syrup.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00561","kind":"word","word":"solemn","meaning":"This is the most common meaning. It describes a person, expression, occasion, or atmosphere that is grave, sober, and unsmiling.","examples":["The mood at the funeral was very solemn.","He had a solemn expression on his face as he delivered the bad news.","The new president took a solemn oath of office."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00562","kind":"word","word":"somewhat","meaning":"Somewhat is an adverb that means to a moderate extent, partially, or slightly. It is used to soften a statement, indicating that something is true, but not entirely or intensely true.\n\nThe word is a straightforward combination of the Old English words sum (a certain quantity) and hwæt (what or thing).","examples":["A. Softening an Opinion or Fact (Everyday Use)\nIn daily conversation, \"somewhat\" is often used to be polite, to downplay an emotion, or to indicate a partial state of being.\n\nExample: \"I was somewhat surprised when they announced their resignation, but I knew they had been unhappy.\"\n\nExample: \"The movie was somewhat entertaining, but the ending was a bit confusing.\"","B. Academic and Professional Hedging\nIn scientific writing, journalism, and formal reports, absolute certainty is rare. Writers use \"somewhat\" as a \"hedge word\" to avoid making claims that are too strong or cannot be 100% proven by the data.\n\nExample: \"The experimental results were somewhat inconsistent with our initial hypothesis.\"\n\nExample: \"The new software update has somewhat mitigated the security risks.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00563","kind":"word","word":"spacious","meaning":"large and with a lot of space:","examples":["a spacious house/living room","spacious accommodation"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00564","kind":"word","word":"sparingly","meaning":"Sparingly means in a careful or restricted way; in small quantities or amounts; rarely or infrequently. It implies using or doing something in a minimal or limited fashion, often to conserve it, to avoid excess, or because it's not needed often.","examples":["She uses sugar sparingly in her coffee to cut down on calories.","The notoriously tough critic gave praise sparingly.","During financially tight times, they spent money very sparingly."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00565","kind":"word","word":"spectacle","meaning":"A Visually Striking or Dramatic Display: Something that is impressive, eye-catching, or spectacular to look at. This is the most common meaning.\nA Public Display, Often a Negative One: Something that is a strange, embarrassing, or chaotic sight for people to witness. This meaning often carries a negative connotation.\nEyeglasses (Plural): The term \"spectacles\" is an older word for a pair of glasses.","examples":["Everyone from school marching in a line was a huge spectacle that I will never be able to forget.","The angry mob running through the streets created a spectacle.","He slightly bent over to read the paper, gently pushing his spectacles closer to his eyes."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00566","kind":"word","word":"sphere","meaning":"a subject or area of knowledge, work, etc.:","examples":["In the foreign policy sphere, Li also indicated that China is ready to include human rights in its diplomacy.","When the children played they always remained within the sphere of their own little group.","exchanges with other countries, particularly in cultural, scientific, and economic spheres"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00567","kind":"word","word":"springs from","meaning":"Springs from is a phrasal verb that means to originate, arise, or be caused by a specific source.\n\nThe phrase draws on the literal imagery of water emerging (springing) naturally from the ground to form a river, or a coiled piece of metal suddenly releasing its stored tension.","examples":["A. Abstract Origins (Ideas, Emotions, and Problems)\nThis is the most common way the phrase is used in writing and conversation. It describes the root cause of a feeling, a belief, a conflict, or a movement.\n\nExample: \"Her incredible work ethic springs from a childhood spent helping her parents run a small business.\"\n\nExample: \"Most of the department's scheduling errors spring from a lack of clear communication.\"","B. Physical Origins (Geography and Biology)\nIt is also used literally to describe where a physical entity begins its journey or growth.\n\nExample: \"The mighty Amazon River springs from a series of small streams high in the Andes Mountains.\"\n\nExample: \"The new branches spring from the nodes along the main stem of the plant.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00568","kind":"word","word":"square one","meaning":"Square one is a noun phrase almost exclusively used in the common idiom \"back to square one.\" It refers to the absolute beginning or the starting point of a process, project, or journey.\n\nWhen you are forced \"back to square one,\" it means your previous efforts have failed, been rejected, or become invalid, requiring you to start the entire process completely over from the very first step. The phrase is widely believed to originate from traditional board games (like Snakes and Ladders) where a penalty forces a player to return to the first square on the board.","examples":["A. Business and Engineering (Project Management)\nIn professional settings, it describes the frustrating reality of scrapping a current draft, prototype, or plan and starting over because of a fundamental flaw or a change in requirements.\n\nExample: \"The client hated all three of our design proposals, so I guess we are back to square one.\"\n\nExample: \"When the primary investor pulled their funding, the startup was forced back to square one.\"","B. Negotiations and Problem Solving\nIt also applies to debates, arguments, or diplomatic negotiations where a tentative agreement falls apart, forcing both sides to return to their original, baseline positions.\n\nExample: \"We had almost finalized the treaty, but the border dispute sent the entire peace process back to square one.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00569","kind":"word","word":"stake","meaning":"A Strong Post or Pointed Stick:\nA strong wooden or metal post driven into the ground, used for marking, support, or as a boundary. Historically, also used for executions (burning at the stake).\nA Financial Holding (often plural \"stakes\"):\nShares or financial involvement in a business or enterprise.","examples":["To Bet or Wager Money:\nTo risk money or something valuable on the outcome of a game or event.\nTo Support or Mark with a Stake(s):\nTo support something with a stake or stakes.","\"Everyone involved in the project has a stake in its completion.\" (A personal interest in the outcome)\n\"The future of the planet is at stake.\" (It is what will be won or lost; what is being risked)\n\"The vampire was said to be killed by a stake through the heart.\"","\"He decided to stake all his winnings on the last horse.\"\n\"They staked out their claim on the mining land.\" (Marked their territory with stakes)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00570","kind":"word","word":"statute","meaning":"Statute is a noun that refers to a formal, written law passed by a legislative body (like a parliament, congress, or city council). It can also refer to a permanent rule made by an organization or institution to govern its internal affairs.\n\nThe word comes from the Latin statutum, which means \"a law or decree,\" derived from the verb statuere, meaning \"to set up or establish.\" When a rule becomes a statute, it is officially set in stone.","examples":["A. Government and Law\nThis is the most common use. Unlike \"common law\" (which is established by judges through court decisions over time), a statute is explicitly written, debated, and enacted by a government.\n\nExample: \"The new environmental statute strictly regulates the amount of emissions a factory can produce.\"\n\nExample: \"He was charged with violating a federal statute regarding wire fraud.\"","B. Organizations and Universities\nCorporations, universities, and international organizations also write statutes to serve as their foundational rules of operation.\n\nExample: \"According to the university's statutes, a professor must be granted tenure after seven years of continuous teaching.\"\n\nExample: \"The club drafted a new statute outlining the election process for the upcoming semester.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00571","kind":"word","word":"stratagem","meaning":"A stratagem is a plan or scheme, especially one used to outwit an opponent or achieve an end.\nIt implies cleverness, cunning, and often a degree of deception or artifice. The goal of a stratagem is usually to gain an advantage, bypass an obstacle, or achieve a goal indirectly, often by surprise or misdirection.","examples":["The general devised a brilliant stratagem to draw the enemy out of their fortified position.","\"Her stratagem to get the promotion involved subtly highlighting her colleagues' weaknesses while showcasing her own strengths.\" (A cunning personal plan.)","\"The company's marketing stratagem was to offer a ridiculously low introductory price to attract new customers.\" (A shrewd business tactic.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00572","kind":"word","word":"streamer ()","meaning":"decorations","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00573","kind":"word","word":"stroll","meaning":"to walk in a slow relaxed way, especially for pleasure:","examples":["The whole family was enjoying a leisurely stroll in the sunshine.","After dinner, we went for a stroll along the beach.","An elderly couple strolled hand in hand in the park."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00574","kind":"word","word":"subject","meaning":"cause or force to undergo (a particular experience of form of treatment).","examples":["She has made a series of documentaries on the subject of family relationships.","The guest lecturer took as her subject (= decided to speak about) \"punishment and imprisonment in modern society\".","The number of planes flying over the town has been the subject of (= has caused) concern since last summer.","\"he'd subjected her to a terrifying ordeal\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00575","kind":"word","word":"subjective","meaning":"influenced by or based on personal beliefs or feelings, rather than based on facts:","examples":["More specific and less subjective criteria should be used in selecting people for promotion within the company.","This domain is a subjective domain unlike the assembly domain.","More importantly, by studying the subjective experiences of the meaning of music we gain insights into the person's self."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00576","kind":"word","word":"subsequent","meaning":"happening after something else:","examples":["The book discusses his illness and subsequent resignation from politics.","Those explosions must have been subsequent to our departure, because we didn't hear anything.","The nature of the signal conveyed by a mated female to discourage subsequent matings was not reported in this case."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00577","kind":"word","word":"subservient","meaning":"The word subservient is an adjective used to describe someone or something that is prepared to obey others unquestioningly, or something that is less important than something else.","examples":["\"In the old film, the assistant was portrayed as a quiet, subservient character who never complained.\"","\"The lighting in the room was subservient to the overall atmosphere; it was there to help, not to be noticed.\"","North Korea constantly brain washes their subjects to render them subservient to the dictator."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00578","kind":"word","word":"subsidize","meaning":"to pay part of the cost of something:","examples":["He raises the question as to whether the fine arts should be subsidized by public funds.","In the past, all energy sectors have been at least partially subsidized."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00579","kind":"word","word":"subsidy","meaning":"A subsidy (plural: subsidies) is a sum of money granted by the government or a public body to help an industry or business keep the price of a commodity or service low. It is essentially a form of financial assistance or support.","examples":["\"The government provided subsidies to farmers to help them cope with rising production costs.\"","\"To encourage the use of public transport, the city heavily subsidizes bus fares.\"","\"Many countries offer subsidies for solar panel installation to promote renewable energy.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00580","kind":"word","word":"substituent","meaning":"A substituent refers to an atom or a group of atoms that takes the place of (substitutes for) a hydrogen atom on a parent chain or ring structure of a hydrocarbon or other parent molecule.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00581","kind":"word","word":"subtextual","meaning":"Subtextual refers to something that is implied rather than directly stated; something that is beneath the surface meaning.","examples":["In the play, much of the drama comes from the subtextual desires and fears of the protagonists.","Her compliment had a subtextual critique, suggesting that while the work was good, it could have been better.","The speaker's polite smile didn't hide the subtextual irritation in his tone."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00582","kind":"word","word":"subtle","meaning":"not loud, bright, noticeable, or obvious","examples":["I could detect subtle variances in fragrance as we strolled through the garden.","These changes are subtle and intermittent at first and become more permanent and obvious as the disease progresses."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00583","kind":"word","word":"succinct","meaning":"said in a clear and short way; expressing what needs to be said without unnecessary words:","examples":["It begins with a succinct definition of arithmetic expressions and then introduces is and the arithmetic comparison predicates.","Each section begins with a succinct introduction, and the volume concludes with an afterword relating the theme of the volume to issues in curriculum development.","Keep your letter succinct and to the point."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00584","kind":"word","word":"succinctly","meaning":"in a way that expresses what needs to be said clearly and without unnecessary words:","examples":["I thought she expressed her feelings most succinctly at the meeting.","Start with a subject line that succinctly sums up your request.","Thus, the context can be succinctly described by a pointer to a previous context plus the incremental changes."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00585","kind":"word","word":"suggestible","meaning":"Suggestible describes a person who is easily influenced by others' ideas, suggestions, or opinions. They tend to be highly receptive to external influences and can be persuaded to believe or do things without much resistance.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00586","kind":"word","word":"sui generis","meaning":"Sui generis is a Latin phrase that means \"of its own kind\" or \"in a class by itself.\" It is used to describe something that is unique and cannot be classified with or compared to anything else.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00587","kind":"word","word":"sullen","meaning":"Sullen describes someone who is bad-tempered and sulky; gloomy. It implies a moody silence or resentment, often accompanied by a quiet, brooding unhappiness.","examples":["\"After being grounded, the teenager sat in his room with a sullen expression, refusing to come down for dinner.\"","\"The atmosphere in the meeting was sullen after the unexpected budget cuts were announced.\"","\"He tried to cheer up his sullen friend, but nothing seemed to work.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00588","kind":"word","word":"superfluous","meaning":"Superfluous (adjective) means unnecessary, excessive, or more than what is needed.","examples":["His speech was filled with superfluous details that added no real value.","Buying another pair of shoes seems superfluous when you already have so many.","The report contained superfluous information that only made it harder to read."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00589","kind":"word","word":"suppose","meaning":"A. The Logical Premise (Academic and Scientific)In academic writing, math, and science, \"suppose\" is an imperative command used to set up a hypothetical scenario, a thought experiment, or a mathematical proof.Example: \"Suppose $x$ is an even integer. That means $x = 2k$ for some integer $k$.\"Example: \"Let us suppose, for the sake of argument, that the atmosphere had no carbon dioxide.\"","examples":["B. Belief or Assumption (Everyday Use)\nIt is frequently used to express a tentative belief, a guess, or an assumption when you are not 100% certain.\n\nExample: \"I suppose the meeting will be canceled since the manager is out sick.\"\n\nExample: \"Do you think it will rain today? I suppose so.\"","When used in the passive form (\"supposed to\"), it indicates a duty, a rule, or an expectation.\n\nExample: \"You are supposed to wear safety goggles in the laboratory.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00590","kind":"word","word":"suppurate","meaning":"Suppurate is a medical verb that means to form, secrete, or discharge pus. It is a sign of an inflammatory process, usually caused by a bacterial infection.\nThe word comes from the Latin sub (under) and pus/puris (pus), literally meaning \"to form pus under the surface.\"","examples":["The doctor warned that if the cut was not cleaned properly, it would likely suppurate within a few days.","A suppurating wound requires careful management to prevent the infection from spreading to the bloodstream."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00591","kind":"word","word":"surpass","meaning":"to do or be better or greater than something:","examples":["The quarterly sales figures have surpassed everyone's expectations.","The latest figures surpassed the previous peak of 15,418 foreclosures in the third quarter of 2008.","His work in this field is unlikely to be surpassed for a very long time to come."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00592","kind":"word","word":"surrogate","meaning":"A surrogate (noun) is a substitute, a person or thing that takes the place of another. It implies that one entity stands in for or performs the role of another, often because the original is unable or unwilling.","examples":["Surrogate Mother (most common specific usage):\n\nA woman who carries a pregnancy for another person or couple, usually through in vitro fertilization. She is a substitute for the biological or intended mother.\n\nExample: \"The couple chose a surrogate mother to carry their child.\"","\"The Vice President acted as a surrogate for the President at the international conference.\"","\"Sales figures are often used as a surrogate for customer satisfaction.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00593","kind":"word","word":"surveil","meaning":"to carefully watch a place or person or listen to private conversations over a period of time, usually in order to get information about illegal activity:","examples":["The new Patriot Act lets the FBI wiretap and surveil more easily.","The warrants give agents broad powers to electronically monitor and surveil people who they allege are connected to terrorism or espionage cases."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00594","kind":"word","word":"suspense","meaning":"Suspense is a noun that describes a state of feeling excited, anxious, or uncertain about what is going to happen next. It is the emotional \"holding of breath\" before a resolution.","examples":["The author masterfully built suspense by ending every chapter on a cliffhanger.","They kept us in suspense for three weeks before announcing who had won the promotion."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00595","kind":"word","word":"syndicate","meaning":"A syndicate has several related meanings, often revolving around a group of individuals or organizations combined to promote a common interest.","examples":["A Group of Individuals or Organizations Formed to Undertake a Project or Transaction:\n\nThis is the most common and broadest meaning. It refers to a temporary association of people or companies (often banks, investors, or journalists) who pool their resources or expertise to carry out a specific financial transaction, large project, or common business venture.\n\n\"A syndicate of banks was formed to finance the new skyscraper.\" (A group of banks pooling resources for a loan)","A Criminal Organization (especially in crime/fiction):\n\nIn a more colloquial or informal (and often negative) sense, it can refer to a group of criminals or organized crime network.\n\n\"The detective was investigating a powerful drug syndicate.\"","To Form a Syndicate; To Publish/Sell through a Syndicate (Verb):\n\nAs a verb, it means to form a syndicate, or to publish or market something through a syndicate.\n\n\"The author decided to syndicate her popular column to newspapers nationwide.\" (Sell it to multiple publications through a syndicate)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00596","kind":"word","word":"take away","meaning":"a main message or piece of information that you learn from something you hear or read:","examples":["The takeaway from the conference was how competitive the tourism industry has become.","At the end of the class, the teacher gives us the takeaway points."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00597","kind":"word","word":"tamper","meaning":"To tamper means to interfere with something in a way that causes damage, makes unauthorized changes, or alters it secretly and improperly. It implies meddling with something that is not yours to touch, often with malicious or deceptive intent.","examples":["Do not tamper with the fire alarm system; it is a crime.","Some children often tamper with the device, which results in frequent malfunction.","To prevent people from tampering with the failsafe, the government mandated compulsory safety measures."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00598","kind":"word","word":"tantamount","meaning":"Tantamount (adjective) means equivalent in value, force, meaning, or effect. It describes a situation where one thing is essentially the same as another, often something undesirable.","examples":["Her bruises on her face were tantamount to evidence of domestic violence.","The company's latest policy was tantamount to a protest against the new government regulations.","The research team's latest discovery was tantamount to discovering an alien."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00599","kind":"word","word":"taxonomy","meaning":"a system for naming and organizing things, especially plants and animals, into groups that share similar qualities","examples":["We should note, however, that it is questionable to what extent such taxonomies reflect the nature of the underlying psychological processes.","It took a long time to develop ' a systematic, subject-based taxonomy for such a new field of study', as the editors say.","Modern research into contemporary reading practices suggests a possible taxonomy of annotation practice."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00600","kind":"word","word":"tectonic","meaning":"relating to the structure of the earth's crust and the large-scale processes which take place within it.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00601","kind":"word","word":"tempt","meaning":"to make someone want to have or do something, especially something that is unnecessary or wrong:","examples":["The offer of free credit tempted her into buying a new car.","They tempted him to join the company by offering him a huge salary and a company car.","Once again, it is tempting to interpret the outcome as a by-product of the historical heritage."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00602","kind":"word","word":"tender","meaning":"offer or present (something) formally.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00603","kind":"word","word":"tendinitis","meaning":"a medical condition in which a tendon (= a strong piece of tissue in the body connecting a muscle to a bone) becomes swollen and painful:","examples":["They use a special athletic technique developed by the Japanese to keep body aches, specifically tendinitis, at bay.","She had developed pain from carpal tunnel syndrome in her wrists and tendinitis in her neck and arms.","No wonder his tendinitis was damaged; he works out twice a day."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00604","kind":"word","word":"testimonial","meaning":"a statement about the character or qualities of someone or something","examples":["Financial Mail exposed the company's use of fake or doctored customer testimonials in advertising."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00605","kind":"word","word":"thoroughly","meaning":"completely; in a way that includes many details:","examples":["The drug was thoroughly tested before being put on the market.","The carer must ensure that the patient is cleaned thoroughly when he has finished.","Relatively few languages have been thoroughly studied at the syntactic level."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00606","kind":"word","word":"throw","meaning":"to confuse or shock someone or cause difficulty for them:","examples":["That question really threw me at first.","The news of the coup threw them into a state of panic.","I wasn't expecting a visitor. I was really thrown."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00607","kind":"word","word":"timely","meaning":"happening at the best possible moment:","examples":["The change in the exchange rate provided a timely boost to the company's falling profits.","Timely responses from the state, which favored large producers, never came.","This book is therefore a timely and relevant contribution for a better understanding of different approaches to caring for children and older people."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00608","kind":"word","word":"to be in order","meaning":"The phrase \"is in order\" has two main meanings, generally revolving around the idea of something being appropriate, necessary, or properly arranged.","examples":["I believe a gratitude is in order.","Considering your achievements, a compliment is in order.","All the machinery is in order."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00609","kind":"word","word":"to wing it","meaning":"The phrase \"I'll just wing it\" means you plan to do something without much or any prior planning, preparation, or practice.","examples":["\"I haven't rehearsed my presentation, I'll just wing it.\"","\"We don't have a solid plan for the trip, we'll just wing it when we get there.\"","\"The band didn't practice that song, but the lead singer decided to wing it during the concert.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00610","kind":"word","word":"toot my own horn","meaning":"To toot your own horn is an idiom that means to boast, brag, or talk proudly about your own achievements, skills, or success.\n\nIt is often used when someone feels a bit self-conscious about sharing their accomplishments and wants to acknowledge that they are being self-promotional.","examples":["\"I don't mean to toot my own horn, but the client said my presentation was the best they’ve seen all year.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00611","kind":"word","word":"topical","meaning":"Relating to a Current Topic or Event\nApplied to a Local Part of the Body: A topical medication is one that is applied directly to a particular spot on the skin, such as an ointment, cream, or lotion, rather than being taken internally.\nIn essence, \"topical\" means either about a current subject or applied to a specific area of the body.","examples":["The agenda of the meeting was abundant in topical subjects related to the recent escalation in the Middle East","The lecturer had a very well-prepared keynote; however, it lacked topical relevance.","Elaborate topical jokes could improve the atmosphere in the office."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00612","kind":"word","word":"transcript","meaning":"A transcript is a written or printed version of material that was originally spoken, recorded, or written in another form. It's essentially a verbatim (word-for-word) record of something.","examples":["\"It's easier to analyze the data if you have a transcript of the focus group discussion.\"","\"Her university transcript showed a strong GPA in all her science courses.\"","\"The mRNA transcript carries genetic information from DNA to the ribosomes.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00613","kind":"word","word":"transgression","meaning":"A transgression is an act that goes against a law, rule, or code of conduct; an offense. It implies a violation or crossing of a boundary, whether it is a moral, legal, or social one.","examples":["The governor had to pay for his years of transgression.","The man in his deathbed, confessed all his transgressions.","His transgressional behavior was noticed by his therapist."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00614","kind":"word","word":"triage","meaning":"the process of examining problems in order to decide which ones are the most serious and must be dealt with first:","examples":["We are performing triage on funding requests.","A healthy project is in a constant state of triage between bugs and feature development.","The sheer number of claims has insurers triaging which policyholders get attention first."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00615","kind":"word","word":"tribulation","meaning":"a problem or difficulty","examples":["Nonetheless, the trials and tribulations of these patients are not uncommonly encountered in the context of genetic counseling."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00616","kind":"word","word":"trivial","meaning":"having little value or importance:","examples":["Some are very useful, others are too trivial.","I don't know why he gets so upset about something so trivial.","It was a badly researched documentary which glossed over important questions while pointing up trivial ones."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00617","kind":"word","word":"trustworthy","meaning":"able to be trusted","examples":["Not even a newspaper always gives trustworthy information.","Thus, robust regression must be used in order to compute trustworthy solutions.","In this job we need someone who is entirely honest and trustworthy."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00618","kind":"word","word":"typical","meaning":"showing all the characteristics that you would usually expect from a particular group of things:","examples":["Unlike a typical authoritative collection of papers which is common in more traditional areas of economics, this reader-friendly collection provides much food for thought.","I must look like the typical tourist with my shorts and my camera.","Typical symptoms would include severe headaches, vomiting and dizziness."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00619","kind":"word","word":"unassailable","meaning":"Unassailable means impossible to attack, defeat, or question.\nIt implies a position, argument, or reputation that is so strong, well-founded, or secure that it cannot be successfully challenged or undermined.","examples":["\"Her argument for the new policy was built on unassailable facts and logic, leaving no room for rebuttal.\" (Meaning it was impossible to argue against.)","\"Despite numerous attempts by his rivals, his reputation for honesty remained unassailable.\" (Meaning it could not be successfully damaged or questioned.)","\"It is an unassailable truth that all living things require water.\" (Meaning it's an undeniable and indisputable fact.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00620","kind":"word","word":"unbeknownst","meaning":"Unbeknownst (adverb) means without the knowledge of someone. It's a formal or literary word used to describe an event or a fact that is not known to a particular person.\n\nIt is often followed by the preposition \"to.\"","examples":["Unbeknownst to the students, the professor decided to cancel the course.","The president made the decision to overhaul the treaty, unbeknownst to the public."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00621","kind":"word","word":"under the guise of","meaning":"\"Under the guise of\" is an idiom that means \"under the pretense of\" or \"in the outward appearance of.\"","examples":["\"He visited the office under the guise of being a maintenance worker, but he was actually there to steal confidential files.\" (He pretended to be a maintenance worker to hide his real intention.)","\"The company's new policy was implemented under the guise of improving efficiency, but its real purpose was to cut costs and lay off staff.\"","\"The spy operated under the guise of being a simple tourist.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00622","kind":"word","word":"undercut","meaning":"To undercut means to weaken, damage, or undermine something, often by acting in a secret or indirect way. It can also refer to a physical action of cutting away the underside of an object or charging a lower price than a competitor.","examples":["\"He tried to appear confident, but his trembling hands undercut his professional image.\"","In commerce, to undercut is to sell goods or services at a lower price than your competitors to gain a market advantage.\n\nExample: \"The large retail chain was able to undercut the local mom-and-pop shops by buying in bulk.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00623","kind":"word","word":"undulate","meaning":"To undulate means to move with a smooth, wavelike motion. It describes a rising and falling movement, similar to the action of waves on the water or a snake moving through grass.","examples":["\"The fields of wheat undulated in the breeze.\"","\"The belly dancer's movements caused her hips to undulate rhythmically.\"","\"The road followed the undulating landscape of the hills.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00624","kind":"word","word":"univalent","meaning":"In chemistry, a univalent (or monovalent) element or ion has a valence of one. This means it can form only one chemical bond with another atom.","examples":["In math, a univalent function (also called an injective function) is a function that is \"one-to-one.\"","In biology, \"univalent\" refers to a chromosome that is not paired up with its partner during the process of meiosis (cell division)."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00625","kind":"word","word":"untoward","meaning":"Untoward (adjective) means unexpected and inappropriate or inconvenient; unruly or improper. It suggests something that is unfavorable, troublesome, or not conforming to proper conduct.","examples":["\"They encountered a few untoward delays on their journey.\" (Unexpected and inconvenient)","\"Despite the careful planning, some untoward complications arose during the experiment.\"","\"There was nothing untoward about their conversation, it was perfectly innocent.\" (Nothing improper or suspicious)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00626","kind":"word","word":"vanity","meaning":"Vanity is a noun that describes excessive pride in one’s own appearance, qualities, abilities, or achievements. It often carries a negative connotation, suggesting that the pride is shallow or that the person is overly concerned with how they are perceived by others.","examples":["\"Out of pure vanity, he refused to wear his glasses, even though he couldn't read the menu without them.\"","\"The philosopher spoke about the vanity of earthly riches, noting that you cannot take them with you when you die.\"","In modern business and publishing, \"vanity\" describes products or services created specifically to cater to someone’s ego rather than for merit or profit.\nVanity Press, Vanity Project, Vanity Plate"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00627","kind":"word","word":"vanquish","meaning":"to defeat an enemy or opponent, especially in war:","examples":["Napoleon was vanquished at the battle of Waterloo in 1815.","The vanquished army surrendered their weapons."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00628","kind":"word","word":"vast","meaning":"extremely big","examples":["The people who have taken our advice have saved themselves vast amounts/sums of money.","The amount of detail the book contains is vast.","The vast majority of our students – nearly 90 percent – graduate within four years."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00629","kind":"word","word":"vegetate","meaning":"To vegetate primarily means to live or spend a period of time in a passive, unthinking, or idle way, doing very little and showing little interest or effort.","examples":["After he retired, he spent most of his days just vegetating in front of the TV.","I didn't want to spend my entire vacation just vegetating on the couch; I wanted to explore.","Periods of illness can cause someone to vegetate, as their energy and motivation are low."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00630","kind":"word","word":"vehemently","meaning":"in a strong and emotional way:","examples":["The president has vehemently denied having an extra-marital affair.","The company's CEO vehemently denied all the accusations leveled against him."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00631","kind":"word","word":"vendor","meaning":"a company or person that sells a particular product:","examples":["They are the nation's leading vendor of organic dairy products.","The purchaser and vendor need to agree the details of the contract.","Our company deals with many vendors of women’s clothing."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00632","kind":"word","word":"venture","meaning":"to risk going somewhere or doing something that might be dangerous or unpleasant, or to risk saying something that might be criticized:","examples":["There are many joint ventures between American and Japanese companies.","She tentatively ventured the opinion that the project would be too expensive to complete, but the boss ignored her.","As we set off into the forest, we felt as though we were venturing (forth) into the unknown."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00633","kind":"word","word":"vernacular","meaning":"Vernacular refers to the everyday language or dialect spoken by the ordinary people in a particular country or region. It is the \"native\" way of speaking, as opposed to a formal, literary, or \"learned\" language (like Latin was in medieval Europe or as technical jargon is in specific professions today).\n\nBeyond language, it is also used in architecture and design to describe styles that use local materials and traditional methods.","examples":["This is the most common use. It distinguishes how people actually talk at home or on the street from the \"Standard\" or \"Official\" version of a language.\n\nExample: \"While the official language of the court was French, the peasants spoke in the local vernacular.\"","\"The author's use of Southern vernacular made the characters feel authentic and grounded.\"","Vernacular architecture refers to buildings built based on local needs, using local materials, and without the help of professional architects.\n\nExample: \"The thatched-roof cottages are a classic example of English vernacular architecture.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00634","kind":"word","word":"vertebrate","meaning":"having a spine (= back bone)","examples":["Birds, fish, and reptiles are all vertebrates.","However, in rodents and other vertebrates, postnatal cell loss may be more significant."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00635","kind":"word","word":"vertex","meaning":"(in mathematics) the point where two lines meet to form an angle, or the point that is opposite the base of a shape:","examples":["the vertex of a triangle/cone/pyramid","The algorithm may introduce multiple edges, and by a vertex's 'degree' we mean the number of distinct neighbours.","Let us first introduce the smallest cubic graphs, the only two on two vertices."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00636","kind":"word","word":"viable","meaning":"Viable generally means capable of working successfully; feasible. It suggests that something has the ability to survive, develop, or be put into practice with a good chance of success.","examples":["The scientists determined that the ancient seeds were still viable.","A premature baby is considered viable after a certain number of weeks of gestation.","The company needs to prove it's a viable enterprise to attract investors."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00637","kind":"word","word":"vignette","meaning":"a short piece of writing, music, acting, etc. that clearly expresses the typical characteristics of something or someone:","examples":["She wrote several vignettes of small-town life.","Each vignette is vividly contextualized, but a larger historical arc that would unify the profiles fails to emerge.","Short briefing papers called vignettes are produced on each of these topics to help inform the panels' discussions."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00638","kind":"word","word":"virtuous","meaning":"Virtuous (adjective) means having high moral standards; behaving in a morally good way. It describes a person, action, or life characterized by moral excellence, righteousness, and adherence to ethical principles.","examples":["\"She was a virtuous woman who dedicated her life to helping the poor.\"","\"His virtuous actions earned him the respect of the entire community.\"","\"In ancient philosophy, living a virtuous life was considered the path to happiness.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00639","kind":"word","word":"viscera","meaning":"Viscera is a plural noun that refers to the internal organs in the main cavities of the body, especially those in the abdomen (like the stomach, intestines, and liver).\n\nIn common speech, people often use the word \"guts.\" While it is a biological term, it is frequently used in literature and film to describe something gruesome or deeply internal.","examples":["\"The surgeon was careful not to damage the viscera during the emergency operation.\"","\"Visceral fat is the body fat that is stored within the abdominal cavity around several important internal organs.\"","Because the viscera are deep inside us, the word is used to describe feelings that are \"gut-level\"—instinctive rather than logical. A visceral reaction is one you feel in your body before you even have time to think about it.\n\nExample: \"He had a visceral dread of heights that made his stomach churn whenever he looked over a balcony.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00640","kind":"word","word":"vocation","meaning":"A vocation refers to a strong feeling of suitability for a particular career or occupation, often implying a sense of calling or purpose. It's more than just a job; it's work that one feels drawn to and finds deeply fulfilling.","examples":["\"She felt a true vocation for teaching, knowing it was what she was meant to do.\"","\"Many people search for years to find their true vocation.\"","\"Despite the challenges, her artistic vocation kept her creating new works.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00641","kind":"word","word":"vox","meaning":"\"Vox\" is a Latin word that means \"voice.\"\n\nIt's not commonly used as a standalone English word in everyday conversation, but you will encounter it frequently in specific contexts, where it retains its original Latin meaning.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00642","kind":"word","word":"vulgar","meaning":"Vulgar is an adjective with a split personality. Today, it almost always means something that is crude, offensive, or lacking in good taste (especially regarding bodily functions or sex).\n\nHowever, historically, it simply meant \"common\" or \"belonging to the ordinary people,\" stemming from the Latin word vulgus (the crowd/the masses).","examples":["A. Crude and Offensive (Modern Usage)\nThis is the most frequent way you will hear the word today. It describes language, jokes, or behavior that violates social standards of decency.\n\nExample: \"The comedian was asked to leave the stage after his jokes became too vulgar for the family-friendly audience.\"\n\nExample: \"It is considered vulgar to chew with your mouth open at a formal dinner.\"","B. Common or Unrefined (Historical/Literary Usage)\nIn history or linguistics, \"vulgar\" simply describes what the everyday masses did or spoke, as opposed to the wealthy elites or scholars.\n\nExample: \"Vulgar Latin was the everyday speech of the Roman people, which eventually evolved into French, Spanish, and Italian.\"\n\nExample: \"He had a very vulgar display of wealth, buying golden sports cars just to show off.\" (Here, it means tasteless and lacking class, rather than strictly offensive)."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00643","kind":"word","word":"washbasin","meaning":"A washbasin is a bowl-shaped plumbing fixture, typically fixed to a wall or supported by a pedestal, used for washing one's hands, face, and sometimes small items. It is commonly found in bathrooms, restrooms, and sometimes bedrooms or utility areas.","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00644","kind":"word","word":"wayward","meaning":"Wayward is an adjective used to describe someone or something that is difficult to control, unpredictable, or has turned away from the expected path.\n\nIt suggests a combination of being stubborn, rebellious, and a bit lost.","examples":["\"The school was designed to help wayward teenagers find their path back to education.\"","\"He was the wayward son of a wealthy family, spending his inheritance on reckless adventures.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00645","kind":"word","word":"wealth of material","meaning":"The phrase wealth of material refers to an abundant, rich, and extensive supply of information, resources, data, or inspiration available for a specific purpose.\n\nWhen you use the word \"wealth\" in this context, it has nothing to do with money. Instead, it means a \"great amount\" or a \"treasure trove\" of high-quality stuff to work with.","examples":["When the library declassified the Cold War documents, historians were thrilled to find a wealth of material to study.","The chaotic political election gave the late-night comedians a wealth of material for their irreverent opening monologues.","After seizing the company's servers, the investigators had a wealth of material to prove the fraud."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00646","kind":"word","word":"winning edge","meaning":"A. Sports and Athletics\nIn physical competition, the winning edge often refers to specialized training, superior mental focus, or a slight physical superiority (like better cardiovascular endurance) that allows an athlete to pull ahead in the final moments of a game.\n\nExample: \"The team's rigorous new stretching and recovery routine gave them the winning edge in the championship match.\"\n\nExample: \"At the Olympic level, sheer willpower is often the winning edge between gold and silver.\"","examples":["B. Business and Finance\nIn corporate strategy or investing, it refers to a competitive advantage—such as a proprietary technology, a highly efficient supply chain, or a unique algorithm—that allows a company or investor to consistently outperform the market.\n\nExample: \"The company's ability to analyze consumer data in real-time provided the winning edge over its slower retail competitors.\"\n\nExample: \"By keeping expense ratios incredibly low, the fund maintained a winning edge for its investors.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00647","kind":"word","word":"with regard to","meaning":"in connection with:","examples":["I am writing to you with regard to your letter of 15 March."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00648","kind":"word","word":"withhold","meaning":"To withhold means to hold back, keep back, or refrain from giving, granting, or revealing something. It implies an intentional act of not providing what is expected, requested, or due.","examples":["\"The government was accused of trying to withhold crucial information from the public.\"","\"The company decided to withhold his bonus until the project was completed.\"","\"Employers are required to withhold income tax from their employees' paychecks.\" (This is a common, often legally mandated, use.)"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00649","kind":"word","word":"Worldly","meaning":"worldly can describe someone who is experienced and sophisticated, or something that is focused on material possessions and earthly concerns rather than spiritual ones.","examples":["\"Many cultures have beliefs about both worldly and otherworldly realms.\"","\"His worldly wisdom allowed him to navigate complex business deals with ease.\"","\"He abandoned his worldly possessions to live a simple life.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00650","kind":"word","word":"wreaking havoc","meaning":"To wreak havoc means to cause a great amount of disorder, damage, or destruction.","examples":["\"The storm wreaked havoc on the coastal town.\"","\"The tornado wreaked havoc.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00651","kind":"word","word":"zeal","meaning":"great enthusiasm or eagerness:","examples":["In his zeal to get his work finished on time, he made a lot of mistakes.","In their zeal to protect the city against the new outbreak, the authorities targeted the unsanitary subjects they suspected of spreading the disease.","reforming/missionary/religious zeal"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00652","kind":"word","word":"abate","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00653","kind":"word","word":"abeyance","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00654","kind":"word","word":"abrasion","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00655","kind":"word","word":"absent minded","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00656","kind":"word","word":"absolute threshold","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00657","kind":"word","word":"absorption","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00658","kind":"word","word":"abstruce","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00659","kind":"word","word":"abundance","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00660","kind":"word","word":"acclaim","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00661","kind":"word","word":"accomplice","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00662","kind":"word","word":"according as","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00663","kind":"word","word":"accordingly","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00664","kind":"word","word":"accords","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"w00665","ki \" It is a formal or literary way of saying that one person is acting or being used instead of another.","examples":["\"Since the manager was unavailable, his assistant attended the meeting in his stead.\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"p00046","kind":"phrase","word":"asylum seekers","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"p00047","kind":"phrase","word":"call for","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"p00048","kind":"phrase","word":"in absolute terms","meaning":"If something is true or right in absolute terms, it is true or right when it is not considered in comparison to something else:","examples":["This is a massive figure, both in absolute terms and relative to the size of the economy."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"p00049","kind":"phrase","word":"someone's respects","meaning":"polite formal greetings:","examples":["Please convey my respects to your parents."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"p00050","kind":"phrase","word":"with respect to","meaning":"as regards; with reference to","examples":["\"the two groups were similar with respect to age, sex, and diagnoses\""],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"p00051","kind":"phrase","word":"with regard to","meaning":"referring to; concerning","examples":["With regard to the new contract, we have some questions"],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"p00052","kind":"phrase","word":"rest my case","meaning":"","examples":[],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"p00053","kind":"phrase","word":"in the light of","meaning":"because of something or as a result of something:","examples":["In light of problems we're having, we have no choice but to close the business."],"my_sentence":"","box":0,"due":null,"seen":0,"correct":0},{"id":"p00054"
