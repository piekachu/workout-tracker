<script id="seed-data-jp" type="application/json">{"version":1,"words":[],"phrases":[],"twisters":[]}</script>


<script>
// =========================================================================
// State
// =========================================================================
const STORE_KEY    = "vocab-desk-v2";
const LEGACY_EN_KEY = "loanword-desk-v1";
const LEGACY_JP_KEY = "kotoba-desk-v1";
const DAILY_BUDGET  = 10;   // review cards per day
const TRIAGE_BUDGET = 5;    // words to define per day
// Wider intervals: even Again gets 3 days, and box 5 caps at 2 months so
// mastered cards still surface — but never sooner than that.
const BOX_INTERVAL_DAYS = [0, 3, 7, 21, 45, 60];
const BOX_LABELS = ["Inbox", "3-day", "Weekly", "3-week", "6-week", "2-month"];

// Registry of the two corpora this desk holds. Each has its own seed <script>,
// its own progress, and its own streak — switching languages just repoints
// every view at a different slice of `state.langs`.
const LANGS = {
  en: { id: "en", label: "English",  short: "EN", seedId: "seed-data-en", hasTwisters: true,
        brand: "Loanword Desk", brandNative: "", tagline: "A study bench" },
  jp: { id: "jp", label: "日本語",    short: "JP", seedId: "seed-data-jp", hasTwisters: false,
        brand: "Kotoba Desk", brandNative: "言葉デスク", tagline: "Japanese study bench" },
};

function today() { return new Date().toISOString().slice(0, 10); }
function daysBetween(a, b) {
  const ms = new Date(b) - new Date(a);
  return Math.round(ms / 86400000);
}
function addDays(iso, n) {
  const d = new Date(iso);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function loadSeed(langId) {
  try { return JSON.parse(document.getElementById(LANGS[langId].seedId).textContent); }
  catch { return { words: [], phrases: [], twisters: [] }; }
}
// A brand-new per-language slice, seeded from that language's <script> payload.
function freshLangState(langId) {
  const seed = loadSeed(langId);
  return {
    words:    seed.words    || [],
    phrases:  seed.phrases  || [],
    twisters: seed.twisters || [],
    activity:        {},   // reviews per day  { "YYYY-MM-DD": count }
    triageActivity:  {},   // triages per day  { "YYYY-MM-DD": count }
    triageUnlocked:  {},   // days on which the user chose to go past budget
    streak:   0,
    lastDay:  null,
    twistersSeeded: false,
  };
}
// One-time migration from the old single-language stores (loanword-desk-v1 /
// kotoba-desk-v1) into this language's slice of the merged v2 store.
function migrateLegacy(legacyKey) {
  const raw = localStorage.getItem(legacyKey);
  if (!raw) return null;
  try {
    const old = JSON.parse(raw);
    return {
      words:    old.words    || [],
      phrases:  old.phrases  || [],
      twisters: old.twisters || [],
      activity:        old.activity        || {},
      triageActivity:  old.triageActivity  || {},
      triageUnlocked:  old.triageUnlocked  || {},
      streak:   old.streak  || 0,
      lastDay:  old.lastDay || null,
      twistersSeeded: old.twistersSeeded || false,
    };
  } catch { return null; }
}
function loadState() {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.langs) return parsed;
    } catch {}
  }
  // First run on the merged store — pull in whatever the old single-language
  // apps left behind, so nobody's progress or streak is lost by upgrading.
  const migratedEn = migrateLegacy(LEGACY_EN_KEY);
  const migratedJp = migrateLegacy(LEGACY_JP_KEY);
  return {
    version: 2,
    currentLang: "en",
    theme: null,          // null = system
    sync: { url: "", anonKey: "", slotId: "", lastSyncedAt: null, remoteUpdatedAt: null, status: "off" },
    langs: {
      en: migratedEn || freshLangState("en"),
      jp: migratedJp || freshLangState("jp"),
    },
  };
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast("Storage full — export a backup"); }
  scheduleSync();
}

let state = loadState();
// The corpus currently being studied. Every view reads/writes through this —
// switching languages just changes what L() points at.
function L() { return state.langs[state.currentLang]; }

// Starter twisters — a hand-picked set tuned for common English trouble spots:
// r/l, s/sh/th, consonant clusters, and long strings you can build up speed on.
// English-only; the Japanese corpus has no twister sub-tab.
const STARTER_TWISTERS = [
  "How much wood would a woodchuck chuck if a woodchuck could chuck wood? A woodchuck would chuck all the wood he could chuck if a woodchuck could chuck wood.",
  "The thirty-three thieves thought that they thrilled the throne throughout Thursday.",
  "She sells seashells by the seashore.",
  "Peter Piper picked a peck of pickled peppers. A peck of pickled peppers Peter Piper picked.",
  "Red lorry, yellow lorry, red lorry, yellow lorry.",
  "Betty Botter bought some butter, but she said the butter's bitter; if I put it in my batter, it will make my batter bitter.",
  "How can a clam cram in a clean cream can?",
  "Six sleek swans swam swiftly southwards.",
  "I saw Susie sitting in a shoe shine shop.",
  "The sixth sick sheikh's sixth sheep's sick.",
  "Fresh French fried fly fritters.",
  "A proper copper coffee pot.",
  "Truly rural, truly rural, truly rural.",
  "Which witch is which?",
  "Unique New York, unique New York, unique New York.",
  "Irish wristwatch, Swiss wristwatch.",
  "Around the rugged rocks the ragged rascal ran.",
  "Rubber baby buggy bumpers.",
  "Pad kid poured curd pulled cod.",
  "Toy boat, toy boat, toy boat.",
  "Lesser leather never weathered wetter weather better.",
  "The great Greek grape growers grow great Greek grapes.",
];
// Merge the starter set into a language's twister list exactly once — no
// re-adding if the user later deletes some, so their curation sticks.
function ensureLangReady(langId) {
  const lang = state.langs[langId];
  if (!lang || !LANGS[langId].hasTwisters || lang.twistersSeeded) return;
  lang.twisters = lang.twisters || [];
  const have = new Set(lang.twisters.map(t => t.toLowerCase().replace(/\s+/g, " ").trim()));
  for (const t of STARTER_TWISTERS) {
    const key = t.toLowerCase().replace(/\s+/g, " ").trim();
    if (!have.has(key)) { lang.twisters.push(t); have.add(key); }
  }
  lang.twistersSeeded = true;
  saveState();
}
ensureLangReady("en");
ensureLangReady("jp");

// Bump streak/activity when a review is graded
function markActivity() {
  const t = today();
  L().activity[t] = (L().activity[t] || 0) + 1;
  if (L().lastDay !== t) {
    if (L().lastDay && daysBetween(L().lastDay, t) === 1) L().streak += 1;
    else if (L().lastDay !== t) L().streak = 1;
    L().lastDay = t;
  }
  saveState();
}
// Bump the daily triage counter when a card is fully processed in triage.
function markTriageActivity() {
  const t = today();
  if (!L().triageActivity) L().triageActivity = {};
  L().triageActivity[t] = (L().triageActivity[t] || 0) + 1;
  saveState();
}
function triageBudgetToday() {
  const t = today();
  const extra = (L().triageUnlocked && L().triageUnlocked[t]) || 0;
  return TRIAGE_BUDGET + extra;
}
function triageDoneToday() {
  return (L().triageActivity && L().triageActivity[today()]) || 0;
}

// =========================================================================
// Selection helpers
// =========================================================================
function allCards() { return L().words.concat(L().phrases); }
function dueCards(pool) {
  const t = today();
  return pool.filter(c => hasAnyMeaning(c) && c.box >= 1 && c.due && c.due <= t);
}
function newlyFilled(pool) {
  return pool.filter(c => hasAnyMeaning(c) && (c.box === 0 || !c.box));
}
// Per-session random scores keyed by card id — the map resets on every page
// reload, so each visit gives a fresh shuffle, but stays stable within a
// session so grading a card doesn't scramble the order behind you.
const _reviewScores = new Map();
function _reviewScore(c) {
  if (!_reviewScores.has(c.id)) _reviewScores.set(c.id, Math.random());
  return _reviewScores.get(c.id);
}
function todaysQueue() {
  const pool = allCards();
  // Due cards still take priority over fresh ones, but within each tier we
  // shuffle so the order feels mixed instead of alphabetical / by-due-date.
  const due   = dueCards(pool).sort((a, b) => _reviewScore(a) - _reviewScore(b));
  const fresh = newlyFilled(pool).sort((a, b) => _reviewScore(a) - _reviewScore(b));
  const queue = [];
  for (const c of due)   { if (queue.length >= DAILY_BUDGET) break; queue.push(c); }
  for (const c of fresh) { if (queue.length >= DAILY_BUDGET) break; queue.push(c); }
  return queue;
}
// FNV-1a hash — small, deterministic, no deps
function dayHash(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// Session-scoped set of skipped card ids. Cleared on reload — a skip only
// pushes a card out of *this* sitting, not out of the day.
const _triageSkipped = new Set();

// Full unfilled list from both words and phrases — used for accurate counts.
function triageBacklog() {
  return allCards().filter(c => !hasAnyMeaning(c));
}
// Today's working queue: same list, shuffled deterministically by date+id,
// with session-skipped cards removed. Same seed all day → order stays stable
// if you refresh, but every day serves a fresh mix. Words and phrases are
// interleaved so you get whichever is next in the shuffle.
function triageQueue() {
  const t = today();
  return triageBacklog()
    .filter(c => !_triageSkipped.has(c.id))
    .map(c => ({ c, score: dayHash(t + "|" + (c.id || c.word)) }))
    .sort((a, b) => a.score - b.score)
    .map(x => x.c);
}
function stats() {
  const pool = allCards();
  const boxCounts = [0,0,0,0,0,0];
  let backlog = 0, filled = 0;
  for (const c of pool) {
    boxCounts[c.box || 0]++;
    if (!hasAnyMeaning(c)) backlog++; else filled++;
  }
  return {
    total: pool.length,
    filled, backlog,
    boxCounts,
    dueToday: dueCards(pool).length,
    mastered: boxCounts[5],
  };
}

// =========================================================================
// Grading (Leitner)
// =========================================================================
function grade(card, g) {
  card.seen = (card.seen || 0) + 1;
  const box = card.box || 0;
  let next = box, interval;
  switch (g) {
    // Again → back to daily rotation
    case "again": next = 1; interval = BOX_INTERVAL_DAYS[1]; break;
    // Hard → hold at current box, come back on the same rhythm (no halving penalty)
    case "hard":  next = Math.max(1, box); interval = BOX_INTERVAL_DAYS[next]; break;
    // Good → +1 box
    case "good":  next = Math.min(5, Math.max(1, box) + 1); interval = BOX_INTERVAL_DAYS[next]; card.correct = (card.correct||0) + 1; break;
    // Easy → +2 boxes
    case "easy":  next = Math.min(5, Math.max(1, box) + 2); interval = BOX_INTERVAL_DAYS[next]; card.correct = (card.correct||0) + 1; break;
  }
  card.box = next;
  card.due = addDays(today(), interval);
  markActivity();
  saveState();
}

// =========================================================================
// Render helpers
// =========================================================================
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    n.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
  }
  return n;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("on"), 1800);
}

// =========================================================================
// Views
// =========================================================================
const stage = document.getElementById("stage");
let currentMode = "daily";
let reviewIdx = 0;
let reviewQueue = [];
let reviewFlipped = false;
let reviewEditing = false;   // sense editor visible on the review card
let reviewDraft   = "";      // uncommitted new sentence for the current card

function render() {
  updateCounts();
  clear(stage);
  const v = views[currentMode] || views.daily;
  v();
}

const views = {};

// -------- Today's review --------
views.today = () => {
  reviewQueue = todaysQueue();
  if (reviewIdx >= reviewQueue.length) reviewIdx = 0;

  if (reviewQueue.length === 0) {
    const done = stats().dueToday === 0;
    stage.appendChild(el("p", {class:"lede"},
      done ? "Nothing due today. Add a few meanings in New words and they'll enter the queue tomorrow."
           : "Your queue is empty."));
    stage.appendChild(el("div", {class:"empty-state"},
      el("h2", {}, done ? "Desk clear" : "Nothing to review"),
      el("p", {}, "Ten cards a day is the whole system. Come back tomorrow, or add more meanings now.")
    ));
    return;
  }

  const total = reviewQueue.length;
  stage.appendChild(el("p", {class:"lede"},
    `Card ${reviewIdx + 1} of ${total} · budget ${DAILY_BUDGET}/day · space to flip, 1–4 to grade`));

  const card = reviewQueue[reviewIdx];
  const cardEl = el("article", {class:"card"});

  const wordCol = el("div", {},
    el("div", {class:"headword"}, card.word));
  // Reading (rōmaji) is part of the quiz for languages that have one —
  // hidden until flip. English cards simply have no `reading`, so this
  // never renders for them.
  if (card.reading && reviewFlipped) {
    wordCol.appendChild(el("div", {class:"reading"}, card.reading));
  }
  cardEl.appendChild(el("div", {class:"head"},
    wordCol,
    el("div", {class:"kind-badge"}, card.kind)
  ));

  // Meaning + examples (hidden until flip). Renders all senses, or a live
  // sense editor when the user has toggled "Edit meanings".
  if (!reviewFlipped) {
    const mb = el("div", {class:"meaning-block empty"},
      el("div", {class:"label"}, "Meaning"),
      el("div", {class:"body"}, "— tap flip to reveal —")
    );
    cardEl.appendChild(mb);
  } else if (reviewEditing) {
    cardEl.appendChild(el("div", {class:"label",
      style:"font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px;"},
      "Editing meanings"));
    const workingSenses = getSenses(card);
    if (workingSenses.length === 0) workingSenses.push({pos:"", def:"", examples:[""]});
    const editor = senseEditor(workingSenses, () => {
      setSenses(card, workingSenses);
      saveState();
    });
    cardEl.appendChild(editor);
    const done = el("button", {class:"edit-toggle", "aria-pressed":"true",
      onclick: () => { reviewEditing = false; render(); }}, "Done editing");
    cardEl.appendChild(done);
  } else {
    const senses = getSenses(card);
    cardEl.appendChild(el("div", {class:"label",
      style:"font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px;"},
      senses.length > 1 ? `Meanings · ${senses.length}` : "Meaning"));
    const sv = el("div", {class:"senses-view"});
    senses.forEach((s, i) => {
      const body = el("div", {class:"body"});
      if (s.pos) body.appendChild(el("div", {class:"pos"}, s.pos));
      body.appendChild(el("div", {class:"def"}, s.def || "—"));
      if (s.examples && s.examples.length) {
        const exs = el("div", {class:"exs"});
        for (const e of s.examples) exs.appendChild(el("div", {class:"ex"}, e));
        body.appendChild(exs);
      }
      sv.appendChild(el("div", {class:"s"},
        el("div", {class:"num"}, String(i + 1)),
        body
      ));
    });
    cardEl.appendChild(sv);
    const editBtn = el("button", {class:"edit-toggle", "aria-pressed":"false",
      onclick: () => { reviewEditing = true; render(); }}, "✎ Edit meanings");
    cardEl.appendChild(editBtn);
  }

  // Sentence history + fresh input for today (only after flip)
  if (reviewFlipped) {
    const hist = getMySentences(card);
    if (hist.length) {
      cardEl.appendChild(el("div", {class:"label",
        style:"font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;"},
        `Your sentences · ${hist.length}`));
      const listEl = el("div", {class:"my-history"});
      hist.forEach(entry => {
        listEl.appendChild(el("div", {class:"entry"},
          el("div", {class:"date"}, entry.date || "—"),
          el("div", {class:"text"}, entry.text),
          el("span", {}) // spacer keeps grid columns aligned
        ));
      });
      cardEl.appendChild(listEl);
    }
    const well = el("div", {class:"my-well"});
    well.appendChild(el("div", {class:"label"},
      hist.length ? "New sentence for today" : "Your sentence",
      el("span", {style: "color: var(--faint); letter-spacing: 0; text-transform: none; font-style: italic;"},
        "saved when you grade")
    ));
    const ta = el("textarea", {
      placeholder: "Speak it out, then type what you said…",
      rows: 2,
    });
    ta.value = reviewDraft;
    ta.addEventListener("input", () => { reviewDraft = ta.value; });
    well.appendChild(ta);
    cardEl.appendChild(well);
  }

  // Foot meta (box dots)
  const dots = el("span", {class:"box-dots"});
  for (let i = 1; i <= 5; i++) dots.appendChild(el("span", {class: "dot" + (i <= card.box ? " on" : "")}));
  cardEl.appendChild(el("div", {class:"foot-meta"},
    el("span", {}, `Box ${card.box || 0} · seen ${card.seen || 0} · ${card.correct || 0} correct`),
    dots
  ));

  stage.appendChild(cardEl);

  // Controls
  if (!reviewFlipped) {
    const flip = el("button", {class:"flip-btn", onclick: () => { reviewFlipped = true; render(); }},
      "Flip — reveal");
    stage.appendChild(flip);
  } else {
    const controls = el("div", {class:"rev-controls"});
    const mk = (g, label, cls, key) => {
      const b = el("button", {class: cls, onclick: () => gradeAndAdvance(g)});
      b.appendChild(el("div", {class:"key"}, key));
      b.appendChild(el("div", {class:"grade"}, label));
      return b;
    };
    controls.appendChild(mk("again", "Again", "again", "1"));
    controls.appendChild(mk("hard",  "Hard",  "hard",  "2"));
    controls.appendChild(mk("good",  "Good",  "good",  "3"));
    controls.appendChild(mk("easy",  "Easy",  "easy",  "4"));
    stage.appendChild(controls);
  }
};

function gradeAndAdvance(g) {
  const card = reviewQueue[reviewIdx];
  if (!card) return;
  // Commit the fresh sentence draft (if any) as a dated history entry
  if (appendMySentence(card, reviewDraft)) saveState();
  reviewDraft = "";
  grade(card, g);
  reviewFlipped = false;
  reviewEditing = false;
  reviewIdx += 1;
  // rebuild queue after each grade so cards graded "again" reappear
  reviewQueue = todaysQueue();
  if (reviewIdx >= reviewQueue.length) reviewIdx = reviewQueue.length; // triggers done state
  render();
}

// -------- Sense helpers (multi-meaning support) --------
// Cards may carry either the legacy shape (meaning: string, examples: string[])
// or the new shape (senses: [{pos, def, examples: string[]}]).
// getSenses normalises for readers; setSenses writes both shapes for compat.
function getSenses(card) {
  if (Array.isArray(card.senses) && card.senses.length) {
    return card.senses.map(s => ({
      pos: (s.pos || "").trim(),
      def: (s.def || "").trim(),
      examples: (s.examples || []).map(e => (e || "").trim()).filter(Boolean),
    }));
  }
  if ((card.meaning || "").trim()) {
    return [{
      pos: "",
      def: (card.meaning || "").trim(),
      examples: (card.examples || []).map(e => (e || "").trim()).filter(Boolean),
    }];
  }
  return [];
}
function setSenses(card, senses) {
  // strip empty senses
  const clean = (senses || [])
    .map(s => ({
      pos: (s.pos || "").trim(),
      def: (s.def || "").trim(),
      examples: (s.examples || []).map(e => (e || "").trim()).filter(Boolean),
    }))
    .filter(s => s.def || s.examples.length);
  card.senses = clean;
  // mirror the first sense into legacy fields so exports/imports still work
  if (clean.length) {
    card.meaning  = clean[0].def;
    card.examples = clean.flatMap(s => s.examples);
  } else {
    card.meaning  = "";
    card.examples = [];
  }
}
function hasAnyMeaning(card) {
  return getSenses(card).some(s => s.def);
}

// -------- Sentence-history helpers --------
// Cards started life with `my_sentence: string`; they now carry
// `my_sentences: [{text, date}]`. getMySentences migrates on read; the writers
// keep my_sentence in sync with the newest entry so exports still work.
function getMySentences(card) {
  if (Array.isArray(card.my_sentences)) return card.my_sentences;
  if ((card.my_sentence || "").trim()) {
    return [{ text: card.my_sentence.trim(), date: null }];
  }
  return [];
}
function setMySentences(card, list) {
  card.my_sentences = (list || []).map(s => ({
    text: (s.text || "").trim(),
    date: s.date || null,
  })).filter(s => s.text);
  card.my_sentence = card.my_sentences.length
    ? card.my_sentences[card.my_sentences.length - 1].text
    : "";
}
// Append a fresh sentence for today, unless it's identical to the newest entry.
function appendMySentence(card, text) {
  const t = (text || "").trim();
  if (!t) return false;
  const list = getMySentences(card);
  if (list.length && list[list.length - 1].text === t) return false;
  list.push({ text: t, date: today() });
  setMySentences(card, list);
  return true;
}

// -------- Rename & dedupe helpers --------
// Case-insensitive, whitespace-normalised match within one pool.
function normWord(w) { return (w || "").trim().replace(/\s+/g, " ").toLowerCase(); }
function findCardByWord(word, kind) {
  const pool = kind === "phrase" ? L().phrases : L().words;
  const key = normWord(word);
  if (!key) return null;
  return pool.find(c => normWord(c.word) === key) || null;
}
// Rename result: {ok:true} | {ok:false, reason:"empty"} | {ok:false, reason:"duplicate", other}
function renameCard(card, newWord) {
  const trimmed = (newWord || "").trim().replace(/\s+/g, " ");
  if (!trimmed) return { ok: false, reason: "empty" };
  if (trimmed === card.word) return { ok: true };
  // Same word ignoring case → just update the display casing.
  if (normWord(trimmed) === normWord(card.word)) {
    card.word = trimmed; saveState(); return { ok: true };
  }
  const other = findCardByWord(trimmed, card.kind);
  if (other && other !== card) return { ok: false, reason: "duplicate", other };
  card.word = trimmed;
  saveState();
  return { ok: true };
}

// Builds a `.head` element containing the headword, a rename pencil, and the
// kind badge. Click the pencil to swap the word for an inline input; Enter
// commits (with dedupe), Esc cancels, blur commits.
function makeEditableHead(card, opts = {}) {
  const head = el("div", {class: "head"});
  const left = el("div", {style: "display:flex; flex-direction:column; flex:1; min-width:0;"});
  const wordRow = el("div", {style: "display:flex; align-items:baseline; gap:10px; min-width:0;"});
  const wordEl = el("div", {class: "headword"}, card.word);
  const editBtn = el("button", {
    class: "icon-btn",
    style: "font-size:14px; padding:2px 8px; color:var(--faint); align-self:center;",
    title: "Rename",
  }, "✎");
  wordRow.appendChild(wordEl);
  wordRow.appendChild(editBtn);
  left.appendChild(wordRow);

  // Rōmaji reading line — editable inline. Only meaningful for languages
  // that use one (Japanese); harmless empty field otherwise.
  const readingEl = el("input", {
    class: "reading",
    type: "text",
    placeholder: "reading (optional)",
    style: "border:0; background:transparent; padding:2px 0; outline:none; width:100%;",
  });
  readingEl.value = card.reading || "";
  readingEl.addEventListener("input", () => {
    card.reading = readingEl.value;
    saveState();
  });
  left.appendChild(readingEl);

  head.appendChild(left);
  head.appendChild(el("div", {class: "kind-badge"}, card.kind));

  editBtn.onclick = () => startEdit();

  function startEdit() {
    const displayFont = state.currentLang === "jp" ? "var(--jp-serif)" : "var(--serif)";
    const input = el("input", {
      type: "text",
      style: `font-family: ${displayFont}; font-weight: 400; ` +
             "font-size: clamp(30px, 4.6vw, 52px); line-height: 1.05; " +
             "letter-spacing: -0.012em; " +
             "border: 0; background: transparent; color: var(--ink); " +
             "outline: none; border-bottom: 2px dashed var(--rule); " +
             "padding: 0 2px 4px; width: 100%; min-width: 0;",
    });
    input.value = card.word;
    wordRow.replaceChild(input, wordEl);
    editBtn.style.display = "none";
    setTimeout(() => { input.focus(); input.select(); }, 0);

    let done = false;
    function commit() {
      if (done) return; done = true;
      const r = renameCard(card, input.value);
      if (r.ok) {
        wordEl.textContent = card.word;
        wordRow.replaceChild(wordEl, input);
        editBtn.style.display = "";
        if (input.value.trim() !== card.word) toast(`Renamed to "${card.word}"`);
        else if (input.value !== card.word) toast(`Casing updated to "${card.word}"`);
        if (opts.onRenamed) opts.onRenamed();
      } else if (r.reason === "empty") {
        done = false;
        toast("Word can't be empty");
        input.focus();
      } else if (r.reason === "duplicate") {
        done = false;
        const jump = confirm(`"${input.value.trim()}" already exists in your ${card.kind === "phrase" ? "phrases" : "words"}.\n\nOpen the existing card instead? (This card will not be renamed.)`);
        if (jump) {
          // Restore the input state so navigation doesn't leave a stale DOM
          wordRow.replaceChild(wordEl, input);
          editBtn.style.display = "";
          openCard(r.other);
        } else {
          input.focus();
          input.select();
        }
      }
    }
    function cancel() {
      if (done) return; done = true;
      wordRow.replaceChild(wordEl, input);
      editBtn.style.display = "";
    }
    input.onblur = commit;
    input.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); commit(); }
      else if (e.key === "Escape") { e.preventDefault(); cancel(); }
    };
  }

  return head;
}

// Reusable sense-editor component. Takes a live senses array; mutates in place;
// invokes onChange after every edit so the caller can save & re-render.
function senseEditor(senses, onChange) {
  const wrap = el("div", {style:"display:flex; flex-direction:column; gap:12px;"});

  function draw() {
    clear(wrap);
    senses.forEach((sense, i) => {
      const box = el("div", {class:"sense-editor"});

      // head
      const head = el("div", {class:"sense-head"});
      const nWrap = el("span", {class:"n"},
        el("span", {class:"num"}, String(i + 1)),
        el("span", {}, "Meaning")
      );
      const posIn = el("input", {class:"pos-in", type:"text", placeholder:"pos (n., v., adj.)"});
      posIn.value = sense.pos || "";
      posIn.oninput = () => { sense.pos = posIn.value; onChange && onChange(); };

      const controls = el("span", {style:"display:inline-flex; gap:8px; align-items:center;"});
      controls.appendChild(posIn);
      if (senses.length > 1) {
        const del = el("button", {class:"del-sense", title:"Remove this meaning",
          onclick: () => { senses.splice(i, 1); draw(); onChange && onChange(); }}, "× remove");
        controls.appendChild(del);
      }
      head.appendChild(nWrap);
      head.appendChild(controls);
      box.appendChild(head);

      // definition
      const defTa = el("textarea", {class:"def-ta",
        placeholder: "The definition for this sense — one line, dictionary-tight."});
      defTa.value = sense.def || "";
      defTa.oninput = () => { sense.def = defTa.value; onChange && onChange(); };
      defTa.onkeydown = (e) => {
        // Ctrl/Cmd+Enter adds another example, Alt+Enter adds another sense
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
          e.preventDefault();
          sense.examples = sense.examples || [];
          sense.examples.push("");
          draw();
          onChange && onChange();
        }
      };
      box.appendChild(defTa);

      // examples
      const exList = el("div", {class:"ex-list"});
      const exs = sense.examples && sense.examples.length ? sense.examples : [""];
      sense.examples = exs;
      exs.forEach((exVal, j) => {
        const row = el("div", {class:"ex-row"});
        const inp = el("input", {type:"text",
          placeholder: j === 0 ? "One sentence you'd hear or say." : "Another example…"});
        inp.value = exVal || "";
        inp.oninput = () => { sense.examples[j] = inp.value; onChange && onChange(); };
        inp.onkeydown = (e) => {
          if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            // if last row and non-empty, add another
            if (j === sense.examples.length - 1 && inp.value.trim()) {
              sense.examples.push("");
              draw();
              onChange && onChange();
              // focus new input
              setTimeout(() => {
                const inputs = wrap.querySelectorAll(".sense-editor .ex-row input");
                if (inputs.length) inputs[inputs.length - 1].focus();
              }, 0);
            }
          }
        };
        row.appendChild(inp);
        if (sense.examples.length > 1) {
          const rm = el("button", {class:"icon-btn", title:"Remove example",
            onclick: () => { sense.examples.splice(j, 1); draw(); onChange && onChange(); }}, "×");
          row.appendChild(rm);
        } else {
          row.appendChild(el("span", {})); // spacer
        }
        exList.appendChild(row);
      });
      const addEx = el("button", {class:"add-inline",
        onclick: () => { sense.examples.push(""); draw(); onChange && onChange(); }},
        "+ example");
      exList.appendChild(addEx);
      box.appendChild(exList);

      wrap.appendChild(box);
    });

    // Add-sense button
    const addSense = el("button", {class:"add-sense",
      onclick: () => { senses.push({pos:"", def:"", examples:[""]}); draw(); onChange && onChange(); }},
      "+ Add another meaning");
    wrap.appendChild(addSense);
  }
  draw();
  return wrap;
}

// -------- New words (was Triage) --------
// Sub-view of Daily. Words and phrases mixed into a single random queue.
views.triage = () => {
  const backlogAll = triageBacklog();
  const q = triageQueue();
  const done = triageDoneToday();
  const budget = triageBudgetToday();
  const remaining = Math.max(0, budget - done);

  stage.appendChild(el("p", {class:"lede"},
    `${done} of ${budget} defined today · ${backlogAll.length} still in the inbox · picked at random from words and phrases combined.`));

  if (backlogAll.length === 0) {
    stage.appendChild(el("div", {class:"empty-state"},
      el("h2", {}, "Inbox empty"),
      el("p", {}, "No unfilled entries. Add new ones from Data & backup, or Import.")
    ));
    return;
  }
  // Skipped everything in this session — offer to bring them back
  if (q.length === 0) {
    stage.appendChild(el("div", {class:"empty-state"},
      el("h2", {}, "All skipped this session"),
      el("p", {}, `You've skipped every remaining card in this sitting (${backlogAll.length} still unfilled). Bring them back to try again.`)
    ));
    const row = el("div", {style:"display:flex; gap:8px; justify-content:center; margin-top:16px;"});
    row.appendChild(el("button", {class:"btn primary",
      onclick: () => { _triageSkipped.clear(); render(); }}, "Bring skipped back"));
    stage.appendChild(row);
    return;
  }

  // Daily budget gate — same shape as Today's review
  if (remaining === 0) {
    stage.appendChild(el("div", {class:"empty-state"},
      el("h2", {}, "Done with today's batch"),
      el("p", {}, `You've defined ${done} ${done === 1 ? "word" : "words"} today. The rest can wait — small daily doses beat marathon sessions for actually remembering.`)
    ));
    const row = el("div", {style:"display:flex; gap:8px; justify-content:center; margin-top:16px;"});
    row.appendChild(el("button", {class:"btn primary", onclick: () => {
      const t = today();
      if (!L().triageUnlocked) L().triageUnlocked = {};
      L().triageUnlocked[t] = (L().triageUnlocked[t] || 0) + TRIAGE_BUDGET;
      saveState(); toast(`+${TRIAGE_BUDGET} more added`); render();
    }}, `+${TRIAGE_BUDGET} more`));
    row.appendChild(el("button", {class:"link-btn", style:"padding:9px 14px;",
      onclick: () => { dailySubMode = "review"; render(); }}, "Go to review →"));
    stage.appendChild(row);
    return;
  }

  const card = q[0];
  // Sub-lede shows the current position in today's batch
  stage.appendChild(el("p", {style:"font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.08em; margin:0 0 14px;"},
    `Card ${done + 1} of ${budget} for today · ${remaining} remaining in this batch`));

  const cardEl = el("article", {class:"card triage-card"});
  cardEl.appendChild(makeEditableHead(card, { onRenamed: () => render() }));

  // Working copy of senses (edited in place, committed on save)
  const workingSenses = getSenses(card);
  if (workingSenses.length === 0) workingSenses.push({pos:"", def:"", examples:[""]});

  const form = el("div", {class:"triage-form"});
  const editor = senseEditor(workingSenses, () => { /* no-op; commit on save */ });
  form.appendChild(editor);

  const actions = el("div", {class:"triage-actions"});
  const saveBtn = el("button", {class:"btn primary", onclick: () => save()}, "Save & next");
  const skipBtn = el("button", {class:"btn ghost", onclick: () => { moveToBack(); render(); }}, "Skip");
  const delBtn  = el("button", {class:"btn ghost warn", onclick: () => { removeCard(card); render(); }}, "Delete");
  actions.appendChild(saveBtn); actions.appendChild(skipBtn); actions.appendChild(delBtn);
  form.appendChild(actions);
  form.appendChild(el("div", {class:"triage-hint"},
    "⌘/Ctrl + S save & next  ·  ⌘/Ctrl + ⏎ new example  ·  ⏎ (in example) add another  ·  Esc skip"));

  cardEl.appendChild(form);
  stage.appendChild(cardEl);

  // Focus the first empty definition field
  setTimeout(() => {
    const defs = cardEl.querySelectorAll(".def-ta");
    for (const t of defs) { if (!t.value) { t.focus(); return; } }
    if (defs[0]) defs[0].focus();
  }, 0);

  function save() {
    setSenses(card, workingSenses);
    if (hasAnyMeaning(card)) {
      if ((card.box || 0) === 0) {
        card.box = 1;
        card.due = today(); // ready for today's queue
      }
      markTriageActivity();   // counts against the daily triage budget
    }
    saveState();
    toast(`Saved "${card.word}" · ${triageDoneToday()}/${triageBudgetToday()} today`);
    render();
  }
  function moveToBack() {
    // Session-scoped skip — the card returns tomorrow (new shuffle seed) or
    // on reload, and can be brought back manually via the empty-state button.
    _triageSkipped.add(card.id);
  }

  // Global key handling for the triage screen (works from any field)
  cardEl.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
      e.preventDefault(); save();
    } else if (e.key === "Escape") {
      e.preventDefault(); moveToBack(); render();
    }
  });
};

function removeCard(card) {
  ["words", "phrases"].forEach(k => {
    const i = L()[k].indexOf(card);
    if (i >= 0) L()[k].splice(i, 1);
  });
  saveState();
  toast("Deleted");
}

views.phrases = () => {

// -------- Library --------
let libSearch = "", libFilter = "all", libKind = "all";
views.library = () => {
  renderLibrary({title: "Library", lede: "Every card you've collected. Click any row to open it."});
};
function renderLibrary(opts = {}) {
  const kindFilter = opts.kindFilter || libKind;
  stage.appendChild(el("div", {class:"eyebrow"}, "All cards"));
  stage.appendChild(el("h1", {class:"page"}, opts.title || "Library"));
  if (opts.lede) stage.appendChild(el("p", {class:"lede"}, opts.lede));

  const controls = el("div", {class:"lib-controls"});
  const search = el("input", {class:"search", type:"search", placeholder:"Search word or meaning…"});
  search.value = libSearch;
  search.oninput = () => { libSearch = search.value; rerender(); };
  controls.appendChild(search);

  const mkChip = (val, label) => {
    const c = el("button", {class:"filter-chip", "aria-pressed": libFilter===val,
      onclick: () => { libFilter = val; rerender(); }}, label);
    return c;
  };
  controls.appendChild(mkChip("all", "All"));
  controls.appendChild(mkChip("due", "Due"));
  controls.appendChild(mkChip("learning", "Learning"));
  controls.appendChild(mkChip("known", "Known"));
  controls.appendChild(mkChip("backlog", "No meaning"));
  stage.appendChild(controls);

  const wrap = el("div", {class:"lib-wrap"});
  const table = el("table", {class:"lib-table"});
  table.appendChild(el("thead", {}, el("tr", {},
    el("th", {}, "Word"),
    el("th", {}, "Meaning"),
    el("th", {}, "State"),
    el("th", {}, "Box"),
    el("th", {}, "Due"),
  )));
  const tbody = el("tbody");
  table.appendChild(tbody);
  wrap.appendChild(table);
  stage.appendChild(wrap);

  function rerender() { views[currentMode](); }

  const t = today();
  const source = kindFilter === "phrase" ? L().phrases
               : kindFilter === "word"   ? L().words
               : allCards();
  const q = libSearch.trim().toLowerCase();
  const rows = source.filter(c => {
    if (q) {
      const senseText = getSenses(c).map(s => s.def).join(" ").toLowerCase();
      const reading = (c.reading || "").toLowerCase();
      if (!(c.word.toLowerCase().includes(q) || reading.includes(q) || senseText.includes(q))) return false;
    }
    const hasM = hasAnyMeaning(c);
    switch (libFilter) {
      case "due":      return hasM && c.due && c.due <= t && (c.box || 0) >= 1;
      case "learning": return hasM && (c.box || 0) >= 1 && (c.box || 0) <= 3;
      case "known":    return hasM && (c.box || 0) >= 4;
      case "backlog":  return !hasM;
      default:         return true;
    }
  }).slice(0, 300);

  if (rows.length === 0) {
    tbody.appendChild(el("tr", {}, el("td", {colspan: 5,
      style:"text-align:center; padding: 40px; color: var(--muted);"}, "No matches.")));

      const label = {new:"New", known:"Known", due:"Due", learning:"Learning"}[state_];
      const senses = getSenses(c);
      let meaningTxt = "";
      if (senses.length) {
        const first = (senses[0].def || "").split("\n")[0];
        meaningTxt = first.slice(0, 160) + (first.length > 160 ? "…" : "");
        if (senses.length > 1) meaningTxt += `  +${senses.length - 1}`;
      }
      const wordCell = el("td", {class:"word"});
      wordCell.appendChild(el("div", {}, c.word));
      if (c.reading) wordCell.appendChild(el("div", {
        style:"font-family:var(--serif); font-style:italic; font-size:12px; color:var(--muted); margin-top:2px;"
      }, c.reading));
      const tr = el("tr", {onclick: () => openCard(c)},
        wordCell,
        el("td", {class:"meaning"}, meaningTxt || el("span", {style:"color: var(--faint); font-style: italic;"}, "—")),
        el("td", {}, el("span", {class: "pill " + state_}, label)),
        el("td", {class:"meta"}, String(c.box || 0)),
        el("td", {class:"meta"}, c.due || "—"),
      );
      tbody.appendChild(tr);
    }
    if (source.length > 300) {
      stage.appendChild(el("p", {style:"color: var(--muted); font-family: var(--mono); font-size: 11px; margin-top: 12px;"},
        `Showing 300 of ${source.length}. Refine with search.`));
    }
  }
}

// Converts ASCII romaji runs to hiragana or katakana as you type; anything

  ["ta","た","タ"], ["chi","ち","チ"], ["ti","ち","チ"], ["tsu","つ","ツ"], ["tu","つ","ツ"], ["te","て","テ"], ["to","と","ト"],
  ["cha","ちゃ","チャ"], ["chu","ちゅ","チュ"], ["cho","ちょ","チョ"],
  ["tya","ちゃ","チャ"], ["tyu","ちゅ","チュ"], ["tyo","ちょ","チョ"],
  ["da","だ","ダ"], ["di","ぢ","ヂ"], ["du","づ","ヅ"], ["de","で","デ"], ["do","ど","ド"],
  ["na","な","ナ"], ["ni","に","ニ"], ["nu","ぬ","ヌ"], ["ne","ね","ネ"], ["no","の","ノ"],
  ["nya","にゃ","ニャ"], ["nyu","にゅ","ニュ"], ["nyo","にょ","ニョ"],
  ["ha","は","ハ"], ["hi","ひ","ヒ"], ["fu","ふ","フ"], ["hu","ふ","フ"], ["he","へ","ヘ"], ["ho","ほ","ホ"],
  ["hya","ひゃ","ヒャ"], ["hyu","ひゅ","ヒュ"], ["hyo","ひょ","ヒョ"],
  ["ba","ば","バ"], ["bi","び","ビ"], ["bu","ぶ","ブ"], ["be","べ","ベ"], ["bo","ぼ","ボ"],

  ["pa","ぱ","パ"], ["pi","ぴ","ピ"], ["pu","ぷ","プ"], ["pe","ぺ","ペ"], ["po","ぽ","ポ"],

function buildKanaMaps() {
  const m3 = new Map(), m2 = new Map(), m1 = new Map();
  for (const [r, h, k] of KANA_TABLE) {
    (r.length === 3 ? m3 : r.length === 2 ? m2 : m1).set(r, [h, k]);
  }
  return { m3, m2, m1 };
}
const KANA_MAPS = buildKanaMaps();
// Consonants that double into a small tsu (っ/ッ) — 'n' is excluded since
// doubled n has its own rule (nn → ん) handled separately below.
const TSU_CONSONANTS = new Set("bcdfghjkmpqrstvwxyz".split(""));

function romajiToKana(input, mode) {
  if (!input) return input;
  const kata = mode === "kata";
  const smallTsu = kata ? "ッ" : "っ";
  const nKana = kata ? "ン" : "ん";
  let out = "";
  let lastVowel = null; // trailing vowel of the last emitted mora — used
                         // only in katakana mode to merge repeats into ー
  let i = 0;
  while (i < input.length) {
    const c = input[i];
    if (!/[a-z']/i.test(c)) { out += c; lastVowel = null; i++; continue; }
    const lower = c.toLowerCase();

    // Explicit ん before a vowel/y — "kon'ya" (こんや), not こにゃ
    if (lower === "n" && input[i+1] === "'") { out += nKana; lastVowel = null; i += 2; continue; }
    // Note: a doubled "nn" is deliberately NOT special-cased here — it's
    // extremely common as ん followed by a な-row mora ("annai" → あんない,
    // "konnichiwa" → こんにちわ*), which the normal match-then-fallback
    // flow below already gets right: the first n falls through to the
    // standalone-ん rule, then the second n matches na/ni/nu/ne/no normally.
    // (*this one exception is spelled こんにちは in real Japanese — a
    // dictionary-level irregularity no mechanical converter can know.)

    const seg3 = input.slice(i, i+3).toLowerCase();
    const seg2 = input.slice(i, i+2).toLowerCase();
    if (KANA_MAPS.m3.has(seg3)) {
      const pair = KANA_MAPS.m3.get(seg3);
      out += kata ? pair[1] : pair[0]; lastVowel = seg3.slice(-1); i += 3; continue;
    }
    if (KANA_MAPS.m2.has(seg2)) {
      const pair = KANA_MAPS.m2.get(seg2);
      out += kata ? pair[1] : pair[0]; lastVowel = seg2.slice(-1); i += 2; continue;
    }
    // Repeated vowel in katakana → long-vowel mark (コーヒー, not コオヒイ)
    if (kata && KANA_VOWELS.includes(lower) && lastVowel === lower) {
      out += "ー"; i += 1; continue;
    }
    if (KANA_MAPS.m1.has(lower)) {
      const pair = KANA_MAPS.m1.get(lower);
      out += kata ? pair[1] : pair[0]; lastVowel = lower; i += 1; continue;
    }
    // Bare "n" with nothing else matching (end of word, or before a
    // consonant) is a standalone ん
    if (lower === "n") { out += nKana; lastVowel = null; i += 1; continue; }
    // Doubled consonant → small tsu; consume only the first letter, so the
    // second one starts its own mora on the next pass ("kitte" → きって)
    if (TSU_CONSONANTS.has(lower) && input[i+1] && input[i+1].toLowerCase() === lower) {
      out += smallTsu; lastVowel = null; i += 1; continue;
    }
    // Nothing matched yet (e.g. a lone consonant still awaiting its vowel)
    // — leave it as-is; it'll convert once the rest of the mora is typed.
    out += c; lastVowel = null; i += 1;
  }
  return out;
}
// Wires live romaji→kana conversion onto a text input. getMode() returns
// "off" | "hira" | "kata"; re-runs the whole field through the converter on
// every keystroke, which is safe because kana/kanji/punctuation just pass
// through untouched — so mixing pasted kanji with typed romaji works fine.
function attachKanaInput(inputEl, getMode) {
  inputEl.addEventListener("input", () => {

    const after = romajiToKana(before, mode);
    if (after !== before) {
      inputEl.value = after;
      inputEl.setSelectionRange(after.length, after.length);
    }
  });
}

// =========================================================================
// CSV helpers
// =========================================================================
function parseCSV(txt) {
  // simple RFC-4180-ish parser
  const rows = [[]]; let field = ""; let quoted = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i], n = txt[i+1];
    if (quoted) {
      if (c === '"' && n === '"') { field += '"'; i++; }
      else if (c === '"') { quoted = false; }
      else { field += c; }
    } else {
      if (c === '"') { quoted = true; }
      else if (c === ",") { rows[rows.length-1].push(field); field = ""; }
      else if (c === "\n") { rows[rows.length-1].push(field); field = ""; rows.push([]); }
      else if (c === "\r") { /* skip */ }
      else { field += c; }
    }
  }
  if (field.length || rows[rows.length-1].length) { rows[rows.length-1].push(field); }
  return rows.filter(r => r.some(x => (x||"").trim().length));
}
function importCSV(txt, kind) {
  const rows = parseCSV(txt);
  if (!rows.length) return;
  const header = rows[0].map(s => (s||"").toLowerCase().trim());
  // Detect word column: look for 'word' or 'phrase'
  let wi = header.findIndex(h => h === "word" || h === "phrase");
  if (wi < 0) {
    // guess: first non-numeric column with text
    wi = 1;
  }
  const ri = header.findIndex(h => h.startsWith("reading"));
  const mi = header.findIndex(h => h.startsWith("meaning"));
  const exStart = header.findIndex(h => h.startsWith("example"));

  const pool = kind === "phrase" ? L().phrases : L().words;
  const idx = new Map(pool.map(c => [c.word.toLowerCase(), c]));
  let added = 0, merged = 0;
  for (const r of rows.slice(1)) {
    const w = (r[wi] || "").trim();
    if (!w) continue;
    const reading = ri >= 0 ? (r[ri] || "").trim() : "";
    const meaning = mi >= 0 ? (r[mi] || "").trim() : "";
    const examples = [];
    if (exStart >= 0) for (let j = exStart; j < r.length && j < exStart + 3; j++) {
      const v = (r[j]||"").trim(); if (v) examples.push(v);
    }
    const existing = idx.get(w.toLowerCase());
    if (existing) {
      if (reading && !existing.reading) existing.reading = reading;
      if (meaning && meaning.length > (existing.meaning||"").length) existing.meaning = meaning;
      for (const e of examples) if (!existing.examples.includes(e)) existing.examples.push(e);
      merged++;
    } else {
      pool.push({id: kind[0]+Date.now()+"_"+added, kind, word: w, reading, meaning, examples, my_sentence: "", box: 0, due: null, seen: 0, correct: 0});
      idx.set(w.toLowerCase(), pool[pool.length-1]);
      added++;
    }
  }
  saveState();
  toast(`Imported: ${added} new, ${merged} merged`);
}
function esc(v) {
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV(kind) {
  const pool = kind === "phrase" ? L().phrases : L().words;
  const header = ["Word","Reading","Meaning","Example 1","Example 2","Example 3","My sentence","Box","Due","Seen","Correct"];
  const lines = [header.map(esc).join(",")];
  for (const c of pool) {
    lines.push([c.word, c.reading||"", c.meaning, c.examples[0]||"", c.examples[1]||"", c.examples[2]||"",
                c.my_sentence||"", c.box||0, c.due||"", c.seen||0, c.correct||0].map(esc).join(","));
  }
  copyDownload(lines.join("\n"), `vocab-desk-${state.currentLang}-${kind}-${today()}.csv`, "text/csv");
}
function exportJSON() {
  copyDownload(JSON.stringify(state, null, 2), `vocab-desk-backup-${today()}.json`, "application/json");
}
function copyDownload(text, name, mime) {
  // This is a plain local file (not a sandboxed Artifact), so a real
  // download works — fall back to clipboard only if that somehow fails.
  try {
    const blob = new Blob([text], { type: `${mime};charset=utf-8` });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast(`Downloaded ${name}`);
  } catch (e) {
    navigator.clipboard.writeText(text).then(
      () => toast(`Copied ${name} to clipboard — paste into a file`),
      () => toast("Download failed — try again")
    );
  }
}

function switchLang(langId) {
  if (langId === state.currentLang || !LANGS[langId]) return;

// =========================================================================
// Cloud sync (Supabase) — a single JSON blob keyed by a user-chosen slot ID.
// Auto-save only ever pushes (never silently overwrites this device); both
// explicit pull and the connect flow ask before replacing either side.
// =========================================================================
function syncConfigured() {
  const s = state.sync;
  return !!(s && s.url && s.anonKey && s.slotId);
}
function supabaseHeaders() {
  return {
    "apikey": state.sync.anonKey,
    "Authorization": `Bearer ${state.sync.anonKey}`,
    "Content-Type": "application/json",
  };
}
// Everything except the sync credentials themselves — no point mirroring
// your own anon key back into your own data blob.
function syncPayload() {
  const { sync, ...rest } = state;
  return rest;
}
function saveLocalOnly() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
}
function genSlotId() {
  const bytes = crypto.getRandomValues(new Uint8Array(9));
  return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
}
function timeAgo(iso) {
  if (!iso) return "";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}
function syncStatusLabel() {
  const s = (state.sync && state.sync.status) || "off";
  switch (s) {
    case "syncing": return "Syncing…";
    case "synced":  return state.sync.lastPushedAt ? `Synced · ${timeAgo(state.sync.lastPushedAt)}` : "Synced";
    case "error":   return "Sync error — check connection";
    default:        return "Not connected";
  }
}
function updateSyncUI() {
  const el2 = document.getElementById("sync-status");
  if (el2) el2.textContent = syncStatusLabel();
  const dot = document.getElementById("sync-dot");
  if (dot) {
    dot.textContent = syncConfigured() ? syncStatusLabel() : "";
  }
}

let _syncTimer = null;
// Debounced auto-push, called from saveState() after every local edit.
function scheduleSync() {
  if (!syncConfigured()) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => pushToSupabase({ silent: true }), 2500);
}

async function pushToSupabase(opts = {}) {
  if (!syncConfigured()) return false;
  state.sync.status = "syncing";
  updateSyncUI();
  try {
    const body = [{ slot_id: state.sync.slotId, data: syncPayload(), updated_at: new Date().toISOString() }];
    const res = await fetch(`${state.sync.url}/rest/v1/kv_store`, {
      method: "POST",
      headers: { ...supabaseHeaders(), "Prefer": "resolution=merge-duplicates,return=representation" },
      body: JSON.stringify(body),
      // keepalive lets this request outlive a tab close/navigation — used
      // when flushing a pending edit before the page unloads.
      keepalive: !!opts.keepalive,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    const savedAt = (rows[0] && rows[0].updated_at) || new Date().toISOString();
    state.sync.lastPushedAt = savedAt;
    state.sync.remoteUpdatedAt = savedAt;
    state.sync.status = "synced";
    saveLocalOnly();
    if (!opts.silent) toast("Synced to cloud");
    updateSyncUI();
    return true;
  } catch (e) {
    state.sync.status = "error";
    saveLocalOnly();
    if (!opts.silent) toast("Sync failed — check your connection and credentials");
    updateSyncUI();
    return false;
  }
}
// Returns { data, updated_at } for the configured slot, or null if nothing
// remote yet / the request failed.
async function pullFromSupabase(opts = {}) {
  if (!syncConfigured()) return null;
  state.sync.status = "syncing";
  updateSyncUI();
  try {
    const url = `${state.sync.url}/rest/v1/kv_store?slot_id=eq.${encodeURIComponent(state.sync.slotId)}&select=data,updated_at`;
    const res = await fetch(url, { headers: supabaseHeaders() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    state.sync.status = "synced";
    saveLocalOnly();
    updateSyncUI();
    return rows.length ? rows[0] : null;
  } catch (e) {
    state.sync.status = "error";
    saveLocalOnly();
    if (!opts.silent) toast("Couldn't reach the cloud — check your connection and credentials");
    updateSyncUI();
    return null;
  }
}
// First-time setup: pull whatever's already at this slot (if anything) and
// let the user pick a direction rather than silently picking one for them.
async function connectSync(url, anonKey, slotId) {
  state.sync = state.sync || {};
  state.sync.url = url.trim().replace(/\/+$/, "");
  state.sync.anonKey = anonKey.trim();
  state.sync.slotId = slotId.trim();
  saveLocalOnly();

  const remote = await pullFromSupabase({ silent: true });
  if (remote && remote.data) {
    const proceed = confirm(
      `Found existing cloud data for this slot (last saved ${new Date(remote.updated_at).toLocaleString()}).\n\n` +
      `OK — load the cloud data onto this device (replaces what's here now).\n` +
      `Cancel — keep this device's data and overwrite the cloud with it.`
    );
    if (proceed) {
      const keepSync = state.sync;
      state = remote.data;
      state.sync = keepSync;
      state.sync.status = "synced";
      state.sync.remoteUpdatedAt = remote.updated_at;
      ensureLangReady(state.currentLang);
      saveLocalOnly();
      toast("Loaded from cloud");
      render();
      startSyncPolling();
      return;
    }
  }
  await pushToSupabase();
  toast("Connected — now syncing automatically");
  render();
  startSyncPolling();
}
// Boot-time auto-connect: unlike connectSync (used by the manual "Connect"
// button, where a confirm() dialog protects data the user might have just
// typed into a brand-new setup), this fires automatically on a page visit
// with nothing configured yet — there's no local data worth protecting in
// that case, so it just loads whatever's in Supabase straight away, no
// dialog. If the slot is genuinely empty (first-ever use of this slot),
// it pushes the local/seed state up as the starting point instead.
async function autoConnectSilent(url, anonKey, slotId) {
  state.sync = state.sync || {};
  state.sync.url = url.trim().replace(/\/+$/, "");
  state.sync.anonKey = anonKey.trim();
  state.sync.slotId = slotId.trim();
  saveLocalOnly();

  const remote = await pullFromSupabase({ silent: true });
  if (remote && remote.data) {
    const keepSync = state.sync;
    state = remote.data;
    state.sync = keepSync;
    state.sync.status = "synced";
    state.sync.remoteUpdatedAt = remote.updated_at;
    state.sync.lastPushedAt = remote.updated_at;
    ensureLangReady(state.currentLang);
    saveLocalOnly();
    render();
  } else {
    await pushToSupabase();
    render();
  }
  startSyncPolling();
}
function disconnectSync() {
  state.sync = { url: "", anonKey: "", slotId: "", lastPushedAt: null, remoteUpdatedAt: null, status: "off" };
  saveLocalOnly();
  clearInterval(_pollTimer);
  toast("Disconnected — your data stays on this device");
  render();
}
// Explicit manual sync: checks whether the cloud has moved since our last
// push (i.e. another device wrote to it) and asks before ever discarding
// either side; otherwise just pushes this device's current state.
async function manualSyncNow() {
  const remote = await pullFromSupabase();
  if (!remote) {
    if (state.sync.status !== "error") await pushToSupabase();
    return;
  }
  const remoteTime = new Date(remote.updated_at).getTime();
  const lastPushedTime = state.sync.lastPushedAt ? new Date(state.sync.lastPushedAt).getTime() : 0;
  if (remoteTime > lastPushedTime + 1000) {
    const proceed = confirm(
      `The cloud has changes from another device (saved ${new Date(remote.updated_at).toLocaleString()}) this device hasn't pulled yet.\n\n` +
      `OK — load the cloud version (replaces what's on this device).\n` +
      `Cancel — keep this device's version and overwrite the cloud with it.`
    );
    if (proceed) {
      const keepSync = state.sync;
      state = remote.data;
      state.sync = keepSync;
      state.sync.status = "synced";
      state.sync.remoteUpdatedAt = remote.updated_at;
      ensureLangReady(state.currentLang);
      saveLocalOnly();
      toast("Loaded from cloud");
      render();
      return;
    }
  }
  await pushToSupabase();
}
// Fully automatic pull: if the cloud is strictly newer than anything this
// device has pushed or already pulled, load it — no click, no confirm
// dialog. Safe for a single-user, few-devices setup: the only way to lose
// an edit is closing a tab mid-edit before it can push, which the
// visibilitychange/beforeunload flush below guards against.
let _autoPulling = false;
async function autoPullIfNewer(opts = {}) {
  if (!syncConfigured() || _autoPulling) return;
  _autoPulling = true;
  try {
    const remote = await pullFromSupabase({ silent: true });
    if (!remote) return;
    const remoteTime = new Date(remote.updated_at).getTime();
    const knownTime = Math.max(
      state.sync.lastPushedAt    ? new Date(state.sync.lastPushedAt).getTime()    : 0,
      state.sync.remoteUpdatedAt ? new Date(state.sync.remoteUpdatedAt).getTime() : 0
    );
    if (remoteTime > knownTime + 1000) {
      const keepSync = state.sync;
      state = remote.data;
      state.sync = keepSync;
      state.sync.status = "synced";
      state.sync.remoteUpdatedAt = remote.updated_at;
      state.sync.lastPushedAt = remote.updated_at;
      ensureLangReady(state.currentLang);
      saveLocalOnly();
      if (!opts.quiet) toast("Synced newer data from your other device");
      render();
    }
  } finally {
    _autoPulling = false;
  }
}
// Immediately flush any debounced push (used when the tab is about to lose
// focus or close) so an edit made seconds ago isn't stranded locally.
// keepalive is only used on actual unload — it caps request bodies around
// 64KB in most browsers, which this app's full state usually exceeds, so it
// is a best-effort attempt on close rather than the normal-case path.
function flushSyncNow(opts = {}) {
  if (!syncConfigured()) return;
  clearTimeout(_syncTimer);
  pushToSupabase({ silent: true, keepalive: !!opts.keepalive });
}

function renderSyncPanel() {
  const panel = el("div", { class: "data-panel", id: "sync-panel" });
  panel.appendChild(el("h3", {}, "Cloud sync"));

  if (!syncConfigured()) {
    panel.appendChild(el("p", {},
      "Back this up to Supabase so it survives a cleared browser and syncs across devices. Create a free project, run the setup SQL once, then paste the details below."));
    const urlIn = el("input", { type: "text", placeholder: "Project URL — https://xxxx.supabase.co",
      style: "width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:4px; background:transparent; color:var(--ink); font:inherit; margin-bottom:8px;" });
    const keyIn = el("input", { type: "text", placeholder: "anon public key",
      style: "width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:4px; background:transparent; color:var(--ink); font:inherit; margin-bottom:8px; font-family:var(--mono); font-size:12px;" });
    const slotRow = el("div", { style: "display:flex; gap:8px; margin-bottom:8px;" });
    const slotIn = el("input", { type: "text", placeholder: "slot ID — leave blank to generate one",
      style: "flex:1; padding:8px 10px; border:1px solid var(--rule); border-radius:4px; background:transparent; color:var(--ink); font:inherit; font-family:var(--mono); font-size:12px;" });
    const genBtn = el("button", { class: "btn", onclick: () => { slotIn.value = genSlotId(); } }, "Generate");
    slotRow.appendChild(slotIn); slotRow.appendChild(genBtn);

    const connectBtn = el("button", { class: "btn primary", onclick: async () => {
      const url = urlIn.value.trim(), key = keyIn.value.trim();
      let slot = slotIn.value.trim();
      if (!url || !key) { toast("Project URL and anon key are required"); return; }
      if (!slot) slot = genSlotId();
      connectBtn.disabled = true;
      await connectSync(url, key, slot);
    } }, "Connect");

    panel.appendChild(urlIn);
    panel.appendChild(keyIn);
    panel.appendChild(slotRow);
    panel.appendChild(connectBtn);
    panel.appendChild(el("p", { style: "font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:10px; line-height:1.6;" },
      "Anyone holding all three values can read/write this data — treat the slot ID like a password. To sync a second device, connect it with these exact same three values."));
  } else {
    panel.appendChild(el("p", { style: "font-family:var(--mono); font-size:11px; color:var(--muted); margin: -4px 0 12px; line-height:1.6;" },
      "Syncs automatically — on every edit, when you switch back to this tab, and every minute while it's open. \"Sync now\" is just a manual nudge if you're impatient or troubleshooting."));
    const row = el("div", { style: "display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;" });
    row.appendChild(el("div", { id: "sync-status", style: "font-family:var(--mono); font-size:12px; color:var(--muted);" }, syncStatusLabel()));
    const btns = el("div", { style: "display:flex; gap:8px;" });
    btns.appendChild(el("button", { class: "btn", onclick: () => manualSyncNow() }, "Sync now"));
    btns.appendChild(el("button", { class: "btn ghost warn", onclick: () => {
      if (confirm("Disconnect cloud sync? Your data stays on this device, but stops backing up.")) disconnectSync();
    } }, "Disconnect"));
    row.appendChild(btns);
    panel.appendChild(row);

    panel.appendChild(el("div", { style: "margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--muted);" },
      "Slot ID — paste this into another device to sync it there:"));
    const slotDisplay = el("input", { type: "text", readonly: true, value: state.sync.slotId,
      style: "width:100%; margin-top:4px; padding:8px 10px; border:1px solid var(--rule); border-radius:4px; background:var(--paper-2); color:var(--ink); font:inherit; font-family:var(--mono); font-size:12px;" });
    slotDisplay.onclick = () => slotDisplay.select();
    panel.appendChild(slotDisplay);
  }
  return panel;
}

// =========================================================================
// Nav & counts
// =========================================================================
function updateCounts() {
  const s = stats();
  const lang = LANGS[state.currentLang];
  document.getElementById("brandMark").textContent   = lang.brand;
  document.getElementById("brandMarkJp").textContent = lang.brandNative;
  document.getElementById("brandTag").textContent    = lang.tagline;
  // Daily nav badge shows the actionable number: cards due for review today.
  const daily = document.getElementById("c-daily");
  if (daily) daily.textContent = s.dueToday || "";
  const lib = document.getElementById("c-library");
  if (lib) lib.textContent = s.total || "";
  document.getElementById("streak").textContent     = L().streak || 0;
  document.getElementById("today-count").textContent = L().activity[today()] || 0;
  document.getElementById("triage-today-count").textContent = triageDoneToday();
  updateSyncUI();

  for (const b of document.querySelectorAll("#nav button")) {
    const m = b.dataset.mode;
    b.setAttribute("aria-current", m === currentMode ? "true" : "false");
  }
  for (const b of document.querySelectorAll("#langSwitch button")) {
    b.setAttribute("aria-current", b.dataset.lang === state.currentLang ? "true" : "false");
  }
}

document.getElementById("nav").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-mode]");
  if (!b) return;
  currentMode = b.dataset.mode;
  reviewIdx = 0; reviewFlipped = false; reviewEditing = false; reviewDraft = "";
  render();
});

document.getElementById("langSwitch").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-lang]");
  if (!b) return;
  switchLang(b.dataset.lang);
});

// Theme toggle: null → dark → light → null
document.getElementById("themeToggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? null : "dark";
  if (next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  state.theme = next; saveState();
});
if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
document.documentElement.setAttribute("data-lang", state.currentLang);

// Keyboard shortcuts (review only)
document.addEventListener("keydown", (e) => {
  if (currentMode !== "daily" || dailySubMode !== "review") return;
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); if (!reviewFlipped) { reviewFlipped = true; render(); } }
  else if (reviewFlipped && ["1","2","3","4"].includes(e.key)) {
    e.preventDefault();
    gradeAndAdvance({1:"again",2:"hard",3:"good",4:"easy"}[e.key]);
  }
});

render();
// Fully automatic two-way sync while the app is open:
//  - push already happens on every edit (debounced 2.5s, see saveState/scheduleSync)
//  - pull happens right on boot (right after the instant local-cache paint
//    above), whenever the tab regains focus, and every 60s while it stays
//    visible — silently, no button, no confirm dialog
//  - a pending push is flushed immediately when the tab is hidden or closed
if (syncConfigured()) autoPullIfNewer({ quiet: true });

let _pollTimer = null;
function startSyncPolling() {
  clearInterval(_pollTimer);
  if (!syncConfigured()) return;
  _pollTimer = setInterval(() => {
    if (document.visibilityState === "visible") autoPullIfNewer();
  }, 60000);
}
startSyncPolling();

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    autoPullIfNewer();
  } else {
    flushSyncNow();
  }
});
window.addEventListener("pagehide", () => flushSyncNow({ keepalive: true }));
window.addEventListener("beforeunload", () => flushSyncNow({ keepalive: true }));
