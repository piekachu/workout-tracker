<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workout Database</title>
  <link rel="stylesheet" href="../../shared/theme.css" />
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="site-nav">
      <a href="../../">Home</a>
      <a href="../" class="active">Workout</a>
      <a href="../../vocab/">Vocab</a>
    </nav>
    <h1>Workout Tracker</h1>
    <nav class="sub-nav">
      <a href="../">Log</a>
      <a href="./" class="active">Database</a>
      <a href="../manage/">Manage</a>
    </nav>
  </header>

  <main>
    <section id="calendar">
      <div class="cal-controls">
        <button type="button" class="carousel-arrow" id="cal-prev" aria-label="Previous month">‹</button>
        <div id="cal-month-label" class="cal-month-label"></div>
        <button type="button" class="carousel-arrow" id="cal-next" aria-label="Next month">›</button>
      </div>
      <div class="cal-weekdays">
        <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div class="cal-legend" id="cal-legend"></div>
    </section>

    <hr />

    <section id="day-detail" hidden>
      <div class="day-detail-head">
        <h2 id="day-detail-title"></h2>
        <button type="button" class="link-btn small warn" id="day-delete-btn">Delete this workout</button>
      </div>
      <div id="day-detail-body"></div>
    </section>
    <p class="empty" id="day-detail-empty">Tap a day with a workout logged to see it here.</p>
  </main>

  <script src="../assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../shared/icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
